<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.49.1/dist/apexcharts.min.js"></script>
</head>
<body>
<div id="rl-root">
  <div class="rl-topbar">
    <div>
      <h2 class="rl-h1">Fleet &amp; camera coverage</h2>
      <div class="rl-scope" id="rl-scope">Loading&hellip;</div>
    </div>
    <div class="rl-tools">
      <label class="rl-field">Location
        <select id="rl-branch"><option value="__all__">All locations</option></select>
      </label>
      <label class="rl-field" id="rl-sortwrap">Sort
        <select id="rl-sort">
          <option value="pct">Least complete first</option>
          <option value="pctd">Most complete first</option>
          <option value="fleet">Largest fleet first</option>
          <option value="name">Location name</option>
        </select>
      </label>
      <button type="button" id="rl-csv">Export CSV</button>
    </div>
  </div>

  <div class="rl-note" id="rl-stop"></div>
  <div class="rl-note" id="rl-warn"></div>

  <div id="rl-master">
    <div class="rl-hero" id="rl-hero"></div>
    <div class="rl-kpis" id="rl-kpis"></div>
    <div class="rl-chartcard">
      <div class="rl-legend" id="rl-legend"></div>
      <div id="rl-chart"></div>
    </div>
    <div class="rl-tablehead"><div class="rl-tabletitle">Every location</div></div>
    <div class="rl-tablewrap" id="rl-tablewrap"></div>
  </div>

  <div id="rl-detail" style="display:none"></div>

  <div class="rl-foot" id="rl-foot"></div>
</div>

<script>
geotab.addin.rollout = function () {
  'use strict';

  // ─────────────────────────────────────────────────────────────────────────
  // WHAT THIS PAGE COUNTS
  //
  // A VEHICLE is any Geotab asset carrying a VIN. Two kinds exist:
  //   deviceType 'GO9B'  a real GO9 is fitted
  //   deviceType 'None'  a PLACEHOLDER, created from the Enterprise export so
  //                      that a truck we own shows up here even with no
  //                      hardware in it. Lives in the "Placeholder · No Device"
  //                      group. Deleted automatically once a real GO9 reports
  //                      the same VIN.
  //
  // A SPARE is a GO9 with no VIN that has never reported — a unit still in its
  // box. Spares are NOT vehicles and never enter a coverage denominator. This
  // is the bug the previous version had: it divided by units shipped, so a
  // location with more devices than trucks scored under 50% while being fully
  // covered.
  //
  // DENOMINATOR = owned vehicles at the location, excluding On Order.
  // Rentals are reported separately and never count toward camera coverage —
  // rentals do not get cameras.
  // ─────────────────────────────────────────────────────────────────────────

  var GO9 = 'GO9B', NONE = 'None';
  var G_PLACEHOLDER = 'Placeholder · No Device';
  var G_ONORDER     = 'On Order';

  // Office groups are resolved from Geotab at runtime by name, so a new branch
  // appears here the moment its group exists. Only the display address is
  // local, and a missing entry degrades to a blank cell rather than a drop.
  var PLACE = {
    'ATL North':'Norcross, GA',      'ATL South':'Riverdale, GA',
    'American Fork':'American Fork, UT','Chicago':'Elgin, IL',
    'Cincinnati':'Sharonville, OH',  'Cleveland':'Brecksville, OH',
    'Columbus':'Columbus, OH',       'Detroit':'Ann Arbor, MI',
    'Grand Rapids':'Grand Rapids, MI','Indianapolis':'Indianapolis, IN',
    'Louisville':'Crestwood, KY',    'Northern Indy':'Merrillville, IN',
    'Orlando':'Orlando, FL',         'Tampa':'Tampa, FL'
  };

  var C = {
    camera:  '#185FA5',
    go9:     '#378ADD',
    nodev:   '#DAD8CF',
    rental:  '#7C6BB0',
    order:   '#B5D4F4',
    ink:     '#0b0b0b',
    sub:     '#52514e',
    line:    '#e1e0d9',
    good:    '#0ca30c',
    watch:   '#fab219',
    bad:     '#d03b3b'
  };

  var STYLE_ID = 'rl-styles';
  var CSS = [
    '#rl-root, #rl-root *{box-sizing:border-box;}',
    '#rl-root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;',
    '  color:' + C.ink + ';padding:18px 20px 28px;max-width:100%;overflow-x:hidden;}',
    '.rl-topbar{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start;justify-content:space-between;}',
    '.rl-h1{font-size:20px;font-weight:600;margin:0 0 3px;}',
    '.rl-scope{font-size:13px;color:' + C.sub + ';}',
    '.rl-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}',
    '.rl-field{font-size:12px;color:' + C.sub + ';display:flex;align-items:center;gap:5px;}',
    '.rl-field select{font-size:13px;padding:5px 7px;border:1px solid #c9c8c0;border-radius:6px;background:#fff;color:' + C.ink + ';}',
    '#rl-root button{font-size:13px;padding:6px 11px;border:1px solid #c9c8c0;border-radius:6px;',
    '  background:#fff;color:' + C.ink + ';cursor:pointer;}',
    '#rl-root button:hover{background:#f4f3ee;}',
    '.rl-note{display:none;margin:12px 0 0;padding:10px 12px;border-radius:8px;font-size:13px;line-height:1.5;}',
    '.rl-note.on{display:block;}',
    '#rl-stop{background:#fdecec;border:1px solid #f0b9b9;color:#7a1f1f;}',
    '#rl-warn{background:#fdf6e3;border:1px solid #ecd9a0;color:#6b5312;}',
    '.rl-hero{margin:18px 0 0;padding:16px 18px;border:1px solid ' + C.line + ';border-radius:12px;background:#fcfcfb;}',
    '.rl-hero-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;}',
    '.rl-hero-n{font-size:44px;font-weight:600;line-height:1;letter-spacing:-.5px;font-variant-numeric:tabular-nums;}',
    '.rl-hero-of{font-size:17px;color:' + C.sub + ';}',
    '.rl-hero-sub{font-size:13px;color:' + C.sub + ';margin-top:7px;line-height:1.5;}',
    '.rl-bar{margin-top:13px;height:14px;border-radius:7px;overflow:hidden;display:flex;background:' + C.nodev + ';}',
    '.rl-bar span{display:block;height:100%;}',
    '.rl-kpis{display:flex;flex-wrap:wrap;gap:12px;margin:14px 0 0;}',
    '.rl-kpi{flex:1 1 170px;border:1px solid ' + C.line + ';border-radius:10px;padding:11px 13px;background:#fff;}',
    '.rl-kpi-l{font-size:12px;color:' + C.sub + ';margin-bottom:3px;}',
    '.rl-kpi-v{font-size:23px;font-weight:600;font-variant-numeric:tabular-nums;}',
    '.rl-kpi-s{font-size:12px;color:' + C.sub + ';margin-top:2px;}',
    '.rl-chartcard{margin:18px 0 0;padding:14px 12px 4px;border:1px solid ' + C.line + ';',
    '  border-radius:12px;background:#fff;overflow:visible;}',
    '.rl-legend{display:flex;flex-wrap:wrap;gap:14px;padding:0 4px 8px;font-size:12px;color:' + C.sub + ';}',
    '.rl-legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px;}',
    '.rl-foot{font-size:12px;color:' + C.sub + ';line-height:1.6;margin:16px 2px 0;}',
    '.rl-tablehead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:24px 0 8px;}',
    '.rl-tabletitle{font-size:15px;font-weight:600;}',
    '.rl-tablewrap{border:1px solid ' + C.line + ';border-radius:10px;background:#fff;overflow-x:auto;}',
    'table.rl-t{width:100%;border-collapse:collapse;font-size:13px;}',
    'table.rl-t th,table.rl-t td{padding:8px 11px;text-align:left;border-bottom:1px solid #eeede7;white-space:nowrap;}',
    'table.rl-t th{position:sticky;top:0;background:#faf9f5;font-weight:600;font-size:12px;color:' + C.sub + ';z-index:1;}',
    'table.rl-t td.n,table.rl-t th.n{text-align:right;font-variant-numeric:tabular-nums;}',
    'table.rl-t tr:last-child td{border-bottom:none;}',
    'table.rl-t tr.rl-zero td{background:#fdf6f6;}',
    'table.rl-t tr.rl-tot td{font-weight:600;background:#faf9f5;}',
    '.rl-pill{display:inline-block;padding:1px 7px;border-radius:20px;font-size:11px;font-weight:600;color:#fff;}',
    '.rl-link{color:#185FA5;cursor:pointer;text-decoration:none;}',
    '.rl-link:hover{text-decoration:underline;}',
    // ── vehicle-state chips ────────────────────────────────────────────────
    '.rl-chip{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;',
    '  white-space:nowrap;border:1px solid transparent;}',
    '.rl-chip.cam{background:#e6f2e6;color:#0a6b0a;border-color:#bfe0bf;}',
    '.rl-chip.go9{background:#fdf3dd;color:#7a5a08;border-color:#eeddb0;}',
    '.rl-chip.nod{background:#f2f1ec;color:#5a5852;border-color:#dedcd3;}',
    '.rl-chip.ord{background:#eaf3fd;color:#1b4f83;border-color:#c6ddf5;}',
    // ── branch detail ──────────────────────────────────────────────────────
    '.rl-sec{margin:22px 0 0;}',
    '.rl-sech{display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;justify-content:space-between;margin:0 2px 8px;}',
    '.rl-sect{font-size:15px;font-weight:600;}',
    '.rl-secn{font-size:12px;color:' + C.sub + ';}',
    '.rl-vin{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:' + C.sub + ';}',
    '.rl-tn{font-weight:600;}',
    '.rl-empty{padding:14px 12px;font-size:13px;color:' + C.sub + ';}',
    '.rl-back{margin:0 0 2px;}',
    '@media (max-width:700px){',
    '  #rl-root{padding:14px 12px 22px;}',
    '  .rl-hero-n{font-size:36px;}',
    '  table.rl-t th, table.rl-t td{padding:7px 8px;white-space:normal;}',
    '}'
  ].join('\n');
  function injectStyles(){
    if(document.getElementById(STYLE_ID)) return;
    var s=document.createElement('style'); s.id=STYLE_ID; s.textContent=CSS;
    document.head.appendChild(s);
  }

  // ── helpers ──────────────────────────────────────────────────────────────
  function el(id){ return document.getElementById(id); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function f0(v){ return Math.round(v).toLocaleString(); }
  function pctOf(a,b){ return b>0 ? (100*a/b) : 0; }
  function note(id,msg){ var n=el(id); if(!n) return;
    if(msg){ n.innerHTML=msg; n.className='rl-note on'; } else { n.className='rl-note'; n.textContent=''; } }
  function gradeColor(p){ return p>=80?C.good : p>=40?C.watch : C.bad; }

  var apiRef=null, stateRef=null, chart=null, model=null, lastWidth=0;
  var resizeObs=null, resizeTimer=null, pollTimer=null, pointerInChart=false;
  var current='__all__';

  // ── data ─────────────────────────────────────────────────────────────────
  function load(){
    apiRef.multiCall([
      ['Get', { typeName:'Device', resultsLimit:50000 }],
      ['Get', { typeName:'Camera', resultsLimit:50000 }],
      ['Get', { typeName:'Group',  resultsLimit:5000 }],
      ['Get', { typeName:'Property', resultsLimit:5000 }]
    ], function(res){
      try { model=build(res[0]||[], res[1]||[], res[2]||[], res[3]||[]); render(); }
      catch(e){ note('rl-stop','Could not build the coverage view: '+esc(e && e.message || e)); }
    }, function(err){
      note('rl-stop','Geotab call failed: '+esc(err && err.message || err));
    });
  }

  function build(devices, cameras, groups, props){
    // Resolve group ids by NAME. Ids differ between databases and a wrong id
    // fails silently as a permanently-empty column.
    var gname={}, byName={};
    (groups||[]).forEach(function(g){
      if(!g || !g.id) return;
      gname[g.id]=g.name;
      if(g.name) byName[String(g.name).trim()]=g;
    });
    var phId    = byName[G_PLACEHOLDER] ? byName[G_PLACEHOLDER].id : null;
    var orderId = byName[G_ONORDER]     ? byName[G_ONORDER].id     : null;

    // Export dates ride in the placeholder group's comments field — the only
    // writable free-text the add-in can read without baking data into a public
    // repo. Format: "owned=YYYY-MM-DD rental=YYYY-MM-DD | <description>"
    var stamps={owned:null, rental:null};
    if(byName[G_PLACEHOLDER]){
      var cm=String(byName[G_PLACEHOLDER].comments||'');
      var mo=cm.match(/owned=(\d{4}-\d{2}-\d{2})/); if(mo) stamps.owned=mo[1];
      var mr=cm.match(/rental=(\d{4}-\d{2}-\d{2})/); if(mr) stamps.rental=mr[1];
    }

    // Ownership property, matched by name.
    var ownPropId=null;
    (props||[]).forEach(function(p){
      if(p && String(p.name||'').trim()==='Ownership') ownPropId=p.id;
    });
    function ownershipOf(d){
      var cp=d.customProperties||[];
      for(var i=0;i<cp.length;i++){
        var c=cp[i];
        if(c && c.property && c.property.id===ownPropId && c.value) return String(c.value);
      }
      return '';
    }

    // Cameras key off the GO serial, not the device id. A placeholder has no
    // serial, so it can never match one — which is correct.
    var camSerial={};
    (cameras||[]).forEach(function(cm){
      var s=(cm && cm.deviceSerialNumber || '').trim();
      if(s) camSerial[s]=true;
    });

    // Which office groups actually exist, in the order we want to show them.
    var offices=[];
    Object.keys(PLACE).forEach(function(n){
      if(byName[n]) offices.push({ id:byName[n].id, name:n, place:PLACE[n] });
    });
    var officeIds={}; offices.forEach(function(o){ officeIds[o.id]=o.name; });

    var vehicles=[], spares=0, sparesLive=0, unassignedDevices=0;

    (devices||[]).forEach(function(d){
      if(!d) return;
      var type=d.deviceType;
      if(type!==GO9 && type!==NONE) return;

      var serial=(d.serialNumber||'').trim();
      var vin=(d.vehicleIdentificationNumber||'').trim().toUpperCase();
      var grp=(d.groups||[]).map(function(g){ return g && g.id; });
      var office=null;
      for(var i=0;i<grp.length;i++){ if(officeIds[grp[i]]){ office=officeIds[grp[i]]; break; } }

      // No VIN = not a vehicle. A GO9 with no VIN is either a spare in its box
      // or a unit fitted but never identified. Counted, never listed.
      if(!vin){
        if(type===GO9){
          spares++;
          if(office) sparesLive++;      // sitting at a branch, likely fitted
          else unassignedDevices++;     // no location group at all
        }
        return;
      }

      var isPlaceholder = (type===NONE);
      var onOrder = orderId && grp.indexOf(orderId)>=0;
      var own = ownershipOf(d);
      var hasCam = !!(serial && camSerial[serial]);

      var state = onOrder ? 'order'
                : isPlaceholder ? 'nodev'
                : hasCam ? 'camera' : 'go9';

      vehicles.push({
        id:d.id, name:(d.name||'').trim(), vin:vin, serial:serial,
        office:office, ownership:own || (isPlaceholder?'':'Unconfirmed'),
        year:d.vinInfoYear||'', make:d.vinInfoMake||'', modelName:d.vinInfoModel||'',
        plate:(d.licensePlate||'').trim(),
        placeholder:isPlaceholder, onOrder:!!onOrder, camera:hasCam, state:state
      });
    });

    // Per-office rollup. Denominator is OWNED, on-order excluded.
    var rows=offices.map(function(o){
      var mine=vehicles.filter(function(v){ return v.office===o.name; });
      var owned  = mine.filter(function(v){ return v.ownership==='Owned' && !v.onOrder; });
      var rental = mine.filter(function(v){ return v.ownership==='Rental' && !v.onOrder; });
      var order  = mine.filter(function(v){ return v.onOrder; });
      var withDev = owned.filter(function(v){ return !v.placeholder; });
      var withCam = owned.filter(function(v){ return v.camera; });
      return {
        id:o.id, office:o.name, place:o.place,
        fleet:owned.length,
        device:withDev.length,
        camera:withCam.length,
        nodev:owned.length-withDev.length,
        go9only:withDev.length-withCam.length,
        rental:rental.length,
        rentalDev:rental.filter(function(v){ return !v.placeholder; }).length,
        order:order.length,
        pct:pctOf(withCam.length, owned.length),
        devPct:pctOf(withDev.length, owned.length)
      };
    });

    var t={fleet:0,device:0,camera:0,nodev:0,go9only:0,rental:0,rentalDev:0,order:0};
    rows.forEach(function(r){
      t.fleet+=r.fleet; t.device+=r.device; t.camera+=r.camera; t.nodev+=r.nodev;
      t.go9only+=r.go9only; t.rental+=r.rental; t.rentalDev+=r.rentalDev; t.order+=r.order;
    });

    // Role scoping: an office user only sees their own assets, so a zero row is
    // indistinguishable from "not started". Only claim a full-fleet view when
    // more than one office is actually visible.
    var visible=rows.filter(function(r){ return r.fleet||r.rental||r.order; });
    return {
      rows:rows, totals:t, vehicles:vehicles, offices:offices,
      spares:spares, sparesLive:sparesLive, unassigned:unassignedDevices,
      stamps:stamps, full:visible.length>1, visible:visible,
      hasPlaceholderGroup:!!phId
    };
  }

  // ── render ───────────────────────────────────────────────────────────────
  function render(){
    if(!model) return;
    syncBranchOptions();
    if(current==='__all__'){
      el('rl-master').style.display='';
      el('rl-detail').style.display='none';
      el('rl-sortwrap').style.display='';
      renderMaster();
    } else {
      el('rl-master').style.display='none';
      el('rl-detail').style.display='';
      el('rl-sortwrap').style.display='none';
      renderBranch(current);
    }
    renderFoot();
  }

  function syncBranchOptions(){
    var sel=el('rl-branch');
    if(sel.options.length>1) return;          // built once
    model.visible.forEach(function(r){
      var o=document.createElement('option');
      o.value=r.office; o.textContent=r.office;
      sel.appendChild(o);
    });
    // A scoped user sees exactly one office — open straight into it.
    if(!model.full && model.visible.length===1){
      current=model.visible[0].office;
      sel.value=current;
    }
  }

  function sortedRows(){
    var how=el('rl-sort').value, rows=model.rows.slice();
    rows.sort(function(a,b){
      if(how==='pct')   return a.pct-b.pct || b.fleet-a.fleet;
      if(how==='pctd')  return b.pct-a.pct || b.fleet-a.fleet;
      if(how==='fleet') return b.fleet-a.fleet;
      return a.office.localeCompare(b.office);
    });
    return rows;
  }

  function renderMaster(){
    var t=model.totals;
    var pct=pctOf(t.camera,t.fleet);
    el('rl-scope').textContent =
      model.full
        ? (f0(t.fleet)+' owned vehicles across '+model.visible.length+' locations · live from Geotab')
        : 'Showing only the locations your account can see';

    el('rl-hero').innerHTML =
      '<div class="rl-hero-top">' +
        '<div class="rl-hero-n">' + f0(t.camera) + '</div>' +
        '<div class="rl-hero-of">of ' + f0(t.fleet) + ' owned vehicles have a camera</div>' +
      '</div>' +
      '<div class="rl-hero-sub">' +
        pct.toFixed(0) + '% camera coverage. ' + f0(t.device) + ' of ' + f0(t.fleet) +
        ' have a GO9 fitted (' + pctOf(t.device,t.fleet).toFixed(0) + '%). ' +
        (t.nodev ? '<b>' + f0(t.nodev) + '</b> owned vehicles still have no device.' : 'Every owned vehicle has a device.') +
      '</div>' +
      '<div class="rl-bar">' +
        '<span style="width:' + pctOf(t.camera,t.fleet) + '%;background:' + C.camera + '"></span>' +
        '<span style="width:' + pctOf(t.go9only,t.fleet) + '%;background:' + C.go9 + '"></span>' +
      '</div>';

    el('rl-kpis').innerHTML = [
      kpi('Owned vehicles', f0(t.fleet), 'the coverage denominator'),
      kpi('GO9 fitted', f0(t.device), pctOf(t.device,t.fleet).toFixed(0)+'% of owned'),
      kpi('Cameras fitted', f0(t.camera), pctOf(t.camera,t.fleet).toFixed(0)+'% of owned · target 100%'),
      kpi('No device yet', f0(t.nodev), 'owned vehicles awaiting a GO9'),
      kpi('Rentals', f0(t.rental), t.rentalDev+' with a device · no cameras by design'),
      kpi('Spare GO9s', f0(model.spares), model.unassigned+' unassigned to a location')
    ].join('');

    el('rl-legend').innerHTML =
      lg(C.camera,'GO9 + camera') + lg(C.go9,'GO9, no camera') +
      lg(C.nodev,'No device') + lg(C.rental,'Rental') + lg(C.order,'On order');

    renderChart(sortedRows());
    renderMasterTable(sortedRows(), t);
  }

  function kpi(l,v,s){
    return '<div class="rl-kpi"><div class="rl-kpi-l">' + esc(l) + '</div>' +
           '<div class="rl-kpi-v">' + v + '</div><div class="rl-kpi-s">' + esc(s) + '</div></div>';
  }
  function lg(c,l){ return '<span><i style="background:' + c + '"></i>' + esc(l) + '</span>'; }

  function renderChart(rows){
    var host=el('rl-chart'); if(!host || typeof ApexCharts==='undefined') return;
    var card=host.parentNode, avail=card.clientWidth||700;
    var cats=rows.map(function(r){ return r.office; });
    var opts={
      chart:{ type:'bar', stacked:true, height:Math.max(300, rows.length*34+90),
              width:'100%', toolbar:{show:false}, animations:{enabled:false},
              fontFamily:'inherit',
              events:{ dataPointSelection:function(e,ctx,cfg){
                var r=rows[cfg.dataPointIndex]; if(r){ current=r.office; el('rl-branch').value=r.office; render(); }
              } } },
      plotOptions:{ bar:{ horizontal:true, barHeight:'62%' } },
      dataLabels:{ enabled:false },
      series:[
        { name:'GO9 + camera',   data:rows.map(function(r){ return r.camera; }) },
        { name:'GO9, no camera', data:rows.map(function(r){ return r.go9only; }) },
        { name:'No device',      data:rows.map(function(r){ return r.nodev; }) },
        { name:'On order',       data:rows.map(function(r){ return r.order; }) }
      ],
      colors:[C.camera, C.go9, C.nodev, C.order],
      xaxis:{ categories:cats, title:{ text:'Owned vehicles', style:{fontSize:'11px',fontWeight:400,color:C.sub} },
              labels:{ style:{colors:C.sub,fontSize:'11px'} } },
      yaxis:{ labels:{ style:{colors:C.ink,fontSize:'12px'} } },
      legend:{ show:false },
      grid:{ borderColor:'#eeede7' },
      tooltip:{ shared:true, intersect:false,
        y:{ formatter:function(v){ return f0(v)+' vehicles'; } },
        custom:undefined },
      states:{ active:{ filter:{type:'none'} } }
    };
    if(chart){ try{ chart.destroy(); }catch(e){} chart=null; }
    host.innerHTML='';
    chart=new ApexCharts(host, opts);
    chart.render();
    lastWidth=card.clientWidth||avail;
    host.onmouseenter=function(){ pointerInChart=true; };
    host.onmouseleave=function(){ pointerInChart=false; };
  }

  function renderMasterTable(rows,t){
    var h=['<table class="rl-t"><thead><tr>',
      '<th>Location</th><th>Site</th>',
      '<th class="n">Owned</th><th class="n">GO9</th><th class="n">Cameras</th>',
      '<th class="n">No device</th><th class="n">Rentals</th><th class="n">On order</th>',
      '<th class="n">Camera %</th>',
      '</tr></thead><tbody>'];
    rows.forEach(function(r){
      h.push('<tr class="' + (r.fleet?'':'rl-zero') + '">' +
        '<td><a class="rl-link" data-b="' + esc(r.office) + '">' + esc(r.office) + '</a></td>' +
        '<td>' + esc(r.place) + '</td>' +
        '<td class="n">' + f0(r.fleet) + '</td>' +
        '<td class="n">' + f0(r.device) + '</td>' +
        '<td class="n">' + f0(r.camera) + '</td>' +
        '<td class="n">' + (r.nodev ? '<b>'+f0(r.nodev)+'</b>' : '0') + '</td>' +
        '<td class="n">' + f0(r.rental) + '</td>' +
        '<td class="n">' + f0(r.order) + '</td>' +
        '<td class="n"><span class="rl-pill" style="background:' + gradeColor(r.pct) + '">' +
          r.pct.toFixed(0) + '%</span></td></tr>');
    });
    h.push('<tr class="rl-tot"><td>Total</td><td></td>' +
      '<td class="n">' + f0(t.fleet) + '</td><td class="n">' + f0(t.device) + '</td>' +
      '<td class="n">' + f0(t.camera) + '</td><td class="n">' + f0(t.nodev) + '</td>' +
      '<td class="n">' + f0(t.rental) + '</td><td class="n">' + f0(t.order) + '</td>' +
      '<td class="n">' + pctOf(t.camera,t.fleet).toFixed(0) + '%</td></tr>');
    h.push('</tbody></table>');
    var wrap=el('rl-tablewrap');
    wrap.innerHTML=h.join('');
    Array.prototype.forEach.call(wrap.querySelectorAll('a.rl-link'), function(a){
      a.onclick=function(){ current=a.getAttribute('data-b'); el('rl-branch').value=current; render(); };
    });
  }

  // ── one location ─────────────────────────────────────────────────────────
  function chip(v){
    if(v.onOrder)     return '<span class="rl-chip ord">On order</span>';
    if(v.placeholder) return '<span class="rl-chip nod">No device</span>';
    if(v.camera)      return '<span class="rl-chip cam">Camera</span>';
    return '<span class="rl-chip go9">GO9 only</span>';
  }
  // Work first: no device, then GO9-without-camera, then done.
  function workOrder(v){ return v.placeholder?0 : (!v.camera?1:2); }

  function vehicleTable(list, opts){
    if(!list.length) return '<div class="rl-tablewrap"><div class="rl-empty">' + esc(opts.empty) + '</div></div>';
    var showCam = opts.showCamera !== false;
    var h=['<div class="rl-tablewrap"><table class="rl-t"><thead><tr>',
      '<th>Truck #</th><th>Model</th><th class="n">Year</th><th>VIN</th><th>Plate</th>',
      showCam ? '<th>Camera</th>' : '<th>Device</th>',
      '</tr></thead><tbody>'];
    list.forEach(function(v){
      var mm=[v.make, v.modelName].filter(Boolean).join(' ');
      h.push('<tr>' +
        '<td><a class="rl-link rl-tn" data-d="' + esc(v.id) + '">' + esc(v.name||'—') + '</a></td>' +
        '<td>' + esc(mm||'—') + '</td>' +
        '<td class="n">' + esc(v.year||'—') + '</td>' +
        '<td class="rl-vin">' + esc(v.vin) + '</td>' +
        '<td>' + esc(v.plate||'—') + '</td>' +
        '<td>' + chip(v) + '</td>' +
      '</tr>');
    });
    h.push('</tbody></table></div>');
    return h.join('');
  }

  function renderBranch(name){
    var r=null;
    model.rows.forEach(function(x){ if(x.office===name) r=x; });
    if(!r){ el('rl-detail').innerHTML='<div class="rl-empty">No data for '+esc(name)+'.</div>'; return; }

    var mine=model.vehicles.filter(function(v){ return v.office===name; });
    var owned  = mine.filter(function(v){ return v.ownership==='Owned' && !v.onOrder; }).sort(function(a,b){
      return workOrder(a)-workOrder(b) || String(a.name).localeCompare(String(b.name)); });
    var rental = mine.filter(function(v){ return v.ownership==='Rental' && !v.onOrder; }).sort(function(a,b){
      return workOrder(a)-workOrder(b) || String(a.name).localeCompare(String(b.name)); });
    var order  = mine.filter(function(v){ return v.onOrder; }).sort(function(a,b){
      return String(a.name).localeCompare(String(b.name)); });

    el('rl-scope').textContent = r.place + ' · live from Geotab';

    var pct=r.pct;
    var head =
      '<div class="rl-back"><a class="rl-link" id="rl-all">&larr; All locations</a></div>' +
      '<div class="rl-hero">' +
        '<div class="rl-hero-top">' +
          '<div class="rl-hero-n">' + f0(r.camera) + '</div>' +
          '<div class="rl-hero-of">of ' + f0(r.fleet) + ' owned vehicles at ' + esc(name) + ' have a camera</div>' +
        '</div>' +
        '<div class="rl-hero-sub">' +
          pct.toFixed(0) + '% camera coverage · ' + f0(r.device) + ' with a GO9 · ' +
          (r.nodev ? '<b>' + f0(r.nodev) + ' with no device</b>' : 'all fitted') +
          (r.order ? ' · ' + f0(r.order) + ' on order' : '') +
        '</div>' +
        '<div class="rl-bar">' +
          '<span style="width:' + pctOf(r.camera,r.fleet) + '%;background:' + C.camera + '"></span>' +
          '<span style="width:' + pctOf(r.go9only,r.fleet) + '%;background:' + C.go9 + '"></span>' +
        '</div>' +
      '</div>' +
      '<div class="rl-kpis">' +
        kpi('Owned', f0(r.fleet), 'vehicles on record here') +
        kpi('Cameras', f0(r.camera), 'target is 100% of owned') +
        kpi('Missing a camera', f0(r.fleet-r.camera), 'the work list below') +
        kpi('Rentals', f0(r.rental), 'no cameras by design') +
      '</div>';

    var body =
      sec('Owned vehicles', owned.length + ' · ' + r.camera + ' with a camera, ' +
          r.go9only + ' GO9 only, ' + r.nodev + ' no device',
          vehicleTable(owned,{empty:'No owned vehicles recorded at this location.'})) +
      sec('Rentals', rental.length + ' currently on rent · rentals do not get cameras',
          vehicleTable(rental,{empty:'No rentals at this location.'})) +
      (order.length ? sec('On order', order.length + ' not yet delivered · excluded from coverage',
          vehicleTable(order,{empty:''})) : '');

    el('rl-detail').innerHTML = head + body;
    var back=el('rl-all');
    if(back) back.onclick=function(){ current='__all__'; el('rl-branch').value='__all__'; render(); };
    Array.prototype.forEach.call(el('rl-detail').querySelectorAll('a[data-d]'), function(a){
      a.onclick=function(){ goToDevice(a.getAttribute('data-d')); };
    });
  }

  function sec(title,sub,inner){
    return '<div class="rl-sec"><div class="rl-sech">' +
      '<div class="rl-sect">' + esc(title) + '</div>' +
      '<div class="rl-secn">' + esc(sub) + '</div>' +
    '</div>' + inner + '</div>';
  }

  function renderFoot(){
    var s=model.stamps;
    var bits=[];
    bits.push('<b>Owned vehicles</b> come from the Enterprise Fleet Management export' +
      (s.owned ? ', last imported <b>'+esc(s.owned)+'</b>' : '') +
      '. <b>Rentals</b> come from the weekly Open RA report' +
      (s.rental ? ', last imported <b>'+esc(s.rental)+'</b>' : '') + '.');
    bits.push('<b>No device</b> means the vehicle is on the Enterprise export but no GO9 has ever reported its VIN. ' +
      'These are placeholder records in the &ldquo;' + esc(G_PLACEHOLDER) + '&rdquo; group and disappear on their own once hardware is fitted.');
    bits.push('<b>Camera %</b> is cameras &divide; owned vehicles at that location — not units shipped. ' +
      'Rentals and on-order vehicles are excluded from the denominator.');
    bits.push('<b>Spare GO9s:</b> ' + f0(model.spares) + ' units carry no VIN and are not counted as vehicles' +
      (model.unassigned ? ' — ' + f0(model.unassigned) + ' of them are not assigned to any location group' : '') +
      (model.sparesLive ? ', and ' + f0(model.sparesLive) + ' sit in a location group but have never reported a VIN' : '') + '.');
    if(!model.full) bits.push('Your account is scoped to a single location, so fleet-wide totals are not shown.');
    el('rl-foot').innerHTML = bits.join('<br>');
  }

  function goToDevice(id){
    if(!(stateRef && typeof stateRef.gotoPage==='function')) return;
    try { stateRef.gotoPage('device', { id:id }); } catch(e){}
  }

  function exportCsv(){
    if(!model) return;
    var lines, name;
    if(current==='__all__'){
      lines=[['Location','Site','Owned','GO9','Cameras','No device','Rentals','On order','Camera %'].join(',')];
      sortedRows().forEach(function(r){
        lines.push(csvRow([r.office,r.place,r.fleet,r.device,r.camera,r.nodev,r.rental,r.order,r.pct.toFixed(0)]));
      });
      name='fleet-camera-coverage.csv';
    } else {
      lines=[['Location','Section','Truck #','Model','Year','VIN','Plate','State'].join(',')];
      model.vehicles.filter(function(v){ return v.office===current; }).forEach(function(v){
        var sect=v.onOrder?'On order':(v.ownership==='Rental'?'Rental':'Owned');
        var st=v.onOrder?'On order':v.placeholder?'No device':v.camera?'Camera':'GO9 only';
        lines.push(csvRow([current,sect,v.name,[v.make,v.modelName].filter(Boolean).join(' '),v.year,v.vin,v.plate,st]));
      });
      name='fleet-'+current.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'.csv';
    }
    var blob=new Blob([lines.join('\n')], {type:'text/csv;charset=utf-8;'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  }
  function csvRow(vals){
    return vals.map(function(v){
      var s=String(v==null?'':v); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
    }).join(',');
  }

  // ── resize (same self-healing pattern as violin/topSpeed) ────────────────
  function watchResize(){
    var card=el('rl-chart') && el('rl-chart').parentNode;
    if(!card) return;
    function onResize(){
      var w=card.clientWidth;
      if(!model || current!=='__all__' || !w || Math.abs(w-lastWidth)<16) return;
      clearTimeout(resizeTimer);
      function attempt(){
        if(pointerInChart){ resizeTimer=setTimeout(attempt,250); return; }
        renderChart(sortedRows());
      }
      resizeTimer=setTimeout(attempt,140);
    }
    if(typeof ResizeObserver==='function'){
      resizeObs=new ResizeObserver(onResize);   // keep the reference — GC risk
      resizeObs.observe(card);
    }
    window.addEventListener('resize', onResize);
    clearInterval(pollTimer);
    pollTimer=setInterval(onResize, 400);       // RO delivery stops in hidden tabs
  }

  return {
    initialize: function(api, state, cb){
      apiRef=api; stateRef=state;
      injectStyles();
      var s=el('rl-sort');   if(s) s.onchange=render;
      var b=el('rl-branch'); if(b) b.onchange=function(){ current=b.value; render(); };
      var c=el('rl-csv');    if(c) c.onclick=exportCsv;
      watchResize();
      cb();
    },
    focus: function(api, state){
      apiRef=api; stateRef=state;
      load();
    },
    blur: function(){
      clearTimeout(resizeTimer); clearInterval(pollTimer);
      if(resizeObs){ try{ resizeObs.disconnect(); }catch(e){} }
    }
  };
};
</script>
</body>
</html>

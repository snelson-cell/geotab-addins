<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.49.1/dist/apexcharts.min.js"></script>
</head>
<body>
<div id="rl-root">
  <div class="rl-topbar">
    <div>
      <h2 class="rl-h1">GO9 &amp; camera rollout</h2>
      <div class="rl-scope" id="rl-scope">Loading…</div>
    </div>
    <div class="rl-tools">
      <label class="rl-field">Sort
        <select id="rl-sort">
          <option value="pct">Least complete first</option>
          <option value="pctd">Most complete first</option>
          <option value="ordered">Most shipped first</option>
          <option value="name">Office name</option>
        </select>
      </label>
      <button type="button" id="rl-csv">Export CSV</button>
    </div>
  </div>

  <div class="rl-note" id="rl-stop"></div>
  <div class="rl-note" id="rl-warn"></div>

  <div class="rl-hero" id="rl-hero"></div>
  <div class="rl-kpis" id="rl-kpis"></div>

  <div class="rl-chartcard">
    <div class="rl-legend" id="rl-legend"></div>
    <div id="rl-chart"></div>
  </div>
  <div class="rl-foot" id="rl-foot"></div>

  <div class="rl-tablehead">
    <div class="rl-tabletitle">Every location</div>
  </div>
  <div class="rl-tablewrap" id="rl-tablewrap"></div>
</div>

<script>
geotab.addin.rollout = function () {
  'use strict';

  // ── Shipment table ───────────────────────────────────────────────────────
  // This is the ONE input that does not come from Geotab. It is what ops
  // shipped to each location. Everything else on this page is read live.
  // UPDATE THIS when a new shipment goes out, or the "remaining" column lies.
  // Last updated 2026-08-01 (506 units).
  var ORDERED = [
    { id:'b27AD', office:'ATL North',    place:'Norcross, GA',           ordered:57 },
    { id:'b27B3', office:'Detroit',      place:'Ann Arbor, MI',          ordered:56 },
    { id:'b27AC', office:'Tampa',        place:'Tampa, FL',              ordered:52 },
    { id:'b27B7', office:'Columbus',     place:'Columbus, OH',           ordered:39 },
    { id:'b27AE', office:'ATL South',    place:'Riverdale, GA',          ordered:37 },
    { id:'b27B5', office:'Cincinnati',   place:'Sharonville, OH',        ordered:36 },
    { id:'b27B6', office:'Cleveland',    place:'Brecksville, OH',        ordered:36 },
    { id:'b27AF', office:'Chicago',      place:'Elgin, IL',              ordered:35 },
    { id:'b27B0', office:'Indianapolis', place:'Indianapolis, IN',       ordered:35 },
    { id:'b27AB', office:'Orlando',      place:'Orlando, FL',            ordered:33 },
    { id:'b27B1', office:'Northern IN',  place:'Merrillville, IN',       ordered:30 },
    { id:'b27B8', office:'Utah',         place:'American Fork + Lindon', ordered:23 },
    { id:'b27B4', office:'Grand Rapids', place:'Grand Rapids, MI',       ordered:20 },
    { id:'b27B2', office:'Louisville',   place:'Crestwood, KY',          ordered:17 }
  ];
  var FLEET_TOTAL = 506;      // sanity check against what Geotab returns
  var GO9 = 'GO9B';           // productId 124

  // Sequential single-hue ramp + gray. Deliberately NOT a red/green scale:
  // the four stages are ordered, so lightness carries the meaning and nothing
  // depends on telling two hues apart (see README, CVD notes).
  var C = {
    camera:  '#185FA5',
    vinned:  '#378ADD',
    atSite:  '#B5D4F4',
    remain:  '#DAD8CF',
    ink:     '#0b0b0b',
    sub:     '#52514e',
    line:    '#e1e0d9',
    good:    '#0ca30c',
    watch:   '#fab219',
    bad:     '#d03b3b'
  };

  var STYLE_ID = 'rl-styles';
  var CSS = [
    '#rl-root, #rl-root *{box-sizing:border-box;}',
    '#rl-root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;',
    '  color:' + C.ink + ';padding:18px 20px 28px;max-width:100%;overflow-x:hidden;}',
    '.rl-topbar{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start;justify-content:space-between;}',
    '.rl-h1{font-size:20px;font-weight:600;margin:0 0 3px;}',
    '.rl-scope{font-size:13px;color:' + C.sub + ';}',
    '.rl-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}',
    '.rl-field{font-size:12px;color:' + C.sub + ';display:flex;align-items:center;gap:5px;}',
    '.rl-field select{font-size:13px;padding:5px 7px;border:1px solid #c9c8c0;border-radius:6px;background:#fff;color:' + C.ink + ';}',
    '#rl-root button{font-size:13px;padding:6px 11px;border:1px solid #c9c8c0;border-radius:6px;',
    '  background:#fff;color:' + C.ink + ';cursor:pointer;}',
    '#rl-root button:hover{background:#f4f3ee;}',
    '.rl-note{display:none;margin:12px 0 0;padding:10px 12px;border-radius:8px;font-size:13px;line-height:1.5;}',
    '.rl-note.on{display:block;}',
    '#rl-stop{background:#fdecec;border:1px solid #f0b9b9;color:#7a1f1f;}',
    '#rl-warn{background:#fdf6e3;border:1px solid #ecd9a0;color:#6b5312;}',
    '.rl-hero{margin:18px 0 0;padding:16px 18px;border:1px solid ' + C.line + ';border-radius:12px;background:#fcfcfb;}',
    '.rl-hero-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;}',
    '.rl-hero-n{font-size:44px;font-weight:600;line-height:1;letter-spacing:-.5px;font-variant-numeric:tabular-nums;}',
    '.rl-hero-of{font-size:17px;color:' + C.sub + ';}',
    '.rl-hero-sub{font-size:13px;color:' + C.sub + ';margin-top:7px;line-height:1.5;}',
    '.rl-bar{margin-top:13px;height:14px;border-radius:7px;overflow:hidden;display:flex;background:' + C.remain + ';}',
    '.rl-bar span{display:block;height:100%;}',
    '.rl-kpis{display:flex;flex-wrap:wrap;gap:12px;margin:14px 0 0;}',
    '.rl-kpi{flex:1 1 170px;border:1px solid ' + C.line + ';border-radius:10px;padding:11px 13px;background:#fff;}',
    '.rl-kpi-l{font-size:12px;color:' + C.sub + ';margin-bottom:3px;}',
    '.rl-kpi-v{font-size:23px;font-weight:600;font-variant-numeric:tabular-nums;}',
    '.rl-kpi-s{font-size:12px;color:' + C.sub + ';margin-top:2px;}',
    '.rl-chartcard{margin:18px 0 0;padding:14px 12px 4px;border:1px solid ' + C.line + ';',
    '  border-radius:12px;background:#fff;overflow:visible;}',
    '.rl-legend{display:flex;flex-wrap:wrap;gap:14px;padding:0 4px 8px;font-size:12px;color:' + C.sub + ';}',
    '.rl-legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px;}',
    '.rl-foot{font-size:12px;color:' + C.sub + ';line-height:1.6;margin:10px 2px 0;}',
    '.rl-tablehead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:24px 0 8px;}',
    '.rl-tabletitle{font-size:15px;font-weight:600;}',
    '.rl-tablewrap{border:1px solid ' + C.line + ';border-radius:10px;background:#fff;}',
    'table.rl-t{width:100%;border-collapse:collapse;font-size:13px;}',
    'table.rl-t th,table.rl-t td{padding:8px 11px;text-align:left;border-bottom:1px solid #eeede7;white-space:nowrap;}',
    'table.rl-t th{position:sticky;top:0;background:#faf9f5;font-weight:600;font-size:12px;color:' + C.sub + ';z-index:1;}',
    'table.rl-t td.n,table.rl-t th.n{text-align:right;font-variant-numeric:tabular-nums;}',
    'table.rl-t tr:last-child td{border-bottom:none;}',
    'table.rl-t tr.rl-zero td{background:#fdf6f6;}',
    'table.rl-t tr.rl-tot td{font-weight:600;background:#faf9f5;}',
    '.rl-pill{display:inline-block;padding:1px 7px;border-radius:20px;font-size:11px;font-weight:600;color:#fff;}',
    '.rl-link{color:#185FA5;cursor:pointer;text-decoration:none;}',
    '.rl-link:hover{text-decoration:underline;}',
    '@media (max-width:700px){',
    '  #rl-root{padding:14px 12px 22px;}',
    '  .rl-hero-n{font-size:36px;}',
    '  table.rl-t th, table.rl-t td{padding:7px 8px;white-space:normal;}',
    '}'
  ].join('\n');
  function injectStyles(){
    if(document.getElementById(STYLE_ID)) return;
    var s=document.createElement('style'); s.id=STYLE_ID; s.textContent=CSS;
    document.head.appendChild(s);
  }

  // ── helpers ──────────────────────────────────────────────────────────────
  function el(id){ return document.getElementById(id); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function f0(v){ return Math.round(v).toLocaleString(); }
  function pctOf(a,b){ return b>0 ? (100*a/b) : 0; }
  function note(id,msg){ var n=el(id); if(!n) return;
    if(msg){ n.innerHTML=msg; n.className='rl-note on'; } else { n.className='rl-note'; n.textContent=''; } }
  function gradeColor(p){ return p>=80?C.good : p>=40?C.watch : C.bad; }

  var apiRef=null, stateRef=null, chart=null, lastRows=null, lastWidth=0;
  var resizeObs=null, resizeTimer=null, pollTimer=null, pointerInChart=false;

  // ── data ─────────────────────────────────────────────────────────────────
  function load(){
    apiRef.multiCall([
      ['Get', { typeName:'Device' }],
      ['Get', { typeName:'Camera' }],
      ['Get', { typeName:'Group' }]
    ], function(res){
      try { build(res[0]||[], res[1]||[], res[2]||[]); }
      catch(e){ note('rl-stop','Could not build the rollout view: '+esc(e && e.message || e)); }
    }, function(err){
      note('rl-stop','Geotab call failed: '+esc(err && err.message || err));
    });
  }

  function build(devices, cameras, groups){
    var gname={}; (groups||[]).forEach(function(g){ if(g && g.id) gname[g.id]=g.name; });

    // camera records key off the GO device serial, not the device id
    var camSerial={};
    (cameras||[]).forEach(function(cm){
      var s=(cm && cm.deviceSerialNumber || '').trim();
      if(s) camSerial[s]=cm;
    });

    var go9=(devices||[]).filter(function(d){ return d && d.deviceType===GO9; });
    if(!go9.length){
      note('rl-stop','No GO9 devices are visible to your account. Nothing to report.');
      return;
    }

    var byOffice={}, officeIds={};
    ORDERED.forEach(function(o){
      officeIds[o.id]=true;
      byOffice[o.id]={ atSite:0, vinned:0, camera:0, dupe:0 };
    });

    var loose={ total:0, vinned:0, camera:0, named:0 };
    var multi=0;
    go9.forEach(function(d){
      var serial=(d.serialNumber||'').trim();
      var vin=(d.vehicleIdentificationNumber||'').trim();
      var hasCam=!!(serial && camSerial[serial]);
      var mine=[];
      (d.groups||[]).forEach(function(g){ if(g && officeIds[g.id]) mine.push(g.id); });
      if(mine.length){
        if(mine.length>1) multi++;
        var r=byOffice[mine[0]];          // count each device once
        r.atSite++;
        if(vin) r.vinned++;
        if(hasCam) r.camera++;
      } else {
        loose.total++;
        if(vin) loose.vinned++;
        if(hasCam) loose.camera++;
        // a device still named after its serial has never been commissioned
        if(serial && d.name && d.name.trim()!==serial) loose.named++;
      }
    });

    // Role scoping: an office user sees only their own devices, so a zero row
    // would be indistinguishable from "not started". Only claim a full-fleet
    // view when we can actually see the whole fleet.
    var full = go9.length >= FLEET_TOTAL*0.9;
    var rows=ORDERED.map(function(o){
      var r=byOffice[o.id];
      var remain=Math.max(0, o.ordered - r.atSite);
      return {
        id:o.id, office:o.office, place:o.place, ordered:o.ordered,
        atSite:r.atSite, vinned:r.vinned, camera:r.camera,
        pending:Math.max(0, r.atSite - r.vinned), remain:remain,
        over:Math.max(0, r.atSite - o.ordered),
        pct:pctOf(r.vinned, o.ordered),
        camPct:pctOf(r.camera, r.vinned)
      };
    }).filter(function(r){ return full || r.atSite>0; });

    lastRows={ rows:rows, loose:loose, full:full, go9:go9.length,
               cameras:(cameras||[]).length, multi:multi };
    render();
  }

  // ── render ───────────────────────────────────────────────────────────────
  function render(){
    if(!lastRows) return;
    var rows=lastRows.rows.slice(), d=lastRows;
    var mode=(el('rl-sort')||{}).value || 'pct';
    rows.sort(function(a,b){
      if(mode==='pct')     return a.pct-b.pct || b.ordered-a.ordered;
      if(mode==='pctd')    return b.pct-a.pct || b.ordered-a.ordered;
      if(mode==='ordered') return b.ordered-a.ordered;
      return a.office.localeCompare(b.office);
    });

    var t={ ordered:0, atSite:0, vinned:0, camera:0, pending:0, remain:0 };
    rows.forEach(function(r){
      t.ordered+=r.ordered; t.atSite+=r.atSite; t.vinned+=r.vinned;
      t.camera+=r.camera; t.pending+=r.pending; t.remain+=r.remain;
    });

    el('rl-scope').textContent = d.full
      ? 'All ' + f0(d.go9) + ' GO9 units across ' + rows.length + ' locations · live from Geotab'
      : 'Scoped to your access — ' + f0(d.go9) + ' GO9 units across ' + rows.length + ' location(s)';

    var installPct = pctOf(t.vinned, t.ordered);
    el('rl-hero').innerHTML =
      '<div class="rl-hero-top">' +
        '<div class="rl-hero-n">' + f0(t.vinned) + '</div>' +
        '<div class="rl-hero-of">of ' + f0(t.ordered) + ' shipped units are installed and reporting a VIN</div>' +
      '</div>' +
      '<div class="rl-bar">' +
        '<span style="width:' + pctOf(t.camera,t.ordered).toFixed(2) + '%;background:' + C.camera + '"></span>' +
        '<span style="width:' + pctOf(t.vinned-t.camera,t.ordered).toFixed(2) + '%;background:' + C.vinned + '"></span>' +
        '<span style="width:' + pctOf(t.pending,t.ordered).toFixed(2) + '%;background:' + C.atSite + '"></span>' +
      '</div>' +
      '<div class="rl-hero-sub">' + installPct.toFixed(0) + '% installed. ' +
        f0(t.camera) + ' of those also have a camera. ' +
        f0(t.remain) + ' units are shipped but not yet assigned to a location in Geotab.' +
      '</div>';

    var started=rows.filter(function(r){ return r.vinned>0; }).length;
    el('rl-kpis').innerHTML = [
      kpi('Shipped', f0(t.ordered), 'from the ops shipment table'),
      kpi('Installed', f0(t.vinned), installPct.toFixed(0) + '% of shipped'),
      kpi('Cameras fitted', f0(t.camera), pctOf(t.camera,t.vinned).toFixed(0) + '% of installed units'),
      kpi('Locations started', started + ' / ' + rows.length,
          (rows.length-started) + ' with nothing installed')
    ].join('');

    el('rl-legend').innerHTML =
      '<span><i style="background:' + C.camera + '"></i>Installed + camera</span>' +
      '<span><i style="background:' + C.vinned + '"></i>Installed, no camera</span>' +
      '<span><i style="background:' + C.atSite + '"></i>Assigned, not yet installed</span>' +
      '<span><i style="background:' + C.remain + '"></i>Shipped, not assigned</span>';

    renderChart(rows);
    renderTable(rows, t);

    var foot=[];
    foot.push('<b>Installed</b> means the GO9 has decoded a VIN — it is plugged into a vehicle and reporting. ' +
              '<b>Assigned</b> means it sits in that location&rsquo;s Geotab group but has not reported a VIN yet.');
    if(d.loose.total){
      foot.push(f0(d.loose.total) + ' GO9 units are in no location group at all' +
        (d.loose.vinned ? ' (' + f0(d.loose.vinned) + ' of them have a VIN, so they are installed but ungrouped)'
                        : ' and none has reported a VIN, so none is installed') + '.' +
        (d.loose.named ? ' ' + f0(d.loose.named) + ' have been renamed off their serial number.' : ''));
    }
    if(d.multi) foot.push(d.multi + ' unit(s) belong to more than one location group and are counted once, under the first.');
    if(!d.full) foot.push('Your account cannot see the whole fleet, so locations you have no access to are hidden rather than shown as zero.');
    var over=rows.filter(function(r){ return r.over>0; });
    if(over.length) foot.push('More units are assigned than were shipped at: ' +
      over.map(function(r){ return esc(r.office)+' (+'+r.over+')'; }).join(', ') +
      ' — the shipment table in this file is probably out of date.');
    el('rl-foot').innerHTML = foot.join('<br>');

    if(d.full && d.go9 !== FLEET_TOTAL){
      note('rl-warn','Geotab reports ' + f0(d.go9) + ' GO9 units but the shipment table totals ' +
        f0(FLEET_TOTAL) + '. Update <code>ORDERED</code> in rollout.html after each shipment.');
    } else { note('rl-warn',''); }
  }

  function kpi(label, val, sub){
    return '<div class="rl-kpi"><div class="rl-kpi-l">' + esc(label) + '</div>' +
           '<div class="rl-kpi-v">' + esc(val) + '</div>' +
           '<div class="rl-kpi-s">' + esc(sub) + '</div></div>';
  }

  function renderChart(rows){
    var host=el('rl-chart'); if(!host) return;
    var card=host.parentNode;
    var avail=Math.max(320, (card.clientWidth||host.clientWidth||700) - 24);
    var h=Math.max(260, rows.length*34 + 70);

    var cats=rows.map(function(r){ return r.office; });
    var series=[
      { name:'Installed + camera',        data:rows.map(function(r){ return r.camera; }) },
      { name:'Installed, no camera',      data:rows.map(function(r){ return r.vinned-r.camera; }) },
      { name:'Assigned, not installed',   data:rows.map(function(r){ return r.pending; }) },
      { name:'Shipped, not assigned',     data:rows.map(function(r){ return r.remain; }) }
    ];

    var opts={
      chart:{ type:'bar', stacked:true, height:h, width:avail,
        toolbar:{show:false}, animations:{enabled:false},
        fontFamily:'-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif',
        events:{
          dataPointSelection:function(e,ctx,cfg){
            var r=rows[cfg.dataPointIndex]; if(r) goToDevices(r);
          }
        }
      },
      plotOptions:{ bar:{ horizontal:true, barHeight:'62%', borderRadius:3,
        borderRadiusApplication:'end', borderRadiusWhenStacked:'last' } },
      series:series,
      colors:[C.camera, C.vinned, C.atSite, C.remain],
      dataLabels:{ enabled:false },
      legend:{ show:false },
      grid:{ borderColor:C.line, strokeDashArray:0,
        xaxis:{lines:{show:true}}, yaxis:{lines:{show:false}} },
      // On a horizontal bar the CATEGORY axis is still xaxis.categories —
      // omit it and Apex falls back to numeric indices, which also collapses
      // the plot area because it auto-ranges instead of using the band scale.
      xaxis:{ categories:cats,
        title:{ text:'GO9 units', style:{fontSize:'11px', color:C.sub, fontWeight:400} },
        labels:{ style:{colors:C.sub, fontSize:'11px'},
          formatter:function(v){ return f0(v); } },
        axisTicks:{show:false} },
      yaxis:{ labels:{ style:{colors:C.ink, fontSize:'12px'}, minWidth:96 } },
      tooltip:{ shared:true, intersect:false,
        custom:function(o){
          var r=rows[o.dataPointIndex]; if(!r) return '';
          return '<div style="padding:9px 11px;font-size:12px;line-height:1.6;max-width:260px">' +
            '<div style="font-weight:600;font-size:13px">' + esc(r.office) + '</div>' +
            '<div style="color:' + C.sub + '">' + esc(r.place) + '</div>' +
            '<div style="margin-top:6px">Shipped <b>' + f0(r.ordered) + '</b></div>' +
            '<div>Installed <b>' + f0(r.vinned) + '</b> (' + r.pct.toFixed(0) + '%)</div>' +
            '<div>Cameras <b>' + f0(r.camera) + '</b>' +
              (r.vinned ? ' (' + r.camPct.toFixed(0) + '% of installed)' : '') + '</div>' +
            (r.pending ? '<div>Assigned, awaiting install <b>' + f0(r.pending) + '</b></div>' : '') +
            (r.remain ? '<div>Not yet assigned <b>' + f0(r.remain) + '</b></div>' : '') +
            '<div style="margin-top:6px;color:' + C.sub + '">Click to open this location&rsquo;s assets</div>' +
          '</div>';
        }
      },
      states:{ active:{ filter:{type:'none'} } }
    };

    if(chart){ try{ chart.destroy(); }catch(e){} chart=null; }
    host.innerHTML='';
    chart=new ApexCharts(host, opts);
    chart.render();
    lastWidth=card.clientWidth||avail;

    host.onmouseenter=function(){ pointerInChart=true; };
    host.onmouseleave=function(){ pointerInChart=false; };
  }

  function renderTable(rows, t){
    var h=['<table class="rl-t"><thead><tr>',
      '<th>Location</th><th>Site</th>',
      '<th class="n">Shipped</th><th class="n">Assigned</th><th class="n">Installed</th>',
      '<th class="n">Cameras</th><th class="n">Not assigned</th><th class="n">Installed %</th>',
      '</tr></thead><tbody>'];
    rows.forEach(function(r){
      h.push('<tr class="' + (r.vinned?'':'rl-zero') + '">' +
        '<td><a class="rl-link" data-g="' + esc(r.id) + '">' + esc(r.office) + '</a></td>' +
        '<td>' + esc(r.place) + '</td>' +
        '<td class="n">' + f0(r.ordered) + '</td>' +
        '<td class="n">' + f0(r.atSite) + '</td>' +
        '<td class="n">' + f0(r.vinned) + '</td>' +
        '<td class="n">' + f0(r.camera) + '</td>' +
        '<td class="n">' + f0(r.remain) + '</td>' +
        '<td class="n"><span class="rl-pill" style="background:' + gradeColor(r.pct) + '">' +
          r.pct.toFixed(0) + '%</span></td></tr>');
    });
    h.push('<tr class="rl-tot"><td>Total</td><td></td>' +
      '<td class="n">' + f0(t.ordered) + '</td>' +
      '<td class="n">' + f0(t.atSite) + '</td>' +
      '<td class="n">' + f0(t.vinned) + '</td>' +
      '<td class="n">' + f0(t.camera) + '</td>' +
      '<td class="n">' + f0(t.remain) + '</td>' +
      '<td class="n">' + pctOf(t.vinned,t.ordered).toFixed(0) + '%</td></tr>');
    h.push('</tbody></table>');
    var wrap=el('rl-tablewrap');
    wrap.innerHTML=h.join('');
    Array.prototype.forEach.call(wrap.querySelectorAll('a.rl-link'), function(a){
      a.onclick=function(){
        var id=a.getAttribute('data-g');
        var r=null;
        lastRows.rows.forEach(function(x){ if(x.id===id) r=x; });
        if(r) goToDevices(r);
      };
    });
  }

  // Drill through to the asset list filtered to this location's group.
  // NOTE: unlike the tripsHistory contract in violin.html, these parameter
  // names have NOT been verified against a URL MyGeotab wrote itself. If it
  // lands on an unfiltered list, select a group by hand and diff the URL.
  function goToDevices(r){
    if(!(stateRef && typeof stateRef.gotoPage==='function')) return;
    try {
      stateRef.gotoPage('devices', { groups:[r.id] });
    } catch(e){}
  }

  function exportCsv(){
    if(!lastRows) return;
    var head=['Location','Site','Shipped','Assigned','Installed','Cameras','Not assigned','Installed %'];
    var lines=[head.join(',')];
    lastRows.rows.forEach(function(r){
      lines.push([r.office, r.place, r.ordered, r.atSite, r.vinned, r.camera,
                  r.remain, r.pct.toFixed(0)].map(function(v){
        var s=String(v); return /[",]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
      }).join(','));
    });
    var blob=new Blob([lines.join('\n')], {type:'text/csv;charset=utf-8;'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='go9-rollout.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  }

  // ── resize (same self-healing pattern as violin/topSpeed) ────────────────
  function watchResize(){
    var card=el('rl-chart') && el('rl-chart').parentNode;
    if(!card) return;
    function onResize(){
      var w=card.clientWidth;
      if(!lastRows || !w || Math.abs(w-lastWidth)<16) return;
      clearTimeout(resizeTimer);
      function attempt(){
        if(pointerInChart){ resizeTimer=setTimeout(attempt,250); return; }
        render();
      }
      resizeTimer=setTimeout(attempt,140);
    }
    if(typeof ResizeObserver==='function'){
      resizeObs=new ResizeObserver(onResize);   // keep the reference — GC risk
      resizeObs.observe(card);
    }
    window.addEventListener('resize', onResize);
    clearInterval(pollTimer);
    pollTimer=setInterval(onResize, 400);       // RO delivery stops in hidden tabs
  }

  return {
    initialize: function(api, state, cb){
      apiRef=api; stateRef=state;
      injectStyles();
      var s=el('rl-sort'); if(s) s.onchange=render;
      var c=el('rl-csv');  if(c) c.onclick=exportCsv;
      watchResize();
      cb();
    },
    focus: function(api, state){
      apiRef=api; stateRef=state;
      load();
    },
    blur: function(){
      clearTimeout(resizeTimer); clearInterval(pollTimer);
      if(resizeObs){ try{ resizeObs.disconnect(); }catch(e){} }
    }
  };
};
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>Driver Assignments</title>
</head>
<body>
<div id="da-root">
  <div class="da-topbar">
    <div>
      <h1 class="da-h1">Driver assignment</h1>
      <p class="da-scope" id="da-scope">Loading…</p>
    </div>
    <div class="da-controls">
      <label class="da-lab">Location
        <select id="da-office"><option value="">All locations</option></select>
      </label>
      <button type="button" id="da-csv" class="da-btn">Export CSV</button>
    </div>
  </div>

  <div id="da-notes"></div>
  <div id="da-kpis" class="da-kpis"></div>

  <div class="da-head">
    <div class="da-title" id="da-listtitle">Roster</div>
    <div class="da-tools"><button type="button" id="da-gaps">Only without a truck</button></div>
  </div>
  <div class="da-card" id="da-list"></div>

  <div class="da-head">
    <div class="da-title" id="da-veh-title">Trucks with nobody assigned</div>
  </div>
  <div class="da-card" id="da-vehicles"></div>
  <div class="da-awaiting" id="da-awaiting"></div>

  <div class="da-head" id="da-byloc-head">
    <div class="da-title">By location</div>
  </div>
  <div class="da-card" id="da-bylocation"></div>

  <div class="da-foot" id="da-foot"></div>
</div>

<script>
geotab.addin.driverAssignments = function () {
  'use strict';

  // MyGeotab drops this file's <head>, so the stylesheet ships as a string and is
  // injected from JS. Same as every other add-in here.
  var STYLE_ID = 'da-styles';
  var CSS = [
    '#da-root{',
    '  --page:#f9f9f7; --surface:#fcfcfb; --ink-1:#0b0b0b; --ink-2:#52514e; --ink-3:#898781;',
    '  --grid:#e1e0d9; --hairline:rgba(11,11,11,.10); --sunk:#f0efe9;',
    '  --good:#0ca30c; --warning:#fab219; --critical:#d03b3b;',
    '  --good-ink:#0a6b18; --warning-ink:#7a5300; --critical-ink:#9b2626;',
    '  --accent:#2a78d6;',
    '  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;',
    '  color:var(--ink-1); background:var(--page); padding:18px 20px 32px; width:100%;}',
    '#da-root, #da-root *{box-sizing:border-box;}',
    '#da-root.busy{opacity:.55;}',
    '.da-topbar{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:12px;}',
    '.da-h1{font-size:19px;font-weight:650;margin:0;letter-spacing:-.01em;}',
    '.da-scope{font-size:12.5px;color:var(--ink-3);margin:3px 0 0;}',
    '.da-controls{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;}',
    '.da-lab{font-size:11px;color:var(--ink-3);display:flex;flex-direction:column;gap:3px;}',
    '.da-lab select{font-size:13px;padding:5px 8px;border:1px solid var(--grid);border-radius:6px;background:#fff;color:var(--ink-1);}',
    '.da-btn{font-size:12.5px;padding:6px 11px;border:1px solid var(--grid);border-radius:6px;background:#fff;color:var(--ink-2);cursor:pointer;}',
    '.da-btn:hover{border-color:var(--ink-3);}',
    '.da-note{font-size:12.5px;padding:9px 12px;border-radius:7px;margin:12px 0 0;',
    '  background:#fdf6e3;border:1px solid #f0e2bd;color:#6b5316;}',
    '.da-note.err{background:#fdeceb;border-color:#f3c9c5;color:#8f2a22;}',

    '.da-action{margin:16px 0 0;padding:13px 16px;background:var(--surface);',
    '  border:1px solid var(--grid);border-left:3px solid var(--critical);',
    '  border-radius:0 9px 9px 0;font-size:13.5px;color:var(--ink-2);}',
    '.da-action.clear{border-left-color:var(--good);}',
    '.da-action b{color:var(--ink-1);}',

    '.da-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:12px 0 0;}',
    '.da-kpi{background:var(--surface);border:1px solid var(--grid);border-radius:9px;padding:12px 14px;}',
    '.da-kpi .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);}',
    '.da-kpi .v{font-size:25px;font-weight:680;letter-spacing:-.02em;line-height:1.15;margin-top:2px;',
    '  font-variant-numeric:tabular-nums;}',
    '.da-kpi .s{font-size:11.5px;color:var(--ink-3);margin-top:1px;}',

    '.da-head{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 8px;gap:12px;}',
    '.da-title{font-size:15px;font-weight:640;letter-spacing:-.005em;}',
    '.da-tools button{font-size:11.5px;padding:3px 9px;border:1px solid var(--grid);',
    '  border-radius:5px;background:#fff;color:var(--ink-3);cursor:pointer;}',
    '.da-tools button:hover{border-color:var(--ink-3);color:var(--ink-1);}',
    '.da-card{border:1px solid var(--grid);border-radius:9px;background:var(--surface);overflow-x:auto;}',

    '.da-t{border-collapse:collapse;width:100%;font-size:13px;min-width:720px;}',
    '.da-t th,.da-t td{padding:7px 10px;text-align:left;border-bottom:1px solid #eeede7;',
    '  white-space:nowrap;}',
    '.da-t th{position:sticky;top:0;background:#faf9f5;font-weight:600;font-size:12px;',
    '  color:var(--ink-2);z-index:1;cursor:pointer;}',
    '.da-t th:hover{background:#f2f1ea;}',
    '.da-t tr:hover td{background:#fbfaf6;}',
    '.da-t tr:last-child td{border-bottom:none;}',
    '.da-t td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}',
    '.da-t td.nm{font-weight:600;color:var(--ink-1);white-space:nowrap;}',
    '.da-t td.mut{color:var(--ink-3);}',
    '.da-t tr.sel td{background:#eef4fb;}',
    '.da-btn.on,.da-tools button.on{background:var(--ink-1);color:#fff;border-color:var(--ink-1);}',
    '.da-empty{padding:26px 14px;text-align:center;color:var(--ink-3);font-size:13px;}',
    'a.da-link{color:#185FA5;text-decoration:none;}',
    'a.da-link:hover{text-decoration:underline;}',
    '.da-pill{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;',
    '  padding:1px 7px;border-radius:20px;}',
    '.da-pill.new{background:#e7eff8;color:#1d5fa8;}',
    '.da-pill.late{background:#f8e8e3;color:var(--critical-ink);}',
    '.da-pill.unk{background:var(--sunk);color:var(--ink-2);}',
    '.da-bar{height:5px;border-radius:3px;background:var(--grid);margin-top:5px;overflow:hidden;min-width:70px;}',
    '.da-bar i{display:block;height:100%;border-radius:3px;}',
    '.da-sub{font-size:11.5px;color:var(--ink-3);}',
    '.da-awaiting{margin:8px 2px 0;font-size:12.5px;color:var(--ink-3);}',
    '.da-awaiting b{color:var(--ink-2);}',
    '.da-foot{margin:22px 0 0;font-size:12px;color:var(--ink-3);max-width:82ch;line-height:1.6;}',
    '.da-foot p{margin:0 0 7px;}'
  ].join('\n');

  function injectStyles(){
    if(document.getElementById(STYLE_ID)) return;
    var s=document.createElement('style'); s.id=STYLE_ID; s.textContent=CSS;
    document.head.appendChild(s);
  }

  // Offices, as group ids. Same map the other add-ins carry.
  var OFFICES = {
    'b27AB':'Orlando','b27AC':'Tampa','b27AD':'ATL North','b27AE':'ATL South',
    'b27AF':'Chicago','b27B0':'Indianapolis','b27B1':'Northern Indy','b27B2':'Louisville',
    'b27B3':'Detroit','b27B4':'Grand Rapids','b27B5':'Cincinnati','b27B6':'Cleveland',
    'b27B7':'Columbus','b27B8':'American Fork'
  };

  // A driver is HCS if a nightly Rippling sync stamped their worker id into
  // employeeNo. Managers and office staff never get one, so this is the filter --
  // no title matching, no name matching, nothing to drift.
  var ONBOARD_DAYS = 3;   // a new hire has this long before the gap counts
  var MIN_MILES    = 50;  // below this in the window, "it drove" means nothing
  var WINDOW_DAYS  = 14;

  var apiRef=null, MODEL=null, officeFilter='', loading=false, gapsOnly=false;
  var sortKey='name', sortDir=1;

  function el(id){ return document.getElementById(id); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function f0(n){ return (n==null||!isFinite(n)) ? '–' : Math.round(n).toLocaleString(); }
  function pct(a,b){ return b>0 ? 100*a/b : 0; }
  function daysAgo(t){
    if(!t) return 'unknown';
    var d=Math.round((Date.now()-t)/864e5);
    return d<=0 ? 'today' : d===1 ? 'yesterday' : d+' days ago';
  }
  function note(html, err){
    var d=document.createElement('div'); d.className='da-note'+(err?' err':'');
    d.innerHTML=html; el('da-notes').appendChild(d);
  }
  function userUrl(id){
    return id ? location.origin+location.pathname+'#user,currentTab:user,id:'+id : null;
  }
  function deviceUrl(id){
    return id ? location.origin+location.pathname+'#device,id:'+id : null;
  }
  function linked(cls, url, text, title){
    return url ? '<a class="'+cls+'" href="'+esc(url)+'" target="_blank" rel="noopener"'+
                 (title?' title="'+esc(title)+'"':'')+'>'+esc(text)+'</a>' : esc(text);
  }

  // hired:YYYY-MM-DD, written into the driver's comment by the Rippling sync.
  // Geotab has no hire-date field and activeFrom is when the RECORD was made,
  // which for a backfilled driver is nothing like the day they started.
  // The nightly sync writes "title:<Rippling job title>" into the driver's
  // comment beside the hire date. Geotab has no title field of its own.

  // Geotab's VIN decoder is inconsistent about case: 113 Chevrolets come back as
  // "Chevrolet" and 19 as "CHEVROLET". Normalise for display only -- the field is
  // derived from the VIN, so writing to it just gets re-decoded on the next read.
  // Acronyms are held out (GMC must not become "Gmc") and any token carrying a
  // digit or dash is left exactly as found (F-150, 1500, 2500).
  // Ram is deliberately absent: it is a brand name, not an acronym, and the VIN
  // decoder already returns it as "Ram". Forcing it uppercase produced "RAM 1500".
  var ACRONYMS = {GMC:1, BMW:1, GM:1, MB:1, VW:1};
  function titleish(s){
    s=String(s==null?'':s).trim();
    if(!s) return '';
    return s.split(/\s+/).map(function(w){
      if(ACRONYMS[w.toUpperCase()]) return w.toUpperCase();
      if(!/^[A-Za-z]+$/.test(w)) return w;
      return w.charAt(0).toUpperCase()+w.slice(1).toLowerCase();
    }).join(' ');
  }
  // Many trucks are already named by the last 6 of their VIN, so for those this
  // repeats the name -- but for a branch-numbered truck (ATN-68) it is the only
  // way to tie the row to a title, an RA, or an Enterprise export.
  function last6(v){
    v=String(v==null?'':v).trim().toUpperCase();
    return v.length>=6 ? v.slice(-6) : (v||'');
  }
  function makeModel(mk, md){
    md=String(md==null?'':md).replace(/\s+Truck$/i,'').trim();
    return (titleish(mk)+' '+titleish(md)).trim();
  }

  function titleOf(u){
    var m=/title:([^\n]+)/.exec(u.comment||'');
    return m ? m[1].trim() : '';
  }
  // 07-13-26 -- the format the branch sheets already use.
  function fmtDate(d){
    if(!d) return '\u2013';
    var p=function(x){ return (x<10?'0':'')+x; };
    return p(d.getMonth()+1)+'-'+p(d.getDate())+'-'+String(d.getFullYear()).slice(2);
  }
  function hiredOn(u){
    var m=/hired:(\d{4})-(\d{2})-(\d{2})/.exec(u.comment||'');
    return m ? new Date(+m[1], +m[2]-1, +m[3]) : null;
  }
  function daysSince(d){
    return d ? Math.floor((Date.now()-d.getTime())/86400000) : null;
  }
  function officeOf(groups){
    for(var i=0;i<(groups||[]).length;i++){
      if(OFFICES[groups[i].id]) return OFFICES[groups[i].id];
    }
    return null;
  }

  function build(users, devices, status, trips, winStart){
    var devById={}, devOffice={};
    devices.forEach(function(d){
      devById[d.id]=d;
      devOffice[d.id]=officeOf(d.groups);
    });
    // driver -> vehicle, from the assignment MyGeotab itself records
    var drvVeh={}, vehDrv={};
    status.forEach(function(s){
      var dev=(s.device||{}).id, dr=s.driver;
      var did=(dr && typeof dr==='object') ? dr.id : null;
      if(did && did!=='UnknownDriverId'){ drvVeh[did]=dev; vehDrv[dev]=did; }
    });
    var miles={}, milesNoDrv={}, drvMiles={}, lastTrip={}, priorVeh={}, lastMove={};
    trips.forEach(function(t){
      var dev=(t.device||{}).id, dr=t.driver;
      var did=(dr && typeof dr==='object') ? dr.id : null;
      var mi=(t.distance||0)*0.621371;
      miles[dev]=(miles[dev]||0)+mi;
      var ts=Date.parse(t.start||t.dateTime||0);
      if(ts>(lastMove[dev]||0)) lastMove[dev]=ts;
      if(!did || did==='UnknownDriverId') milesNoDrv[dev]=(milesNoDrv[dev]||0)+mi;
      else {
        drvMiles[did]=(drvMiles[did]||0)+mi;
        var st=Date.parse(t.start||t.dateTime||0);
        if(st>(lastTrip[did]||0)){ lastTrip[did]=st; priorVeh[did]=dev; }
      }
    });

    var uById={}; users.forEach(function(u){ uById[u.id]=u; });
    function nameOf(id){
      var u=uById[id]; return u ? ((u.firstName||'')+' '+(u.lastName||'')).trim() : null;
    }
    var crew=[];
    users.forEach(function(u){
      if(!u.isDriver) return;
      if(!(u.employeeNo||'').trim()) return;          // not HCS
      var off=officeOf(u.driverGroups||u.companyGroups);
      var hd=hiredOn(u), age=daysSince(hd);
      var veh=drvVeh[u.id];
      // A trip can only carry a driver's name if an assignment existed at the
      // time: 97% of assigned crew have attributed miles against 12% of the
      // unassigned. So for anyone with no truck, zero miles is produced by the
      // query, not observed from behaviour -- it says nothing about whether they
      // drive. This page therefore makes no claim either way. Whether the truck
      // they used earlier went to someone else is a fact, and is worth showing.
      var dm=drvMiles[u.id]||0, prior=priorVeh[u.id];
      crew.push({id:u.id, name:((u.firstName||'')+' '+(u.lastName||'')).trim(),
                 title:titleOf(u),
                 office:off, hired:hd, days:age, vehId:veh,
                 veh: veh ? (devById[veh]||{}).name : null,
                 vehModel: veh ? makeModel((devById[veh]||{}).vinInfoMake,
                                           (devById[veh]||{}).vinInfoModel) : '',
                 vehVin: veh ? last6((devById[veh]||{}).vehicleIdentificationNumber) : '',
                 miles:dm, lastTrip:lastTrip[u.id]||null,
                 hadTruck: !veh && !!prior,
                 priorVeh: prior ? (devById[prior]||{}).name : null,
                 priorNow: prior ? (vehDrv[prior] ? nameOf(vehDrv[prior]) : null) : null,
                 onboarding: age!=null && age < ONBOARD_DAYS});
    });

    // Trucks at an office with nobody currently assigned. A parked spare and a
    // truck covering 300 miles a week both belong here -- the miles column is
    // what separates them, so nothing is filtered out on mileage.
    var orphan=[], awaiting={};
    Object.keys(devById).forEach(function(id){
      var off=devOffice[id];
      if(!off || vehDrv[id]) return;
      // Placeholders come off the full Enterprise list -- real trucks waiting on
      // a GO9. They belong to the fleet, but not in this table: its columns are
      // miles and last-moved, which a device cannot answer when there is no
      // device, and Geotab will not attach a driver to one either. Counted
      // below the table instead, so they stay visible without filling it.
      if((devById[id].deviceType||'None')==='None'){ awaiting[off]=(awaiting[off]||0)+1; return; }
      orphan.push({id:id, name:devById[id].name, office:off,
                   model:makeModel(devById[id].vinInfoMake, devById[id].vinInfoModel),
                   year:devById[id].vinInfoYear||'',
                   vin:last6(devById[id].vehicleIdentificationNumber),
                   miles:miles[id]||0, unattributed:milesNoDrv[id]||0,
                   last:lastMove[id]||null});
    });
    orphan.sort(function(a,b){ return b.miles-a.miles; });

    var totalMi=0, totalNo=0;
    Object.keys(devOffice).forEach(function(id){
      if(!devOffice[id]) return;
      totalMi += miles[id]||0; totalNo += milesNoDrv[id]||0;
    });
    return {crew:crew, orphan:orphan, awaiting:awaiting, totalMi:totalMi, totalNo:totalNo};
  }

  function view(){
    if(!MODEL) return [];
    return officeFilter ? MODEL.crew.filter(function(c){ return c.office===officeFilter; })
                        : MODEL.crew;
  }

  function render(){
    var all=view();
    var withV=all.filter(function(c){ return c.vehId; });
    var without=all.filter(function(c){ return !c.vehId; });
    var where=officeFilter||'All locations';
    // the scope line is set on load, so it has to be refreshed on every filter change
    el('da-scope').textContent = where+' \u00b7 '+all.length+' HCS \u00b7 '+
      withV.length+' with a truck \u00b7 assignments live from Geotab, '+
      'hire dates from the Rippling sync';

    function kpi(k,v,sub,col){
      return '<div class="da-kpi"><div class="k">'+k+'</div><div class="v"'+
             (col?' style="color:'+col+'"':'')+'>'+v+'</div><div class="s">'+sub+'</div></div>';
    }
    var orph=officeFilter ? MODEL.orphan.filter(function(o){ return o.office===officeFilter; })
                          : MODEL.orphan;
    var orphMi=0; orph.forEach(function(o){ orphMi+=o.miles; });
    el('da-kpis').innerHTML =
      kpi('HCS', all.length, where) +
      kpi('With a truck', withV.length,
          all.length ? Math.round(pct(withV.length, all.length))+'% of the roster' : '\u2013',
          (all.length && withV.length===all.length)?'var(--good-ink)':'') +
      kpi('Without a truck', without.length, 'listed in the roster below',
          without.length?'var(--critical-ink)':'var(--good-ink)') +
      kpi('Trucks, nobody assigned', orph.length, f0(orphMi)+' mi in '+WINDOW_DAYS+' days',
          orphMi>=MIN_MILES?'var(--critical-ink)':'');

    // by location -- an index when nothing is picked, redundant once one is
    var showBy=!officeFilter;
    el('da-byloc-head').style.display=showBy?'':'none';
    el('da-bylocation').style.display=showBy?'':'none';
    if(showBy){
    var by={};
    MODEL.crew.forEach(function(c){
      var o=c.office||'(no location)';
      var r=by[o]||(by[o]={n:0, with:0, late:0, onb:0, idle:0, unk:0});
      r.n++;
      if(c.vehId) r.with++;
      else if(c.onboarding) r.onb++;
      else if(c.hadTruck) r.late++;
      else r.idle++;
    });
    var rows=Object.keys(by).sort(function(x,y){
      return (by[y].late+by[y].idle)-(by[x].late+by[x].idle) || by[y].n-by[x].n; });
    el('da-bylocation').innerHTML = rows.length ?
      '<table class="da-t"><thead><tr><th>Location</th>'+
      '<th style="text-align:right">Crew</th><th style="text-align:right">With a truck</th>'+
      '<th style="text-align:right">No truck</th>'+
      '<th style="text-align:right">Had one recently</th>'+
      '<th style="text-align:right">Onboarding</th>'+
      '<th>Coverage</th></tr></thead><tbody>'+
      rows.map(function(o){
        var r=by[o], p=pct(r.with,r.n);
        var col = p>=100 ? 'var(--good)' : p>=90 ? 'var(--warning)' : 'var(--critical)';
        return '<tr'+(o===officeFilter?' class="sel"':'')+'>'+
          '<td class="nm">'+esc(o)+'</td>'+
          '<td class="num">'+r.n+'</td>'+
          '<td class="num">'+r.with+'</td>'+
          '<td class="num"'+((r.late+r.idle)?' style="color:var(--critical-ink);font-weight:650"':'')+'>'+
            ((r.late+r.idle)||'–')+'</td>'+
          '<td class="num">'+(r.late||'–')+'</td>'+
          '<td class="num">'+(r.onb||'–')+'</td>'+
          '<td>'+Math.round(p)+'%<div class="da-bar"><i style="width:'+p+'%;background:'+col+'"></i></div></td>'+
        '</tr>';
      }).join('')+'</tbody></table>'
      : '<div class="da-empty">No HCS in your data scope.</div>';
    }

    // The roster: everyone at this office and the truck they are on. Sortable
    // the way Fleet Roster is, so the two pages behave the same way under the
    // same click.
    var list=all.slice();
    if(gapsOnly) list=list.filter(function(c){ return !c.vehId; });
    list.sort(function(x,y){
      var a,b;
      if(sortKey==='truck'){ a=x.veh||''; b=y.veh||''; }
      else if(sortKey==='vehmodel'){ a=x.vehModel||''; b=y.vehModel||''; }
      else if(sortKey==='vehvin'){ a=x.vehVin||''; b=y.vehVin||''; }
      else if(sortKey==='start'){ a=x.hired?x.hired.getTime():0; b=y.hired?y.hired.getTime():0; }
      else if(sortKey==='title'){ a=x.title||''; b=y.title||''; }
      else if(sortKey==='office'){ a=x.office||''; b=y.office||''; }
      else { a=x.name||''; b=y.name||''; }
      if(typeof a==='string') return a.localeCompare(b)*sortDir || x.name.localeCompare(y.name);
      return (a<b?-1:a>b?1:0)*sortDir || x.name.localeCompare(y.name);
    });
    el('da-listtitle').textContent='Roster'+(list.length?' ('+list.length+')':'');
    var cols=[['name','Name'],['title','Title']];
    if(!officeFilter) cols.push(['office','Location']);
    cols.push(['truck','Truck'],['vehmodel','Model'],['vehvin','VIN (last 6)'],
              ['start','Start Date']);
    el('da-list').innerHTML = list.length ?
      '<table class="da-t"><thead><tr>'+
      cols.map(function(c){
        return '<th data-k="'+c[0]+'">'+c[1]+
               (sortKey===c[0]?(sortDir>0?' \u2191':' \u2193'):'')+'</th>';
      }).join('')+'<th></th></tr></thead><tbody>'+
      list.map(function(c){
        return '<tr>'+
          '<td class="nm">'+linked('da-link', userUrl(c.id), c.name,
             'Open this driver in a new tab')+'</td>'+
          '<td'+(c.title?'':' class="mut"')+'>'+esc(c.title||'\u2013')+'</td>'+
          (officeFilter?'':'<td>'+esc(c.office||'\u2013')+'</td>')+
          '<td'+(c.vehId?' class="nm"':' class="mut"')+'>'+(c.vehId
            ? linked('da-link', deviceUrl(c.vehId), c.veh||c.vehId, 'Open this vehicle in a new tab')
            : '\u2013')+'</td>'+
          '<td'+(c.vehModel?'':' class="mut"')+'>'+esc(c.vehModel||'\u2013')+'</td>'+
          '<td'+(c.vehVin?'':' class="mut"')+'>'+esc(c.vehVin||'\u2013')+'</td>'+
          '<td>'+fmtDate(c.hired)+'</td>'+
          '<td>'+(c.vehId ? ''
            : c.onboarding ? '<span class="da-pill new">onboarding</span>'
            : '<span class="da-pill late">no truck</span>')+'</td></tr>';
      }).join('')+'</tbody></table>'
      : '<div class="da-empty">'+(gapsOnly?'Everyone here has a truck.':'No HCS in this location.')+'</div>';
    wireSort();

    // Trucks at this office with nobody on them, and what they covered.
    el('da-veh-title').textContent='Trucks with nobody assigned'+(orph.length?' ('+orph.length+')':'');
    el('da-vehicles').innerHTML = orph.length ?
      '<table class="da-t"><thead><tr><th>Truck</th><th>Model</th><th>Year</th>'+
      '<th>VIN (last 6)</th>'+
      (officeFilter?'':'<th>Location</th>')+
      '<th style="text-align:right">Miles, '+WINDOW_DAYS+' days</th>'+
      '<th>Last moved</th></tr></thead><tbody>'+
      orph.map(function(o){
        var driven=o.miles>=MIN_MILES;
        return '<tr>'+
          '<td class="nm">'+linked('da-link', deviceUrl(o.id), o.name||o.id,
                 'Open this vehicle in a new tab')+'</td>'+
          '<td'+(o.model?'':' class="mut"')+'>'+esc(o.model||'\u2013')+'</td>'+
          '<td'+(o.year?'':' class="mut"')+'>'+esc(o.year||'\u2013')+'</td>'+
          '<td'+(o.vin?'':' class="mut"')+'>'+esc(o.vin||'\u2013')+'</td>'+
          (officeFilter?'':'<td>'+esc(o.office)+'</td>')+
          '<td class="num"'+(driven?' style="color:var(--critical-ink);font-weight:650"':'')+'>'+
            (o.miles>=1?f0(o.miles):'\u2013')+'</td>'+
          '<td class="da-sub">'+daysAgo(o.last)+'</td></tr>';
      }).join('')+'</tbody></table>'
      : '<div class="da-empty">Every truck here has a driver assigned.</div>';
    var waitN=0;
    Object.keys(MODEL.awaiting||{}).forEach(function(o){
      if(!officeFilter || o===officeFilter) waitN+=MODEL.awaiting[o];
    });
    el('da-awaiting').innerHTML = waitN
      ? 'Plus <b>'+waitN+'</b> '+(waitN===1?'truck':'trucks')+
        (officeFilter?' here':'')+' awaiting a GO9 \u2014 on the Enterprise list, no device fitted '+
        'yet, so nothing can be assigned to '+(waitN===1?'it':'them')+' or measured on '+
        (waitN===1?'it':'them')+'. '+(waitN===1?'It is':'They are')+' tracked on Fleet Roster.'
      : '';

    el('da-foot').innerHTML =
      '<p><b>Who counts as HCS.</b> A driver whose Geotab record carries a Rippling worker id. '+
      'The nightly sync stamps one on every active Field Operations Frontline worker and nobody else, '+
      'so managers and office staff are excluded without anyone matching names or titles.</p>'+
      '<p><b>What "has a truck" means.</b> The driver MyGeotab currently records against a vehicle &mdash; '+
      'the same assignment you set on the asset. It is a statement about now, not about who drove last week.</p>'+
      '<p><b>Trucks with nobody assigned</b> counts only assets with a device fitted. Trucks from '+
      'the Enterprise list that are still waiting on a GO9 are real, but nothing can be assigned '+
      'to them and no mileage exists for them, so they are counted under the table rather than '+
      'listed in it. Fleet Roster carries the full inventory.</p>'+
      '<p><b>Unattributed miles</b> are miles on a branch vehicle whose trip carried no driver. They are '+
      'counted per vehicle over '+WINDOW_DAYS+' days, and a truck is only listed once it has done '+
      MIN_MILES+'+ such miles, so a single stray trip does not fill the page.</p>'+
      '<p><b>This page does not know who is driving.</b> Geotab attributes a trip to a person only '+
      'through the truck assignment, so someone with no truck has no attributed miles no matter how '+
      'much they drive &mdash; 97% of assigned crew have miles against 12% of the unassigned. Every '+
      'name below is a question for a manager, not a finding. Reasons the data cannot see include '+
      'leave, a branch-based role, a shared truck, or a Geotab record that is simply newer than the '+
      'person.</p>'+
      '<p><b>Had one recently</b> means a trip in this window carried their name, so they were '+
      'assigned earlier in it. The truck is shown along with who holds it now &mdash; often it was '+
      'handed to someone else, which is ordinary. <b>No truck</b> means nothing in this window '+
      'carried their name, which is exactly what the absence of an assignment produces on its own.</p>'+
      '<p><b>Onboarding</b> is anyone hired within '+ONBOARD_DAYS+' days, read from the hire date the '+
      'sync writes into the driver record. They are shown but not counted as a gap.</p>';
  }

  // innerHTML replaces the header row each render, so the handlers go back on.
  function wireSort(){
    var ths=el('da-list').querySelectorAll('th[data-k]');
    Array.prototype.forEach.call(ths, function(th){
      th.addEventListener('click', function(){
        var k=th.getAttribute('data-k');
        if(sortKey===k) sortDir=-sortDir; else { sortKey=k; sortDir=1; }
        render();
      });
    });
  }

  function fetchTrips(api, a, b, depth, done, fail){
    // Trip hard-caps at 25,000 rows whatever resultsLimit says, so a wide window
    // truncates silently. Split rather than lose the tail.
    api.call('Get', {typeName:'Trip', resultsLimit:25000, search:{fromDate:a, toDate:b}},
      function(rows){
        rows=rows||[];
        if(rows.length>=25000 && depth<6){
          var mid=new Date((Date.parse(a)+Date.parse(b))/2).toISOString();
          var acc=[], left=2;
          var step=function(p){ acc=acc.concat(p); if(--left===0) done(acc); };
          fetchTrips(api,a,mid,depth+1,step,fail);
          fetchTrips(api,mid,b,depth+1,step,fail);
        } else done(rows);
      }, fail);
  }

  function load(api){
    if(loading) return;
    loading=true; apiRef=api;
    el('da-notes').innerHTML='';
    el('da-root').classList.add('busy');
    el('da-scope').textContent='Loading crew and assignments…';
    var to=new Date(), from=new Date(to.getTime()-WINDOW_DAYS*864e5);
    function fail(e){
      loading=false; el('da-root').classList.remove('busy');
      el('da-scope').textContent='Could not load.';
      note('Could not load this dashboard: '+esc((e&&(e.message||e.name))||e)+'.', true);
    }
    api.multiCall([
      ['Get', {typeName:'User', search:{isDriver:true}}],
      ['Get', {typeName:'Device', resultsLimit:50000}],
      ['Get', {typeName:'DeviceStatusInfo'}]
    ], function(res){
      var users=(res[0]||[]).filter(function(u){
        var t=u.activeTo; return !t || new Date(t).getTime()>Date.now();
      });
      var devices=(res[1]||[]).filter(function(d){
        var t=d.activeTo; return !t || new Date(t).getTime()>Date.now();
      });
      el('da-scope').textContent='Loading distance driven…';
      fetchTrips(api, from.toISOString(), to.toISOString(), 0, function(trips){
        MODEL=build(users, devices, res[2]||[], trips, from.getTime());
        var offs={};
        MODEL.crew.forEach(function(c){ if(c.office) offs[c.office]=1; });
        var sel=el('da-office'), keep=sel.value;
        sel.innerHTML='<option value="">All locations</option>'+
          Object.keys(offs).sort().map(function(o){
            return '<option value="'+esc(o)+'">'+esc(o)+'</option>'; }).join('');
        sel.value=keep;
        loading=false; el('da-root').classList.remove('busy');
        el('da-scope').textContent=
          (officeFilter||'All locations')+' · '+MODEL.crew.length+' HCS · '+
          'assignments live from Geotab, hire dates from the Rippling sync';
        render();
      }, fail);
    }, fail);
  }

  function wire(){
    el('da-office').addEventListener('change', function(){
      officeFilter=this.value; if(MODEL) render();
    });
    el('da-gaps').addEventListener('click', function(){
      gapsOnly=!gapsOnly;
      this.className=gapsOnly?'on':'';
      this.textContent=gapsOnly?'Show everyone':'Only without a truck';
      if(MODEL) render();
    });
    el('da-csv').addEventListener('click', function(){
      if(!MODEL) return;
      var rows=[['Name','Title','Location','Start Date','Days','Truck','Model',
                 'VIN (last 6)','Status']];
      view().slice().sort(function(x,y){ return x.name.localeCompare(y.name); })
        .forEach(function(c){
          rows.push([c.name, c.title||'', c.office||'', fmtDate(c.hired),
                     c.days==null?'':c.days, c.veh||'', c.vehModel||'', c.vehVin||'',
                     c.vehId?'assigned':(c.onboarding?'onboarding':'no truck')]);
        });
      var csv=rows.map(function(r){
        return r.map(function(x){ return '"'+String(x).replace(/"/g,'""')+'"'; }).join(','); }).join('\n');
      var a=document.createElement('a');
      a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
      a.download='driver-assignments.csv'; a.click();
    });
  }

  // MyGeotab leaves the document title empty for add-ins, so every dashboard
  // shows the same bare "| MyGeotab" in the browser tab. Name it on focus and
  // put the original back on blur, so navigating away never strands a stale
  // name on a page this add-in no longer owns. Wrapped because the title is
  // the host's, not ours, and a throw here must not take the page down.
  var PAGE_TITLE = 'Driver assignment';
  var priorTitle = null;
  function setTabTitle(){
    try {
      if(priorTitle === null) priorTitle = document.title;
      document.title = PAGE_TITLE + ' | MyGeotab';
    } catch(e){}
  }
  function restoreTabTitle(){
    try {
      if(priorTitle !== null){ document.title = priorTitle; priorTitle = null; }
    } catch(e){}
  }

  return {
    initialize: function(api, state, cb){ injectStyles(); wire(); cb(); },
    focus: function(api){ setTabTitle(); load(api); },
    blur: function(){ restoreTabTitle(); }
  };
};
</script>
</body>

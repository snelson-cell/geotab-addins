<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.49.1/dist/apexcharts.min.js"></script>
</head>
<body>
<div id="ts-root">
  <div class="ts-topbar">
    <div>
      <h2 class="ts-h1">Top speed by driver</h2>
      <div class="ts-scope" id="ts-scope">Loading…</div>
    </div>
    <div class="ts-dates">
      <label class="ts-datefield">Office <select id="ts-office"></select></label>
      <div class="ts-presets" id="ts-presets" role="group" aria-label="Quick ranges"></div>
      <label class="ts-datefield">From <input type="date" id="ts-from"></label>
      <label class="ts-datefield">To <input type="date" id="ts-to"></label>
    </div>
  </div>

  <div class="ts-note" id="ts-stop"></div>
  <div class="ts-note" id="ts-warn"></div>

  <div class="ts-hero" id="ts-hero"></div>
  <div class="ts-kpis" id="ts-kpis"></div>

  <div class="ts-chartcard">
    <div class="ts-legend" id="ts-legend"></div>
    <div id="ts-chart"></div>
  </div>
  <div class="ts-foot" id="ts-foot"></div>

  <div class="ts-tablehead">
    <div class="ts-tabletitle">Every driver</div>
    <div class="ts-tools">
      <button type="button" id="ts-toggle">Show table</button>
      <button type="button" id="ts-csv">Export CSV</button>
    </div>
  </div>
  <div class="ts-tablewrap" id="ts-tablewrap"></div>
</div>

<script>
geotab.addin.topSpeed = function () {
  'use strict';

  // ── Policy ───────────────────────────────────────────────────────────────
  // These are POLICY thresholds, not statistics — taken from Megan Warner's
  // escalations in the #*-accidents-incidents channels:
  //   80+   final warning; termination if already on a final   (2026-07-31)
  //   85.1  the speed her automated alert fires at             (2026-06-18)
  //   91+   immediate termination                              (2026-06-25)
  // The policy tightened over time (on 2026-05-15 termination was stated as 85+),
  // so these track the most recent wording. Update here if it changes again.
  // Set with Samson 2026-08-05. 81 rather than the written 80 is a deliberate
  // 1 mph buffer: Geotab stores speed as whole km/h, so readings land on 0.62
  // mph steps and 129 km/h displays as 80.2 — the buffer keeps a rounding
  // artefact from becoming a written warning.
  var FINAL_MPH = 81, ALERT_MPH = 85.1, TERM_MPH = 90;
  var POLICY_NOTE = 'Policy: ' + FINAL_MPH + '+ mph inside a flagged speeding event is a ' +
                    'final written warning. ' + TERM_MPH + '+ at any moment is flagged, ' +
                    'event or not. Alerts fire at ' + ALERT_MPH + '.';

  // A speed is only a warning if a real speeding event was firing at the moment
  // it was recorded. Ranking the trip's peak instead let an unrelated event
  // elsewhere on the same trip legitimise a number — Malachi Wilson's 81.4 mph
  // was corroborated by a 74.6 mph violation seven miles and nine minutes away.
  var LOG_LIMIT = 500;      // an event window is seconds long; 500 is generous
  // A multiCall is ONE http request but still N API calls against the session
  // quota (OverLimitException, 2026-08-05 — 341 windows blew it). Measured in
  // Python first, where the API user has a different quota; that was the wrong
  // environment to prove it in. Resolve in chunks, and cap the total.
  // Measured on real data 2026-08-06: branch-and-bound needs 52 calls for 7
  // days and 98 for 30. The cap sits above that but far below the 346 that
  // triggered OverLimitException, because the exact quota is not documented
  // and guessing it once already cost a broken page.
  var RESOLVE_CAP = 150;    // API calls spent on in-event speeds per render
  var RESOLVE_CHUNK = 40;   // per multiCall
  var TIER_A = 'event';      // corroborated: peak measured inside an event window
  var TIER_B = 'absolute';   // 90+ at any instant, no event required
  var TIER_NONE = 'uncorroborated';  // shown for context; cannot reach the policy line

  // Times are shown in the DRIVER's local zone, not the viewer's. MyGeotab
  // renders in the signed-in user's timezone, so a Utah manager and a Louisville
  // OM quoted clocks two hours apart for the same incident.
  function localTime(iso, tz){
    if(!iso) return '—';
    try {
      return new Intl.DateTimeFormat(undefined, {
        timeZone: tz || undefined, hour:'numeric', minute:'2-digit',
        second:'2-digit', hour12:true
      }).format(new Date(iso));
    } catch(e){                       // unknown/absent tz — say so rather than lie
      return new Date(iso).toUTCString().slice(17,25) + ' UTC';
    }
  }
  function localZoneLabel(tz){
    if(!tz) return 'UTC';
    try {
      var p = new Intl.DateTimeFormat('en-US',{timeZone:tz, timeZoneName:'short'})
                .formatToParts(new Date());
      for(var i=0;i<p.length;i++) if(p[i].type==='timeZoneName') return p[i].value;
    } catch(e){}
    return tz;
  }

  var TOP_N = 20;            // rows on the chart — it gets shown on a meeting screen
  var TRIP_LIMIT = 50000, EVENT_LIMIT = 50000;
  // Geotab caps Trip at 25,000 rows per call NO MATTER what resultsLimit says —
  // asking for 100,000 still returns exactly 25,000, with no error and no flag.
  // A 30-day window really holds ~28,400, so the old guard (length >= 50,000)
  // never fired and the view silently lost ~3,400 trips. Fetch in windows and
  // split any window that comes back at the cap.
  var PAGE_CAP = 25000;
  var KMH_TO_MPH = 0.621371;
  var SPEED_RULE_IDS = ['RulePostedSpeedingId', 'RuleGpsSpeedingWindowId'];
  var SPEED_RULE_NAME = /^speeding$/i;

  var LEAF = {b27AB:'Orlando',b27AC:'Tampa',b27AD:'ATL North',b27AE:'ATL South',b27AF:'Chicago',
              b27B0:'Indianapolis',b27B1:'N Indiana',b27B2:'Louisville',b27B3:'Detroit',
              b27B4:'Grand Rapids',b27B5:'Cincinnati',b27B6:'Cleveland',b27B7:'Columbus',
              b27B8:'American Fork'};

  var C = {surface:'#fcfcfb', page:'#f9f9f7', ink1:'#0b0b0b', ink2:'#52514e', ink3:'#898781',
           grid:'#e1e0d9', axis:'#c3c2b7', accent:'#2a78d6',
           good:'#0ca30c', warning:'#fab219', critical:'#d03b3b'};

  var chart=null, apiRef=null, stateRef=null, lastRows=[], lastChart=null;
  var resolvedCount=0, cappedResolve=false;   // disclosure for the footer
  var lastWidth=0, resizeTimer=null, resizeObs=null, resizePoll=null, onResize=null,
      pointerInChart=false;
  var fromDate=null, toDate=null;
  // Auto-fallback state. `autoRange` stays true only while the range is one the
  // page chose; the moment the user touches a preset or a date box it is their
  // choice and must be honoured, empty or not.
  var activeKey=null, autoRange=true, didFallback=false, fellBack=false;
  var allRows=[], officeFilter='', ctx={};

  // Stylesheet ships as a string: MyGeotab drops this file's <head>.
  var STYLE_ID='ts-styles';
  var CSS = [
    '#ts-root{--surface-1:#fcfcfb;--page:#f9f9f7;--ink-1:#0b0b0b;--ink-2:#52514e;--ink-3:#898781;',
    '  --grid:#e1e0d9;--axis:#c3c2b7;--hairline:rgba(11,11,11,.10);--accent:#2a78d6;',
    '  --good:#0ca30c;--warning:#fab219;--critical:#d03b3b;',
    '  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink-1);',
    '  background:var(--page);padding:18px 20px 28px;width:100%;}',
    '#ts-root, #ts-root *{box-sizing:border-box;}',
    '.ts-h1{font-size:19px;font-weight:650;margin:0;letter-spacing:-.01em;}',
    '.ts-scope{font-size:12.5px;color:var(--ink-3);margin:3px 0 0;}',
    '.ts-topbar{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:12px;}',
    '.ts-dates{display:flex;flex-wrap:wrap;align-items:center;gap:8px;}',
    '.ts-presets{display:inline-flex;border:1px solid var(--axis);border-radius:7px;overflow:hidden;background:var(--surface-1);}',
    '.ts-presets button{border:0;background:transparent;color:var(--ink-2);font:inherit;font-size:12.5px;',
    '  font-weight:600;padding:6px 11px;cursor:pointer;border-right:1px solid var(--grid);}',
    '.ts-presets button:last-child{border-right:0;}',
    '.ts-presets button[aria-pressed="true"]{background:var(--accent);color:#fff;}',
    '.ts-datefield{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;',
    '  color:var(--ink-3);display:inline-flex;align-items:center;gap:5px;}',
    '.ts-datefield input, .ts-datefield select{font:inherit;font-size:12.5px;font-weight:600;',
    '  text-transform:none;letter-spacing:0;color:var(--ink-1);border:1px solid var(--axis);',
    '  border-radius:6px;padding:5px 7px;background:var(--surface-1);}',
    '.ts-datefield select{max-width:200px;}',
    '.ts-datefield select.on{border-color:var(--accent);color:var(--accent);}',
    '',
    // While a new range loads, the OLD range stays fully rendered and only the
    // small scope line changes. Clicking "Today" therefore leaves yesterday's
    // hero, KPIs and chart on screen looking current — observed exactly that
    // way in a screenshot on 2026-08-09: the buttons and date inputs said
    // Aug 9 while the chart underneath still said Sat, Aug 8. Fade the data so
    // it plainly is not the answer yet.
    '#ts-root.busy .ts-hero, #ts-root.busy .ts-kpis, #ts-root.busy .ts-chartcard,',
    '#ts-root.busy .ts-foot, #ts-root.busy .ts-tablewrap{opacity:.3;pointer-events:none;',
    '  transition:opacity .12s ease;}',
    '',
    '.ts-note{font-size:12.5px;border-radius:7px;padding:9px 12px;margin:12px 0 0;display:none;',
    '  border:1px solid var(--hairline);background:var(--surface-1);color:var(--ink-2);}',
    '.ts-note.on{display:block;}',
    '.ts-note b{color:var(--ink-1);}',
    '.ts-note--warn{background:#fdf6e3;border-color:#efdca8;color:#7a5300;}',
    '.ts-note--stop{background:#fbece8;border-color:#f0cfc7;color:#9b2626;}',
    '',
    // Hero: this is the thing on screen in a team meeting, so it gets real size.
    '.ts-hero{margin:14px 0 0;border-radius:11px;padding:18px 22px;display:none;',
    '  background:linear-gradient(100deg,#fbece8,#fdf6e3);border:1px solid #f0cfc7;',
    '  align-items:center;gap:22px;flex-wrap:wrap;}',
    '.ts-hero.on{display:flex;}',
    '.ts-hero-label{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#9b2626;}',
    '.ts-hero-name{font-size:31px;font-weight:680;letter-spacing:-.02em;line-height:1.1;margin:5px 0 0;}',
    '.ts-hero-meta{font-size:13px;color:var(--ink-2);margin:5px 0 0;}',
    '.ts-hero-speed{margin-left:auto;text-align:right;}',
    '.ts-hero-mph{font-size:52px;font-weight:680;line-height:1;letter-spacing:-.03em;color:#9b2626;}',
    '.ts-hero-unit{font-size:13px;color:var(--ink-2);margin:2px 0 0;}',
    '',
    '.ts-kpis{display:flex;flex-wrap:wrap;gap:12px;margin:12px 0 0;}',
    '.ts-kpi{flex:1 1 190px;min-width:0;background:var(--surface-1);border:1px solid var(--hairline);',
    '  border-radius:9px;padding:13px 15px 14px;}',
    '.ts-kpi-label{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;',
    '  color:var(--ink-3);display:flex;align-items:center;gap:5px;}',
    '.ts-kpi-value{font-size:29px;font-weight:640;line-height:1.12;margin:7px 0 0;letter-spacing:-.02em;}',
    '.ts-kpi-sub{font-size:12px;color:var(--ink-2);margin:4px 0 0;line-height:1.4;}',
    '.ts-dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none;}',
    '.ts-action{font-size:12.5px;color:var(--ink-2);background:var(--surface-1);border:1px solid var(--hairline);',
    '  border-left:3px solid var(--accent);border-radius:7px;padding:9px 13px;margin:12px 0 0;}',
    '',
    '.ts-chartcard{background:var(--surface-1);border:1px solid var(--hairline);border-radius:9px;',
    '  margin:14px 0 0;padding:14px 4px 6px;overflow:visible;}',
    '.ts-legend{display:flex;flex-wrap:wrap;gap:16px;padding:0 14px 4px;font-size:12px;color:var(--ink-2);}',
    '.ts-legend span{display:inline-flex;align-items:center;gap:6px;}',
    '.ts-swatch{width:12px;height:12px;border-radius:3px;flex:none;opacity:.5;}',
    '.ts-swatch.dot{border-radius:50%;opacity:1;width:11px;height:11px;}',
    '#ts-chart{min-width:380px;}',
    '',
    '.ts-foot{font-size:12px;color:var(--ink-3);margin:10px 2px 0;line-height:1.55;}',
    '.ts-foot b{color:var(--ink-2);font-weight:600;}',
    '',
    '.ts-tablehead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:20px 0 0;}',
    '.ts-tabletitle{font-size:14px;font-weight:650;}',
    '.ts-tools{display:flex;gap:8px;}',
    '.ts-tools button{font:inherit;font-size:12.5px;font-weight:600;color:var(--ink-2);',
    '  background:var(--surface-1);border:1px solid var(--axis);border-radius:6px;padding:5px 11px;cursor:pointer;}',
    '.ts-tablewrap{margin:9px 0 0;border:1px solid var(--hairline);border-radius:9px;',
    '  background:var(--surface-1);display:none;}',
    '.ts-tablewrap.on{display:block;}',
    'table.ts-t{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums;}',
    'table.ts-t th{position:sticky;top:0;background:var(--surface-1);text-align:left;font-size:10.5px;',
    '  letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:9px 12px;',
    '  border-bottom:1px solid var(--grid);white-space:nowrap;z-index:1;}',
    'table.ts-t td{padding:8px 12px;border-bottom:1px solid var(--grid);color:var(--ink-2);white-space:nowrap;}',
    'table.ts-t tr:last-child td{border-bottom:0;}',
    'table.ts-t tr.clickable{cursor:pointer;}',
    'table.ts-t tr.clickable:hover td{background:#f2f5fa;}',
    'table.ts-t td.who{color:var(--ink-1);font-weight:600;}',
    'table.ts-t td.num{text-align:right;}',
    '.ts-band{display:inline-flex;align-items:center;gap:6px;font-weight:600;}',
    '.ts-band.term{color:#9b2626;} .ts-band.final{color:#7a5300;} .ts-band.ok{color:#0a6b18;}',
    '@media (max-width:700px){',
    '  #ts-root{padding:14px 12px 22px;}',
    '  .ts-hero-mph{font-size:40px;} .ts-hero-name{font-size:25px;}',
    '  table.ts-t th, table.ts-t td{padding:7px 8px;white-space:normal;}',
    '}'
  ].join('\n');
  function injectStyles(){
    if(document.getElementById(STYLE_ID)) return;
    var s=document.createElement('style'); s.id=STYLE_ID; s.textContent=CSS;
    document.head.appendChild(s);
  }

  // ── helpers ──────────────────────────────────────────────────────────────
  function el(id){ return document.getElementById(id); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function mph(kmh){ return kmh*KMH_TO_MPH; }
  function f1(v){ return (Math.round(v*10)/10).toLocaleString(); }
  function f0(v){ return Math.round(v).toLocaleString(); }
  // Only a corroborated figure can carry a sanction. An uncorroborated peak is
  // always below the policy line by construction, but pin it to 'ok' anyway so
  // a future change to the floor cannot silently start warning people.
  function bandOf(m, tier){
    if(tier===TIER_NONE) return 'ok';
    return m>=TERM_MPH ? 'term' : (m>=FINAL_MPH ? 'final' : 'ok');
  }
  // A literal character, not an entity: this string is passed through esc()
  // before it reaches the DOM, so "&mdash;" would render as text.
  function bandName(b){ return b==='term'?'Flagged \u2014 '+TERM_MPH+'+':b==='final'?'Final written warning':'Under policy'; }
  function bandColor(b){ return b==='term'?C.critical:b==='final'?C.warning:C.good; }
  function ymd(d){
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function parseYmd(s){ var p=String(s).split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
  function dayLabel(d){
    return d.toLocaleDateString(undefined,{weekday:'short', month:'short', day:'numeric'});
  }
  function note(id,cls,html){ var n=el(id); n.className='ts-note on'+(cls?' '+cls:''); n.innerHTML=html; }
  function clearNotes(){ ['ts-stop','ts-warn'].forEach(function(i){
    var n=el(i); n.className='ts-note'; n.innerHTML=''; }); }
  function fail(html){
    el('ts-hero').className='ts-hero'; el('ts-kpis').innerHTML='';
    el('ts-legend').innerHTML=''; el('ts-foot').innerHTML='';
    if(chart){ chart.destroy(); chart=null; }
    el('ts-chart').innerHTML=''; el('ts-tablewrap').innerHTML='';
    // Clear busy too, or a quiet day — likely now that the default is Today —
    // leaves the page dimmed and the message reads as still loading.
    el('ts-root').classList.remove('busy');
    el('ts-scope').textContent='';
    note('ts-stop','ts-note--stop',html);
  }
  function hash01(s){
    var h=2166136261; s=String(s);
    for(var i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); }
    return ((h>>>0)%100000)/100000;
  }

  function resolveRule(rules){
    var byId={};
    (rules||[]).forEach(function(r){ if(r&&r.id) byId[r.id]=r; });
    for(var i=0;i<SPEED_RULE_IDS.length;i++){ if(byId[SPEED_RULE_IDS[i]]) return byId[SPEED_RULE_IDS[i]]; }
    var named=(rules||[]).filter(function(r){ return SPEED_RULE_NAME.test(r&&r.name||''); });
    return named.length?named[0]:null;
  }

  // ── Hero + KPIs ──────────────────────────────────────────────────────────
  // "Speed demon" over a driver who is inside policy is a slur the data does not
  // support — and on a page that feeds written warnings, the label has to match
  // the finding. Reserve it for someone actually over the line.
  function heroLabel(top){
    var b = bandOf(top.peak, top.tier);
    return (b==='ok') ? 'Fastest in range' : 'Speed demon';
  }

  function renderHero(top, rangeLabel){
    var h=el('ts-hero');
    if(!top){ h.className='ts-hero'; return; }
    h.className='ts-hero on';
    h.innerHTML =
      '<div><div class="ts-hero-label">'+esc(heroLabel(top))+' &middot; '+esc(rangeLabel)+'</div>'+
      '<div class="ts-hero-name">'+esc(top.name)+'</div>'+
      '<div class="ts-hero-meta">'+esc(top.office||'no office')+' &middot; '+esc(top.peakVeh)+
      ' &middot; '+esc(top.peakDayLabel)+' &middot; '+top.events+' speeding event'+
      (top.events===1?'':'s')+' in range</div></div>'+
      '<div class="ts-hero-speed"><div class="ts-hero-mph">'+f0(top.peak)+'</div>'+
      '<div class="ts-hero-unit">mph inside a flagged event &middot; '+esc(bandName(bandOf(top.peak, top.tier)))+'</div></div>';
  }

  function kpi(label,color,value,sub){
    return '<div class="ts-kpi"><div class="ts-kpi-label">'+
      (color?'<span class="ts-dot" style="background:'+color+'"></span>':'')+esc(label)+
      '</div><div class="ts-kpi-value">'+value+'</div><div class="ts-kpi-sub">'+sub+'</div></div>';
  }

  function renderKpis(rows){
    var term=rows.filter(function(r){ return r.peak>=TERM_MPH; });
    var fin =rows.filter(function(r){ return r.peak>=FINAL_MPH && r.peak<TERM_MPH; });
    var alert=rows.filter(function(r){ return r.peak>=ALERT_MPH; });
    var events=rows.reduce(function(s,r){ return s+r.events; },0);
    el('ts-kpis').innerHTML =
      kpi('Termination threshold', C.critical, String(term.length),
          'drivers at '+TERM_MPH+'+ mph') +
      kpi('Final warning', C.warning, String(fin.length),
          'drivers '+FINAL_MPH+'–'+(TERM_MPH-1)+' mph &middot; '+alert.length+' tripped the '+ALERT_MPH+' alert') +
      kpi('Speeding events', null, f0(events),
          'across '+rows.length+' drivers who drove in range') +
      kpi('Drivers over policy', null, String(term.length+fin.length),
          'of '+rows.length+' &middot; '+Math.round((term.length+fin.length)/Math.max(rows.length,1)*100)+'% of those driving');
  }

  // ── Chart ────────────────────────────────────────────────────────────────
  function renderChart(rows){
    var show = rows.slice(0, TOP_N);
    var n = show.length;
    if(!n){ el('ts-chart').innerHTML=''; return; }

    var host=el('ts-chart');
    var avail=Math.max(380, host.clientWidth || host.parentNode.clientWidth || 900);
    lastWidth=host.parentNode.clientWidth;
    var narrow = avail < 620;
    var GUTTER = narrow ? 130 : 190;
    var LANE = narrow ? 26 : 30;
    var H = n*LANE + 96;

    // The axis never starts at zero — nobody's peak is near zero, so a
    // zero-based scale spends its width on speeds no vehicle reaches. It also
    // can't just start at a fixed 40: the chart shows the fastest N drivers, who
    // cluster near the top, and a fixed floor left two thirds of the plot as an
    // empty green field. So the floor tracks the slowest driver shown, while
    // still keeping ~15 mph of "under policy" visible for context.
    var slowest = show[show.length-1].peak;
    var lo = Math.max(30, Math.floor(Math.min(FINAL_MPH - 15, slowest - 4)/5)*5);
    var hi = Math.max(TERM_MPH + 6, Math.ceil((show[0].peak + 4)/5)*5);
    var ticks = Math.min(8, Math.max(4, Math.round((hi-lo)/5)));

    var pts = show.map(function(r,i){
      return {x: Math.max(lo, r.peak), y: n-i, r: r};
    });

    var zones = [
      {x:lo, x2:FINAL_MPH, fillColor:C.good, opacity:0.07, borderWidth:0,
       label:{text:'UNDER POLICY', orientation:'horizontal', position:'top', offsetY:-6,
         textAnchor:'start', offsetX:7, borderWidth:0,
         style:{background:'transparent', color:'#0a6b18', fontSize:'10.5px', fontWeight:700}}},
      {x:FINAL_MPH, x2:TERM_MPH, fillColor:C.warning, opacity:0.13, borderWidth:0,
       label:{text:'FINAL WARNING', orientation:'horizontal', position:'top', offsetY:-6,
         textAnchor:'start', offsetX:7, borderWidth:0,
         style:{background:'transparent', color:'#7a5300', fontSize:'10.5px', fontWeight:700}}},
      {x:TERM_MPH, x2:hi, fillColor:C.critical, opacity:0.11, borderWidth:0,
       label:{text:'TERMINATION', orientation:'horizontal', position:'top', offsetY:-6,
         textAnchor:'start', offsetX:7, borderWidth:0,
         style:{background:'transparent', color:'#9b2626', fontSize:'10.5px', fontWeight:700}}},
      {x:ALERT_MPH, strokeDashArray:4, borderColor:C.ink2, borderWidth:1.5}
    ];

    var anns=[];
    show.forEach(function(r,i){
      var y=n-i;
      anns.push({y:y, borderColor:'transparent', label:{
        text:r.name, position:'left', textAnchor:'start', offsetX:-GUTTER, offsetY:-1,
        borderWidth:0, style:{background:'transparent', color:C.ink1,
          fontSize:narrow?'11.5px':'12.5px', fontWeight:700}}});
      anns.push({y:y, borderColor:'transparent', label:{
        text:(r.office||'—')+' · '+r.events+' ev', position:'left', textAnchor:'start',
        offsetX:-GUTTER, offsetY:12, borderWidth:0,
        style:{background:'transparent', color:C.ink3, fontSize:'10px', fontWeight:600}}});
    });

    if(chart){ chart.destroy(); }
    chart = new ApexCharts(host, {
      chart:{type:'scatter', height:H, width:avail, toolbar:{show:false}, fontFamily:'inherit',
        animations:{enabled:false},
        events:{ dataPointSelection:function(e,ctx,cfg){
          var p=cfg.w.config.series[cfg.seriesIndex].data[cfg.dataPointIndex];
          if(p && p.r) goToTrips(p.r);
        }}},
      series:[{name:'Peak speed', data:pts}],
      colors:[C.ink2],
      markers:{size:7, strokeWidth:2, strokeColors:C.surface, fillOpacity:0.85,
        hover:{sizeOffset:3}},
      xaxis:{min:lo, max:hi, tickAmount:ticks,
        title:{text:'Fastest speed recorded inside a flagged speeding event (mph)', style:{fontSize:'12px',fontWeight:600,color:C.ink2}},
        axisBorder:{color:C.axis}, axisTicks:{color:C.axis},
        labels:{style:{colors:C.ink3, fontSize:'11.5px'},
          formatter:function(v){ return Math.round(v); }}},
      yaxis:{min:0.4, max:n+0.6, labels:{show:false}, axisTicks:{show:false}, axisBorder:{show:false}},
      annotations:{xaxis:zones, yaxis:anns},
      legend:{show:false},
      grid:{borderColor:C.grid, xaxis:{lines:{show:true}}, yaxis:{lines:{show:false}},
        padding:{left:GUTTER, right:18, top:8}},
      tooltip:{custom:function(o){
        var p=o.w.config.series[o.seriesIndex].data[o.dataPointIndex], r=p.r;
        var b=bandOf(r.peak, r.tier);
        return '<div style="padding:8px 11px;font-size:12px;line-height:1.5">'+
          '<b>'+esc(r.name)+'</b> &middot; '+esc(r.office||'no office')+'<br>'+
          '<b>'+f1(r.peak)+' mph</b> <span style="color:#898781">in '+esc(r.peakVeh)+
          ' on '+esc(r.peakDayLabel)+'</span><br>'+
          (r.atISO
            ? '<span style="color:#898781">at <b style="color:#0b0b0b">'+
              esc(localTime(r.atISO, r.tz))+'</b> '+esc(localZoneLabel(r.tz))+
              ' &middot; the driver&rsquo;s local time</span><br>'
            : '')+
          (r.tier===TIER_A
            ? '<span style="color:#898781">measured inside a speeding event lasting '+
              r.seconds+'s</span><br>'
            : r.tier===TIER_B
            ? '<span style="color:'+C.warning+'">no speeding event fired &mdash; '+
              'absolute speed only</span><br>'
            : '<span style="color:#898781">highest speed seen in range &mdash; no '+
              'speeding event was firing at that moment, so it carries no sanction'+
              '</span><br>')+
          r.events+' speeding event'+(r.events===1?'':'s')+' in range &middot; '+f0(r.miles)+' mi driven<br>'+
          '<span style="color:'+bandColor(b)+';font-weight:600">'+bandName(b)+'</span>'+
          '<br><span style="color:#898781;font-size:11px">'+
          (r.tier===TIER_A ? 'click to open this event' : 'click for that day&rsquo;s trips')+
          '</span></div>';
      }}
    });
    chart.render();

    el('ts-legend').innerHTML =
      '<span><i class="ts-swatch" style="background:'+C.good+'"></i>Under '+FINAL_MPH+'</span>'+
      '<span><i class="ts-swatch" style="background:'+C.warning+'"></i>'+FINAL_MPH+'–'+(TERM_MPH-1)+' &middot; final warning</span>'+
      '<span><i class="ts-swatch" style="background:'+C.critical+'"></i>'+TERM_MPH+'+ &middot; termination</span>'+
      '<span><i class="ts-swatch dot" style="background:'+C.ink2+'"></i>Speed inside a flagged event</span>'+
      '<span style="color:#898781">dashed line = '+ALERT_MPH+' mph alert</span>';
  }

  // ── Table + drill-through ────────────────────────────────────────────────
  // Land on the exact incident, not the day.
  //
  // `exceptionId` is undocumented — the published URL guide lists ten pages and
  // no exception page at all. It was read off a URL MyGeotab wrote itself
  // (2026-08-05) and every id in it verified against the API before use. Supply
  // only INPUTS: routes, mapBounds, expandedCardIds and isReplayPlayerHidden are
  // state the page derives after loading, and passing them fights the page.
  //
  // Tier B has no event to open, so it lands on the trip's day with the moment
  // named in the tooltip — an honest limit, not a broken link.
  function goToTrips(r){
    if(!(stateRef && typeof stateRef.gotoPage==='function')) return;
    var params = {
      dateRange: {interval:'custom', startDate:r.peakDayStart, endDate:r.peakDayEnd},
      entityType: 'Driver',
      selectedEntities: [r.driverId],
      devices: r.peakDeviceId ? [r.peakDeviceId] : undefined
    };
    if(r.tier===TIER_A && r.eventId) params.exceptionId = r.eventId;
    try { stateRef.gotoPage('tripsHistory', params); } catch(e){}
  }

  function renderTable(rows){
    var head='<table class="ts-t"><thead><tr><th>Driver</th><th>Office</th>'+
      '<th style="text-align:right">Peak mph</th><th style="text-align:right">Events</th>'+
      '<th style="text-align:right">Miles</th><th>Peak on</th><th>Vehicle</th><th>Band</th>'+
      '</tr></thead><tbody>';
    var body=rows.map(function(r){
      var b=bandOf(r.peak, r.tier);
      return '<tr class="clickable" data-i="'+rows.indexOf(r)+'">'+
        '<td class="who">'+esc(r.name)+'</td><td>'+esc(r.office||'—')+'</td>'+
        '<td class="num"><b>'+f1(r.peak)+'</b></td>'+
        '<td class="num">'+r.events+'</td>'+
        '<td class="num">'+f0(r.miles)+'</td>'+
        '<td>'+esc(r.peakDayLabel)+'</td><td>'+esc(r.peakVeh)+'</td>'+
        '<td><span class="ts-band '+b+'"><span class="ts-dot" style="background:'+
        bandColor(b)+'"></span>'+bandName(b)+'</span></td></tr>';
    }).join('');
    var w=el('ts-tablewrap');
    w.innerHTML=head+body+'</tbody></table>';
    w.querySelectorAll('tr.clickable').forEach(function(tr){
      tr.addEventListener('click', function(){ goToTrips(rows[+tr.getAttribute('data-i')]); });
    });
  }

  function exportCsv(){
    if(!lastRows.length) return;
    var lines=[['Driver','Office','Peak mph','Speeding events','Miles','Peak on','Vehicle','Band','From','To'].join(',')];
    lastRows.forEach(function(r){
      lines.push([r.name, r.office||'', f1(r.peak), r.events, Math.round(r.miles),
        r.peakDayLabel, r.peakVeh, bandName(bandOf(r.peak, r.tier)), ymd(fromDate), ymd(toDate)]
        .map(function(v){ return '"'+String(v).replace(/"/g,'""')+'"'; }).join(','));
    });
    try{
      var blob=new Blob([lines.join('\n')],{type:'text/csv;charset=utf-8;'});
      var a=document.createElement('a');
      a.href=URL.createObjectURL(blob);
      a.download='top-speed-'+ymd(fromDate)+'_'+ymd(toDate)+'.csv';
      document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },0);
    }catch(e){
      note('ts-warn',null,'Could not start the download. Use <b>Show table</b> and copy the rows.');
    }
  }

  // ── Load ─────────────────────────────────────────────────────────────────
  // Split a date range until every slice returns under the server's row cap,
  // then concatenate. Recursive rather than a fixed chunk size because the
  // right size depends on how busy the fleet was, which varies by range.
  function fetchWindowed(api, typeName, startISO, endISO, limit, done, fail_){
    var out = [], pending = 0, failed = false;
    function grab(a, b, depth){
      pending++;
      api.call('Get', {typeName:typeName, resultsLimit:limit,
                       search:{fromDate:a, toDate:b}}, function(rows){
        rows = rows||[];
        if(rows.length >= PAGE_CAP && depth < 6){
          // At the cap: this window is truncated, so halve it and retry. Depth
          // is bounded so a pathological range cannot recurse forever.
          var mid = new Date((new Date(a).getTime() + new Date(b).getTime())/2).toISOString();
          pending--;
          grab(a, mid, depth+1); grab(mid, b, depth+1);
          return;
        }
        out = out.concat(rows);
        if(--pending === 0 && !failed) done(out, depth);
      }, function(err){
        if(failed) return;
        failed = true; fail_(err);
      });
    }
    grab(startISO, endISO, 0);
  }

  function load(api){
    apiRef=api; clearNotes();
    var startISO=new Date(fromDate.getFullYear(),fromDate.getMonth(),fromDate.getDate()).toISOString();
    var endLocal=new Date(toDate.getFullYear(),toDate.getMonth(),toDate.getDate()+1);
    var endISO=endLocal.toISOString();
    var single = ymd(fromDate)===ymd(toDate);
    var rangeLabel = single ? dayLabel(fromDate) : dayLabel(fromDate)+' – '+dayLabel(toDate);
    el('ts-scope').textContent='Loading '+rangeLabel+'…';
    el('ts-root').classList.add('busy');

    api.multiCall([
      ['Get',{typeName:'Rule'}],
      ['Get',{typeName:'Device', resultsLimit:50000}],
      ['Get',{typeName:'User', search:{isDriver:true}}]
    ], function(res){
      var rules=res[0]||[], devices=res[1]||[], users=res[2]||[];
      fetchWindowed(api, 'Trip', startISO, endISO, TRIP_LIMIT, function(trips){
      var rule=resolveRule(rules);
      if(!rule){
        fail('Could not find a speeding rule in this database. Looked for <b>'+
             SPEED_RULE_IDS.join('</b>, <b>')+'</b> and a rule named &ldquo;Speeding&rdquo;.');
        return;
      }
      // No row-limit warning any more: fetchWindowed splits until nothing is
      // truncated, so hitting the cap is handled rather than reported.

      api.call('Get',{typeName:'ExceptionEvent', resultsLimit:EVENT_LIMIT,
        search:{fromDate:startISO, toDate:endISO, ruleSearch:{id:rule.id}}}, function(events){
        events=events||[];

        // Resolve the true peak INSIDE each event window. An ExceptionEvent
        // carries no speed of its own — MyGeotab computes the figure it shows
        // from LogRecord at render time, and so must we.
        //
        // This is affordable because an event window is seconds long: 311
        // events for a whole day returned 2,195 rows in 2.7s as a single
        // multiCall (measured 2026-08-05). Batched, not one call per event.
        // Tie each speeding event to the trip it happened on, by device and time
        // containment. Without this the headline speed came from moments that
        // were never flagged — the dashboard was crowning a "speed demon" at
        // 80 mph with zero speeding events, which is just motorway driving.
        // Declared here, above every use. It is a var function expression, so
        // it hoists as undefined rather than as a function — using it earlier
        // throws "drvId is not defined" from inside an async callback, where
        // nothing surfaces it.
        var drvId=function(x){
          var d=x&&x.driver;
          return (d && typeof d==='object' && d.id) ? d.id : null;
        };

        var byDev={};
        trips.forEach(function(t){
          var d=(t.device||{}).id;
          if(d && t.start && t.stop) (byDev[d] || (byDev[d]=[])).push(t);
          t.__ev = 0;
        });
        Object.keys(byDev).forEach(function(d){
          byDev[d].sort(function(a,b){ return a.start < b.start ? -1 : a.start > b.start ? 1 : 0; });
        });
        function tripAt(deviceId, when){
          var arr=byDev[deviceId];
          if(!arr) return null;
          var lo=0, hi=arr.length-1;
          while(lo<=hi){                       // binary search on start time
            var mid=(lo+hi)>>1, t=arr[mid];
            if(when < t.start) hi=mid-1;
            else if(when > t.stop) lo=mid+1;
            else return t;
          }
          return null;
        }

        // The in-event peak can never exceed the trip's own peak, so an event
        // on a trip that never reached the policy line cannot produce a warning
        // — and does not need resolving. That is the difference between 313
        // calls for today and 22.
        // Only each driver's SINGLE best in-event speed is ever shown, and an
        // in-event peak can never exceed its trip's own peak. So group the
        // candidates per driver, try the most promising first, and stop as soon
        // as no remaining candidate COULD beat what has been found. Measured on
        // 30 days: 654 candidates resolve in 98 calls — 85% fewer — which is
        // what makes the long view exact instead of capped.
        var cand = {};
        events.forEach(function(e){
          if(!(e && e.activeFrom && e.activeTo && (e.device||{}).id)) return;
          var t = tripAt((e.device||{}).id, e.activeFrom);
          if(!t) return;
          var tm = mph(t.maximumSpeed||0);
          if(tm < FINAL_MPH) return;              // cannot reach the policy line
          var who = drvId(t) || drvId(e);
          if(!who) return;
          (cand[who] || (cand[who]=[])).push({tripMax:tm, ev:e, trip:t});
        });
        Object.keys(cand).forEach(function(w){
          cand[w].sort(function(a,b){ return b.tripMax - a.tripMax; });
        });

        var drivers = Object.keys(cand);
        if(!drivers.length){ resolvedCount=0; cappedResolve=false; withEventPeaks(events, {}); return; }

        var st = {};
        drivers.forEach(function(w){ st[w] = {i:0, best:0}; });
        var peakOf = {}, spent = 0;

        (function round(){
          var batch = [];
          drivers.forEach(function(w){
            var a = st[w], lst = cand[w];
            if(a.i >= lst.length) return;
            // The prune: this candidate's ceiling is its trip peak. If that
            // cannot beat what we already have for this driver, neither can any
            // later one — the list is sorted descending.
            if(lst[a.i].tripMax <= a.best){ a.i = lst.length; return; }
            batch.push({w:w, c:lst[a.i]});
          });

          if(!batch.length || spent >= RESOLVE_CAP){
            resolvedCount = spent;
            cappedResolve = batch.length > 0;      // stopped early, not finished
            withEventPeaks(events, peakOf);
            return;
          }
          var slice = batch.slice(0, Math.min(RESOLVE_CHUNK, RESOLVE_CAP - spent));
          spent += slice.length;

          api.multiCall(slice.map(function(b){
            return ['Get',{typeName:'LogRecord', resultsLimit:LOG_LIMIT,
              search:{fromDate:b.c.ev.activeFrom, toDate:b.c.ev.activeTo,
                      deviceSearch:{id:(b.c.ev.device||{}).id}}}];
          }), function(sets){
            (sets||[]).forEach(function(rows, i){
              var b = slice[i], best=0, when=null;
              (rows||[]).forEach(function(r){
                if((r.speed||0)>best){ best=r.speed||0; when=r.dateTime; }
              });
              if(best>0) peakOf[b.c.ev.id] = {speed:best, at:when};
              var m = mph(best);
              if(m > st[b.w].best) st[b.w].best = m;
              st[b.w].i++;
            });
            setTimeout(round, 250);   // stay clear of the per-minute ceiling
          }, function(err){
            var over = err && (err.isOverLimitException ||
                       /quota|OverLimit/i.test(err.message||String(err)));
            fail(over
              ? 'Geotab rate-limited this page while reading the speed inside each '+
                'speeding event. Wait a minute and reload, or pick a shorter date range.'
              : 'Could not read the speed inside each speeding event, so nothing can '+
                'be ranked against policy. Reload to retry. ('+esc(err&&err.message||err)+')');
          });
        })();

        function withEventPeaks(events, eventPeak){

        var vehName={}, office={}, devTz={};
        devices.forEach(function(d){
          vehName[d.id]=d.name||d.id;
          devTz[d.id]=d.timeZoneId||null;      // the DRIVER's clock, not the viewer's
          (d.groups||[]).forEach(function(g){ if(LEAF[g.id]) office[d.id]=LEAF[g.id]; });
        });
        var uname={};
        users.forEach(function(u){
          var full=((u.firstName||'')+' '+(u.lastName||'')).trim();
          uname[u.id]=full||u.name||u.id;
        });
        var unmatchedEvents=0, eventTripDriver={}, bestEvent={};
        events.forEach(function(e){
          var d=(e.device||{}).id, when=e.activeFrom;
          var t = (d && when) ? tripAt(d, when) : null;
          if(!t){ unmatchedEvents++; return; }
          t.__ev++;
          // Attribute the event via the trip's driver where the event itself has
          // none — the trip knows who was behind the wheel even when the event
          // record doesn't, so this recovers attribution rather than losing it.
          var who = drvId(t) || drvId(e);
          if(!who){ unmatchedEvents++; return; }
          eventTripDriver[who] = (eventTripDriver[who]||0) + 1;

          // TIER A. The speed that counts is the fastest moment inside THIS
          // event, and the event id travels with it so a manager clicking the
          // dot lands on the very incident the number came from.
          var ep = eventPeak[e.id];
          var m = mph(ep ? ep.speed : 0);
          var cur = bestEvent[who];
          if(m > 0 && (!cur || m > cur.mph)){
            bestEvent[who] = {mph:m, eventId:e.id, deviceId:d, trip:t,
                              at:(ep && ep.at) || e.activeFrom,
                              from:e.activeFrom, to:e.activeTo,
                              seconds: Math.max(0, Math.round(
                                (new Date(e.activeTo) - new Date(e.activeFrom))/1000))};
          }
        });

        // Peak speed + miles per driver. Peak only counts trips that actually
        // carried a speeding event.
        var by={}, noDriverTrips=0, noDriverMiles=0;
        trips.forEach(function(t){
          var id=drvId(t);
          var mi=(t.distance||0)*KMH_TO_MPH;
          if(!id){ noDriverTrips++; noDriverMiles+=mi; return; }
          var rec = by[id] || (by[id]={driverId:id, name:uname[id]||id, office:null,
            peak:0, tier:null, events:0, miles:0, peakVeh:'—', peakDeviceId:null,
            peakTripEvents:0, peakDayLabel:'—', peakDayStart:null, peakDayEnd:null,
            unflaggedPeak:0, eventId:null, atISO:null, tz:null, seconds:0, absTrip:null});
          rec.miles += mi;
          var did=(t.device||{}).id;
          if(did && !rec.office && office[did]) rec.office=office[did];
          var m = mph(t.maximumSpeed||0);
          if(m > rec.unflaggedPeak){
            // Remember WHERE this peak happened. Without it an uncorroborated
            // row renders "— on —" with no vehicle and no date. There is no
            // exact instant — that needs LogRecord, which is deliberately not
            // spent below the policy line — so atISO stays null and the tooltip
            // omits the time rather than inventing one.
            rec.unflaggedPeak = m;
            rec.unflaggedVeh = vehName[did]||did||'—';
            rec.unflaggedDeviceId = did;
            rec.unflaggedTz = did ? devTz[did] : null;
            var uw = new Date(t.start||t.stop||startISO);
            rec.unflaggedDayLabel = dayLabel(uw);
            var us = new Date(uw.getFullYear(),uw.getMonth(),uw.getDate());
            rec.unflaggedDayStart = us.toISOString();
            rec.unflaggedDayEnd = new Date(us.getFullYear(),us.getMonth(),us.getDate()+1).toISOString();
          }
          // TIER B candidate: 90+ at any instant counts even with no event
          // behind it, so hold the trip — its exact moment is resolved after.
          if(m >= TERM_MPH && (!rec.absTrip || m > mph(rec.absTrip.maximumSpeed||0))){
            rec.absTrip = t;
          }
        });
        Object.keys(eventTripDriver).forEach(function(id){
          if(by[id]) by[id].events = eventTripDriver[id];
        });

        // Fold in the corroborated Tier A figure, then let Tier B override only
        // when it is genuinely higher — a 90+ instant outranks a slower event.
        Object.keys(by).forEach(function(id){
          var rec=by[id], be=bestEvent[id];
          if(be){
            rec.peak=be.mph; rec.tier=TIER_A; rec.eventId=be.eventId;
            rec.peakDeviceId=be.deviceId; rec.peakVeh=vehName[be.deviceId]||be.deviceId||'—';
            rec.tz=devTz[be.deviceId]||null; rec.seconds=be.seconds; rec.atISO=be.at;
            rec.peakTripEvents=be.trip.__ev||0;
            var w=new Date(be.trip.start||be.from);
            rec.peakDayLabel=dayLabel(w);
            var d0=new Date(w.getFullYear(),w.getMonth(),w.getDate());
            rec.peakDayStart=d0.toISOString();
            rec.peakDayEnd=new Date(d0.getFullYear(),d0.getMonth(),d0.getDate()+1).toISOString();
          }
          // Everyone else still belongs on the chart. Their events sat on trips
          // that never reached the policy line, so by construction their true
          // in-event speed is below it and no warning is possible — but a
          // manager still wants the roster. Show the trip peak, marked as not
          // corroborated, so it is never mistaken for an evidenced figure.
          if(!be && rec.unflaggedPeak > 0 && rec.events > 0){
            rec.peak = rec.unflaggedPeak;
            rec.tier = TIER_NONE;
            rec.peakVeh = rec.unflaggedVeh || '—';
            rec.peakDeviceId = rec.unflaggedDeviceId || null;
            rec.tz = rec.unflaggedTz || null;
            rec.peakDayLabel = rec.unflaggedDayLabel || '—';
            rec.peakDayStart = rec.unflaggedDayStart || null;
            rec.peakDayEnd = rec.unflaggedDayEnd || null;
          }

          var absM = rec.absTrip ? mph(rec.absTrip.maximumSpeed||0) : 0;
          if(absM >= TERM_MPH && absM > rec.peak){
            var t2=rec.absTrip, d2=(t2.device||{}).id;
            rec.peak=absM; rec.tier=TIER_B; rec.eventId=null;
            rec.peakDeviceId=d2; rec.peakVeh=vehName[d2]||d2||'—';
            rec.tz=devTz[d2]||null; rec.seconds=0; rec.peakTripEvents=t2.__ev||0;
            var w2=new Date(t2.start||startISO);
            rec.peakDayLabel=dayLabel(w2);
            var d3=new Date(w2.getFullYear(),w2.getMonth(),w2.getDate());
            rec.peakDayStart=d3.toISOString();
            rec.peakDayEnd=new Date(d3.getFullYear(),d3.getMonth(),d3.getDate()+1).toISOString();
          }
        });

        // TIER B moments. Only trips that already touched 90+ qualify, so this
        // is a handful of calls, not one per driver. Without it a 90+ dot could
        // name a day but not an instant — and a time is the whole point.
        var needTime=[];
        Object.keys(by).forEach(function(id){
          var r=by[id];
          if(r.tier===TIER_B && r.absTrip && r.absTrip.start && r.absTrip.stop) needTime.push(r);
        });
        if(needTime.length){
          api.multiCall(needTime.map(function(r){
            return ['Get',{typeName:'LogRecord', resultsLimit:20000,
              search:{fromDate:r.absTrip.start, toDate:r.absTrip.stop,
                      deviceSearch:{id:(r.absTrip.device||{}).id}}}];
          }), function(sets){
            (sets||[]).forEach(function(rows, i){
              var best=0, at=null;
              (rows||[]).forEach(function(x){
                if((x.speed||0)>best){ best=x.speed||0; at=x.dateTime; }
              });
              if(at) needTime[i].atISO = at;
            });
            finish();
          }, function(){ finish(); });   // a missing instant is not worth failing over
        } else { finish(); }

        function finish(){
        var all=Object.keys(by).map(function(k){ return by[k]; });
        var rows=all.filter(function(r){ return r.peak>0; })
                    .sort(function(a,b){ return b.peak-a.peak; });
        // Drivers who drove but were never flagged. Not ranked — but named in
        // the footer, because a fast run the rule missed still matters.
        var unflagged=all.filter(function(r){ return r.peak===0 && r.unflaggedPeak>0; })
                         .sort(function(a,b){ return b.unflaggedPeak-a.unflaggedPeak; });
        if(!rows.length){
          // Today is empty and nobody asked for today specifically -> show
          // yesterday instead. Once only, and only from Today, so this can
          // never loop. Deliberately NOT reached for a missing rule or an API
          // error: those are faults to surface, not quiet days to skip past.
          if(autoRange && !didFallback && activeKey==='today'){
            didFallback=true; fellBack=true;
            applyPreset(PRESETS[1]);        // Yesterday — also moves the button
            if(apiRef) load(apiRef);
            return;
          }
          fail('No speeding events were recorded for any driver in '+esc(rangeLabel)+'. '+
               (unflagged.length ? unflagged.length+' driver(s) drove, topping out at '+
                 f1(unflagged[0].unflaggedPeak)+' mph, but nothing tripped the rule.'
               : 'There was no driver-attributed driving at all.'));
          return;
        }

        // Keep the unfiltered result and re-render from it, so changing office
        // is instant rather than another round trip to Geotab.
        allRows = rows;
        ctx = {rangeLabel:rangeLabel, ruleName:rule.name,
               noDriverTrips:noDriverTrips, noDriverMiles:noDriverMiles,
               noDriverEvents:unmatchedEvents, unflagged:unflagged};
        buildOfficeOptions(rows);
        applyFilter();
        }   // finish
        }   // withEventPeaks
      }, function(err){ fail('Error loading speeding events: '+esc(err)); });
      }, function(err){ fail('Error loading trips: '+esc(err)); });
    }, function(err){ fail('Error loading data: '+esc(err)); });
  }

  // ── Office filter ────────────────────────────────────────────────────────
  var NO_OFFICE='__none__';
  function buildOfficeOptions(rows){
    var counts={}, none=0;
    rows.forEach(function(r){
      if(r.office) counts[r.office]=(counts[r.office]||0)+1; else none++;
    });
    var names=Object.keys(counts).sort();
    var sel=el('ts-office');
    var opts=['<option value="">All offices ('+rows.length+')</option>'];
    names.forEach(function(o){
      opts.push('<option value="'+esc(o)+'">'+esc(o)+' ('+counts[o]+')</option>');
    });
    // Drivers whose vehicle sits in no office group would otherwise be
    // unreachable once a filter is applied, so give them their own bucket.
    if(none) opts.push('<option value="'+NO_OFFICE+'">No office ('+none+')</option>');
    sel.innerHTML=opts.join('');
    // Keep the manager's selection across date changes when it still exists.
    var keep = officeFilter && (officeFilter===NO_OFFICE ? none : counts[officeFilter]);
    if(!keep) officeFilter='';
    sel.value=officeFilter;
    sel.className = officeFilter ? 'on' : '';
  }

  function applyFilter(){
    var rows = !officeFilter ? allRows
      : allRows.filter(function(r){
          return officeFilter===NO_OFFICE ? !r.office : r.office===officeFilter;
        });
    var where = officeFilter ? (officeFilter===NO_OFFICE ? 'no office' : officeFilter) : null;

    if(!rows.length){
      fail('No driver-attributed driving for <b>'+esc(where||'this range')+'</b> in '+
           esc(ctx.rangeLabel)+'.');
      return;
    }
    clearNotes();
    // Said out loud every render, not just the first: the whole point of the
    // busy-fade fix was that nobody should ever read one range as another.
    if(fellBack){
      note('ts-warn','ts-note--warn',
        '<b>No flagged speeding today yet.</b> Showing <b>' + esc(ctx.rangeLabel) +
        '</b> instead. Click <b>Today</b> to see today.');
    }
    lastRows=rows; lastChart=rows;

    el('ts-scope').innerHTML = ctx.rangeLabel+' &middot; '+
      (where ? '<b>'+esc(where)+'</b> &middot; ' : '')+
      rows.length+' driver'+(rows.length===1?'':'s')+' &middot; rule: '+esc(ctx.ruleName)+
      ' &middot; your data scope';

    el('ts-root').classList.remove('busy');
    renderHero(rows[0], ctx.rangeLabel + (where ? ' · ' + where : ''));
    renderKpis(rows);
    renderChart(rows);
    renderTable(rows);

    var foot=[POLICY_NOTE];
    if(where){
      foot.push('Filtered to <b>'+esc(where)+'</b>. '+
        allRows.length+' drivers drove across all offices in this range.');
    }
    if(rows.length>TOP_N){
      foot.push('Chart shows the fastest <b>'+TOP_N+'</b> of '+rows.length+
        ' drivers. The rest are in the table.');
    }
    if(ctx.noDriverTrips){
      foot.push('<b>'+ctx.noDriverTrips+' trip'+(ctx.noDriverTrips===1?'':'s')+' ('+
        f0(ctx.noDriverMiles)+' mi) had no driver assigned</b> and are not counted anywhere '+
        'on this page. Whoever drove them does not appear here.'+
        (where ? ' (Fleet-wide figure — it is not filtered by office, because an '+
                 'unassigned trip has no driver to place in one.)' : ''));
    }
    if(ctx.noDriverEvents){
      foot.push(ctx.noDriverEvents+' speeding event'+(ctx.noDriverEvents===1?'':'s')+
        ' could not be attributed to a driver.');
    }
    if(ctx.unflagged && ctx.unflagged.length){
      var top3=ctx.unflagged.slice(0,3).map(function(u){
        return esc(u.name)+' ('+f1(u.unflaggedPeak)+')'; }).join(', ');
      foot.push('<b>'+ctx.unflagged.length+' driver'+(ctx.unflagged.length===1?'':'s')+
        ' drove but were never flagged</b>, so they are not ranked here. Fastest of them: '+
        top3+'. The posted-speed rule cannot fire where Geotab has no limit data for the '+
        'road, so a high number here is worth a look even without an event.');
    }
    if(resolvedCount){
      foot.push('Speeds at or above '+FINAL_MPH+' mph were read from inside '+resolvedCount+
        ' speeding event'+(resolvedCount===1?'':'s')+'. Slower drivers are shown at their '+
        'highest recorded speed, which is shown for context only and can never '+
        'carry a sanction because no event corroborates it.');
    }
    if(cappedResolve){
      foot.push('<b>Only the fastest '+RESOLVE_CAP+' events were checked</b> — this range has '+
        'more than that, and Geotab rate-limits the page. Narrow the dates for a complete read.');
    }
    foot.push('A driver is only ranked if a speeding event was actually recorded, and the '+
      'speed shown is their highest reading on a trip that carried one. It is still a '+
      'single instant, so treat it as a prompt to look, not as proof.');
    el('ts-foot').innerHTML=foot.join('<br>');
  }

  function wireOffice(){
    el('ts-office').addEventListener('change', function(e){
      officeFilter = e.target.value;
      e.target.className = officeFilter ? 'on' : '';
      if(allRows.length) applyFilter();     // no refetch — filter the data we hold
    });
  }

  // ── Date controls ────────────────────────────────────────────────────────
  var PRESETS=[
    {k:'today', label:'Today', days:0},
    {k:'yest',  label:'Yesterday', days:-1},
    {k:'7',     label:'Last 7 days', days:6},
    {k:'30',    label:'Last 30 days', days:29}
  ];
  function setRange(from,to,key){
    fromDate=from; toDate=to; activeKey=key;
    el('ts-from').value=ymd(from);
    el('ts-to').value=ymd(to);
    el('ts-presets').querySelectorAll('button').forEach(function(b){
      b.setAttribute('aria-pressed', String(b.getAttribute('data-k')===key));
    });
  }
  function applyPreset(p){
    var now=new Date(), t=new Date(now.getFullYear(),now.getMonth(),now.getDate());
    if(p.k==='today') setRange(t,t,p.k);
    else if(p.k==='yest'){ var y=new Date(t.getFullYear(),t.getMonth(),t.getDate()-1); setRange(y,y,p.k); }
    else setRange(new Date(t.getFullYear(),t.getMonth(),t.getDate()-p.days), t, p.k);
  }
  function buildDates(){
    el('ts-presets').innerHTML=PRESETS.map(function(p){
      return '<button type="button" data-k="'+p.k+'">'+p.label+'</button>';
    }).join('');
    el('ts-presets').querySelectorAll('button').forEach(function(b){
      b.addEventListener('click', function(){
        var p=PRESETS.filter(function(x){ return x.k===b.getAttribute('data-k'); })[0];
        // An explicit click is a question the user asked. If they pick Today and
        // today is empty, they need to SEE that — silently showing yesterday
        // would answer a question they did not ask.
        autoRange=false; fellBack=false;
        applyPreset(p);
        if(apiRef) load(apiRef);
      });
    });
    function onManual(){
      var f=parseYmd(el('ts-from').value), t=parseYmd(el('ts-to').value);
      if(isNaN(f)||isNaN(t)) return;
      if(f>t){ var tmp=f; f=t; t=tmp; }
      autoRange=false; fellBack=false;
      setRange(f,t,null);
      if(apiRef) load(apiRef);
    }
    el('ts-from').addEventListener('change', onManual);
    el('ts-to').addEventListener('change', onManual);
    // Default: TODAY. This page is opened to answer "what happened today" —
    // in 1:1s and morning check-ins — so the range that costs a click should
    // be the one nobody has to change. A quiet morning is handled: the
    // no-events and no-driver-attributed paths both fail() with a plain
    // message rather than rendering an empty chart.
    applyPreset(PRESETS[0]);
  }

  // ── Resize (same approach as the speeding dashboard) ─────────────────────
  function watchResize(){
    var card=el('ts-chart').parentNode;
    lastWidth=card.clientWidth;
    onResize=function(){
      var w=card.clientWidth;
      if(!lastChart||!w||Math.abs(w-lastWidth)<16) return;
      clearTimeout(resizeTimer);
      function attempt(){
        if(pointerInChart){ resizeTimer=setTimeout(attempt,250); return; }
        if(lastChart) renderChart(lastChart);
      }
      resizeTimer=setTimeout(attempt,140);
    };
    if(typeof ResizeObserver==='function'){
      resizeObs=new ResizeObserver(onResize); resizeObs.observe(card);
    }
    window.addEventListener('resize', onResize);
    card.addEventListener('mouseenter', function(){ pointerInChart=true; });
    card.addEventListener('mouseleave', function(){ pointerInChart=false; onResize(); });
    startPoll();
  }
  function startPoll(){ if(!resizePoll && onResize) resizePoll=setInterval(onResize,400); }
  function stopPoll(){ if(resizePoll){ clearInterval(resizePoll); resizePoll=null; } }

  function wireTools(){
    var t=el('ts-toggle');
    t.addEventListener('click', function(){
      var on=el('ts-tablewrap').classList.toggle('on');
      t.textContent = on ? 'Hide table' : 'Show table';
    });
    el('ts-csv').addEventListener('click', exportCsv);
  }

  return {
    initialize:function(api,state,cb){
      injectStyles(); buildDates(); wireOffice(); wireTools(); watchResize(); cb();
    },
    focus:function(api,state){
      stateRef=state; startPoll();
      // Re-resolve a relative preset on every focus. Without this a tab left
      // open across midnight keeps yesterday's dates under a "Today" button —
      // the exact stale-range confusion this page just had fixed.
      if(activeKey){ var p=PRESETS.filter(function(x){ return x.k===activeKey; })[0];
                     if(p) applyPreset(p); }
      load(api);
    },
    blur:function(){ stopPoll(); }
  };
};
</script>
</body>
</html>

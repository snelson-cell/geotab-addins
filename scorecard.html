<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<!-- No charting library. The scorecard is a ranked table with diverging cell
     fills; ApexCharts would be a CDN dependency bought for nothing. -->
</head>
<body>
<div id="ds-root">
  <div class="ds-topbar">
    <div>
      <h2 class="ds-h1">Driver scorecard</h2>
      <div class="ds-scope" id="ds-scope">Loading…</div>
    </div>
    <div class="ds-controls">
      <label class="ds-officepick">
        <span>Office</span>
        <select id="ds-office" aria-label="Filter to one office"><option value="">All offices</option></select>
      </label>
      <div class="ds-periods" id="ds-periods" role="group" aria-label="Time range"></div>
    </div>
  </div>

  <div class="ds-note" id="ds-stop"></div>
  <div class="ds-note" id="ds-warn"></div>

  <div class="ds-kpis" id="ds-kpis"></div>

  <div class="ds-key" id="ds-key"></div>

  <div class="ds-tablehead">
    <div class="ds-tabletitle" id="ds-offtitle">Office standings</div>
    <div class="ds-tools"><button type="button" id="ds-offtoggle" class="on">Hide</button></div>
  </div>
  <div class="ds-card" id="ds-offwrap"></div>

  <div class="ds-tablehead">
    <div class="ds-tabletitle" id="ds-title">Ranked drivers</div>
    <div class="ds-tools">
      <button type="button" id="ds-tier">Priority only</button>
      <button type="button" id="ds-csv">Export CSV</button>
    </div>
  </div>
  <div class="ds-card" id="ds-tablewrap"></div>

  <div class="ds-tablehead">
    <div class="ds-tabletitle" id="ds-unranked-title">Not enough miles to rank</div>
    <div class="ds-tools"><button type="button" id="ds-toggle">Show</button></div>
  </div>
  <div class="ds-tablewrap" id="ds-unranked"></div>

  <div class="ds-foot" id="ds-foot"></div>
</div>

<script>
// Registration name must stay stable — the installed MyGeotab add-in config
// references it, as it does this file's URL.
geotab.addin.driverScorecard = function () {
  'use strict';

  // MyGeotab drops this file's <head>, so the stylesheet ships as a string and
  // is injected at initialize(). Moving it back into <head> renders the page
  // completely unstyled, with no warning.
  var STYLE_ID = 'ds-styles';
  var CSS = [
    '#ds-root{',
    '  --surface-1:#fcfcfb; --page:#f9f9f7;',
    '  --ink-1:#0b0b0b; --ink-2:#52514e; --ink-3:#898781;',
    '  --grid:#e1e0d9; --axis:#c3c2b7; --hairline:rgba(11,11,11,.10);',
    '  --accent:#2a78d6; --good-ink:#0a6b18; --warn-ink:#7a5300; --bad-ink:#9b2626;',
    '  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;',
    '  color:var(--ink-1); background:var(--page); padding:18px 20px 28px; width:100%;}',
    '#ds-root, #ds-root *{box-sizing:border-box;}',
    '.ds-h1{font-size:19px;font-weight:650;margin:0;letter-spacing:-.01em;}',
    '.ds-scope{font-size:12.5px;color:var(--ink-3);margin:3px 0 0;}',
    '.ds-topbar{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:12px;}',
    '.ds-controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px;}',
    '.ds-officepick{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-3);}',
    '.ds-officepick select{font:inherit;font-size:12.5px;font-weight:600;color:var(--ink-1);',
    '  background:var(--surface-1);border:1px solid var(--axis);border-radius:7px;padding:6px 9px;cursor:pointer;}',
    '.ds-officepick.on select{border-color:var(--accent);color:var(--accent);}',
    '.ds-periods{display:inline-flex;border:1px solid var(--axis);border-radius:7px;overflow:hidden;background:var(--surface-1);}',
    '.ds-periods button{border:0;background:transparent;color:var(--ink-2);font:inherit;font-size:12.5px;',
    '  font-weight:600;padding:6px 12px;cursor:pointer;border-right:1px solid var(--grid);}',
    '.ds-periods button:last-child{border-right:0;}',
    '.ds-periods button[aria-pressed="true"]{background:var(--accent);color:#fff;}',
    '#ds-root.busy .ds-kpis, #ds-root.busy .ds-card, #ds-root.busy .ds-tablewrap,',
    '#ds-root.busy .ds-foot{opacity:.3;pointer-events:none;transition:opacity .12s ease;}',
    '',
    '.ds-note{font-size:12.5px;border-radius:7px;padding:9px 12px;margin:12px 0 0;display:none;',
    '  border:1px solid var(--hairline);background:var(--surface-1);color:var(--ink-2);}',
    '.ds-note.on{display:block;}',
    '.ds-note--warn{background:#fdf6e3;border-color:#efdca8;color:var(--warn-ink);}',
    '.ds-note--stop{background:#fbece8;border-color:#f0cfc7;color:var(--bad-ink);}',
    '',
    '.ds-kpis{display:flex;flex-wrap:wrap;gap:12px;margin:14px 0 0;}',
    '.ds-kpi{flex:1 1 190px;min-width:0;background:var(--surface-1);border:1px solid var(--hairline);',
    '  border-radius:9px;padding:13px 15px 14px;}',
    '.ds-kpi-label{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);}',
    '.ds-kpi-value{font-size:29px;font-weight:640;line-height:1.12;margin:7px 0 0;letter-spacing:-.02em;}',
    '.ds-kpi-sub{font-size:12px;color:var(--ink-2);margin:4px 0 0;line-height:1.4;}',
    '.ds-kpi-sub .muted{color:var(--ink-3);}',
    '',
    '.ds-card{background:var(--surface-1);border:1px solid var(--hairline);border-radius:9px;',
    '  margin:9px 0 0;overflow-x:auto;}',
    '.ds-tablehead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:20px 0 0;}',
    '.ds-tabletitle{font-size:14px;font-weight:650;}',
    '.ds-tools{display:flex;flex-wrap:wrap;gap:8px;}',
    '.ds-tools button{font:inherit;font-size:12.5px;font-weight:600;color:var(--ink-2);',
    '  background:var(--surface-1);border:1px solid var(--axis);border-radius:6px;padding:5px 11px;cursor:pointer;}',
    '.ds-tools button.on{border-color:var(--accent);color:var(--accent);}',
    '.ds-tablewrap{margin:9px 0 0;border:1px solid var(--hairline);border-radius:9px;',
    '  background:var(--surface-1);display:none;overflow-x:auto;}',
    '.ds-tablewrap.on{display:block;}',
    'table.ds-t{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums;}',
    'table.ds-t th{position:sticky;top:0;background:var(--surface-1);text-align:left;font-size:10.5px;',
    '  letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:9px 10px;',
    '  border-bottom:1px solid var(--grid);white-space:nowrap;z-index:1;}',
    'table.ds-t th.c{text-align:center;} table.ds-t th.r{text-align:right;}',
    'table.ds-t td{padding:7px 10px;border-bottom:1px solid var(--grid);color:var(--ink-2);white-space:nowrap;}',
    'table.ds-t tr:last-child td{border-bottom:0;}',
    'table.ds-t td.name{color:var(--ink-1);font-weight:600;}',
    'table.ds-t td.r{text-align:right;} table.ds-t td.c{text-align:center;}',
    'table.ds-t td.rank{color:var(--ink-3);font-weight:600;text-align:right;}',
    '.ds-score{font-size:15px;font-weight:680;letter-spacing:-.01em;}',
    // Diverging fill: blue = better than the fleet median, gray = typical,
    // red = worse. Sequential would have been wrong here — the meaning is
    // polarity around a midpoint, not magnitude from zero.
    'td.mcell{text-align:center;font-weight:650;border-radius:0;}',
    // The vs-fleet column is gone, so priority rows carry the signal instead —
    // otherwise the Priority count at the top has nothing on the row explaining it.
    'table.ds-t tr.prio td{background:#fdf0ee;}',
    'table.ds-t tr.prio td.name{color:var(--bad-ink);}',
    'table.ds-t tr.sel td{background:#eaf2fc;}',
    'table.ds-t tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--accent);}',
    'table.ds-t tr.sel td.name{color:var(--accent);}',
    '.ds-band{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:20px;}',
    '.ds-band.low{background:#e6f0fb;color:#1c5cab;}',
    '.ds-band.typ{background:#f0efec;color:var(--ink-2);}',
    '.ds-band.elev{background:#fdf1e8;color:#8a4b1d;}',
    '.ds-band.prio{background:#fbece8;color:var(--bad-ink);}',
    '.ds-prov{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.05em;',
    '  text-transform:uppercase;padding:1px 6px;border-radius:20px;margin-left:6px;',
    '  background:var(--grid);color:var(--ink-3);vertical-align:1px;}',
    '.ds-trend{display:inline-block;font-size:12px;font-weight:650;}',
    '.ds-trend.worse{color:var(--bad-ink);} .ds-trend.better{color:var(--good-ink);}',
    '.ds-trend.worse-lo{color:var(--ink-3);font-weight:500;}',
    '.ds-trend.steady{color:var(--ink-3);font-weight:500;} .ds-trend.new{color:var(--axis);}',
    '.ds-legend{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:11.5px;',
    '  color:var(--ink-3);margin:11px 2px 0;}',
    '.ds-legend i{width:26px;height:11px;border-radius:2px;display:inline-block;}',
    // Key sits directly under the KPI row: it explains both the metric cells
    // and the distribution bars in the standings table immediately below it.
    '.ds-key{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin:14px 0 0;',
    '  background:var(--surface-1);border:1px solid var(--hairline);border-radius:9px;',
    '  padding:11px 15px;font-size:12px;color:var(--ink-2);}',
    '.ds-key-t{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;',
    '  color:var(--ink-3);}',
    '.ds-key-s{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}',
    '.ds-key-s i{width:19px;height:11px;border-radius:3px;display:inline-block;flex:none;}',
    '.ds-key-n{color:var(--ink-3);}',
    // Per-metric distribution: one stacked bar per office per metric, segments
    // in the same five colours as the driver cells.
    '.ds-dist{display:flex;height:11px;width:100%;min-width:74px;border-radius:3px;overflow:hidden;',
    '  background:var(--grid);}',
    '.ds-dist span{display:block;height:100%;}',
    '.ds-foot{font-size:12px;color:var(--ink-3);margin:16px 2px 0;line-height:1.55;}',
    '.ds-foot b{color:var(--ink-2);font-weight:600;}',
    '.ds-foot p{margin:0 0 9px;}'
  ].join('\n');

  // ── Constants ────────────────────────────────────────────────────────────
  var LEAF = {b27AB:'Orlando', b27AC:'Tampa', b27AD:'ATL North', b27AE:'ATL South',
              b27AF:'Chicago', b27B0:'Indianapolis', b27B1:'Northern Indy',
              b27B2:'Louisville', b27B3:'Detroit', b27B4:'Grand Rapids',
              b27B5:'Cincinnati', b27B6:'Cleveland', b27B7:'Columbus',
              b27B8:'American Fork'};

  var METRICS = [
    {id:'Speeding',     rule:'RulePostedSpeedingId',        w:0.35},
    {id:'Braking',      rule:'RuleHarshGpsBrakingId',       w:0.35},
    {id:'Cornering',    rule:'RuleHarshGpsCorneringId',     w:0.15},
    {id:'Acceleration', rule:'RuleHarshGpsAccelerationId',  w:0.15}
  ];
  var RULE_TO_METRIC = {};
  METRICS.forEach(function(m){ RULE_TO_METRIC[m.rule] = m.id; });

  // 7 / 14 / 30 days. Every mileage threshold below is ABSOLUTE and does not
  // scale with the window, deliberately: 400 miles is thin evidence whether it
  // was collected over a week or a month. That means the shorter the window,
  // the more drivers are marked thin -- 94% at 7 days, 44% at 14, 30% at 30 --
  // which is the truth about how much you are looking at, not a bug. Scaling
  // the thresholds would relabel 175 miles as "full evidence" purely because
  // the window was short.
  var PERIODS   = [7, 14, 30];
  // Only 7 drivers in the whole fleet sit under 250 miles, so this floor was
  // excluding almost nobody while hiding the occasional real case — one of the
  // four it was suppressing runs at 4.2x the fleet median. Dropping it to 100
  // moves every existing driver by a median of 0.1 points. Below 100 there is
  // nobody left to add.
  var MIN_MILES = 100;
  // Prior strength, in thousands of miles: how much imaginary TYPICAL driving
  // is blended in before ranking, so a short window is not read as fact.
  //
  // This was 2, then 0.5, then 0.25 -- all of them fighting the wrong problem.
  // The real defect was the shrink TARGET, not its strength. Shrinking pulled
  // toward the fleet MEAN, and the rate distribution is heavily right-skewed,
  // so the mean sits at the 66th percentile overall and the 81st for
  // acceleration (mean 5.5, median 1.1). A thin driver behaving EXACTLY like a
  // typical driver was pushed to the 66th percentile and scored 34. Being
  // perfectly average read as below average, purely for driving less.
  //
  // Target is now the MEDIAN rate per metric -- the neutral point of a
  // percentile scale. A thin driver at exactly median behaviour now scores
  // exactly 50; one with no events at all scores 79, credited but not vaulted.
  // Because the target no longer carries a built-in penalty, K can go back up:
  // at 1.0 the best-evidenced driver holds #1, 13 of the top 15 have 750+
  // miles, and every risky thin driver still caps at 47.
  //
  // Measured on 280 drivers: split-half reliability is FLAT across K (rho 0.795
  // at K=0 to 0.808 at K=0.5), so reliability justifies no particular value.
  // Poisson-Gamma empirical Bayes implies K=0.067 -- drivers differ ~47x more
  // than sampling noise -- but that alone over-corrects. At every value tested,
  // shrinkage changed who got CREDIT and never who got FLAGGED.
  var SHRINK_K  = 1.0;
  // Under this, the median still supplies a quarter or more of the score.
  var PROVISIONAL_MILES = 750;

  // Bands are ABSOLUTE multiples of the fleet MEDIAN, not rank quantiles.
  // A rank tier is a treadmill: exactly 20% are bottom-fifth forever, however
  // much the fleet improves, so coaching can never show up as progress. With
  // an absolute band the list shrinks when driving gets better. Median rather
  // than mean because the distribution is heavily right-skewed — the mean sits
  // at roughly the 68th percentile of drivers.
  var BANDS = [
    {max:0.50, key:'low',  label:'Well below'},
    {max:1.50, key:'typ',  label:'Typical'},
    {max:2.50, key:'elev', label:'Elevated'},
    {max:1e9,  key:'prio', label:'Priority'}
  ];
  function bandFor(ratio){
    for(var i=0;i<BANDS.length;i++){ if(ratio < BANDS[i].max) return BANDS[i]; }
    return BANDS[BANDS.length-1];
  }
  var TREND_Z = 2;       // sigmas a move must clear before it is called a change
  // A COMPARISON needs more evidence than a single measurement. At the 250-mile
  // ranking floor the previous window can be almost empty — one driver sat at
  // 251 miles with no events, and any later month reads as a huge increase off
  // that base. Twice the floor before a trend is computed at all.
  // Absolute, NOT derived from MIN_MILES. It was MIN_MILES*2, which quietly
  // fell from 500 to 200 when the floor dropped — and 200 miles in the previous
  // window is exactly the near-empty base that made a top-3 driver read as
  // "+142% worse" before this was fixed the first time.
  var TREND_MIN_MILES = 500;
  var PAGE_CAP  = 25000; // Trip hard-caps here; ExceptionEvent truncates AT resultsLimit
  var ROW_LIMIT = 25000;
  var KM_TO_MI  = 0.621371;
  // The harsh rules were retuned on 2026-08-11 and the speeding rule on
  // 2026-08-10. Event volume before those dates is not comparable to after.
  var RULE_CHANGE = Date.UTC(2026, 7, 11);

  // Diverging scale: blue (better than typical) -> gray -> red (worse).
  var FILL = [
    {max:10,  bg:'#2a78d6', fg:'#ffffff'},
    {max:30,  bg:'#9ec5f4', fg:'#0b0b0b'},
    {max:70,  bg:'#f0efec', fg:'#52514e'},
    {max:90,  bg:'#ec8f8f', fg:'#0b0b0b'},
    {max:101, bg:'#e34948', fg:'#ffffff'}
  ];
  function fillFor(pct){
    for(var i=0;i<FILL.length;i++){ if(pct < FILL[i].max) return FILL[i]; }
    return FILL[FILL.length-1];
  }

  // ── Company benchmark ────────────────────────────────────────────────────
  // A branch-scoped login can only see its own drivers, so left to itself it
  // ranks them against each other -- which centres EVERY branch on ~50 and
  // makes the scores disagree with what an all-branch login sees for the same
  // person. Measured before this was added: Chicago's own login showed its
  // median driver at 52 where the company view said 19, and ATL North's showed
  // 47 where the company view said 61. Correlation between how bad a branch is
  // and how much its own view flattered it: r = 0.87.
  //
  // This is the company distribution, so every login scores against the same
  // yardstick and Chad, Megan and a branch manager all read identical numbers
  // in a 1:1. It holds no names, no vehicles and no branch labels -- only rate

    el('ds-scope').textContent = 'Loading '+days+' days…';
    el('ds-root').classList.add('busy');

    var to = new Date(), from = new Date(to.getTime() - days*24*3600*1000);

    api.multiCall([
      ['Get', {typeName:'Device', resultsLimit:50000}],
      ['Get', {typeName:'User', search:{isDriver:true}}]
    ], function(res){
      var devices = res[0]||[], users = res[1]||[];

      var devOffice = {};
      devices.forEach(function(d){
        (d.groups||[]).forEach(function(g){ if(LEAF[g.id]) devOffice[d.id] = LEAF[g.id]; });
      });
      // Geotab returns archived drivers from this call like any other, so an
      // ex-employee keeps appearing for as long as the window covers their
      // driving. Their miles are real and stay in the measurement; what they
      // must not do is sit in a list of people to go and talk to.
      var uname = {}, gone = {}, nowMs = Date.now();
      users.forEach(function(u){
        uname[u.id] = ((u.firstName||'')+' '+(u.lastName||'')).trim() || u.id;
        if(u.activeTo && new Date(u.activeTo).getTime() <= nowMs) gone[u.id] = true;
      });
      if(!Object.keys(devOffice).length){
        fail('No vehicle in your data scope is assigned to one of the '+
             Object.keys(LEAF).length+' location groups, so no driver can be scored.');
        return;
      }

      function driverId(x){
        if(x && typeof x === 'object' && x.id && x.id !== 'UnknownDriverId') return x.id;
        if(typeof x === 'string' && x && x !== 'UnknownDriverId') return x;
        return null;
      }

      // One windowed fetch PER RULE. An unfiltered 30-day ExceptionEvent Get
      // pulls ~76,000 rows across every rule in the database and throws 70% of
      // them away; the four rules scored here are under a third of that.
      function fetchWindow(a, b, cb, err){
        fetchWindowed(api, 'Trip', a.toISOString(), b.toISOString(), function(trips){
          var got = [], left = METRICS.length;
          METRICS.forEach(function(m){
            fetchWindowed(api, 'ExceptionEvent', a.toISOString(), b.toISOString(),
              function(rows){ got = got.concat(rows); if(--left === 0) cb(build(trips, got)); },
              err, {ruleSearch:{id:m.rule}});
          });
        }, err);
      }

      function build(trips, events){
        var drv = {}, unattributed = 0;
        function ensure(id, office){
          if(!drv[id]) drv[id] = {id:id, name:uname[id]||id, office:office,
                                  archived:!!gone[id], miles:0, ev:{}, rate:{}, pct:{}, rawPct:{}};
          return drv[id];
        }
        trips.forEach(function(t){
          var off = devOffice[(t.device||{}).id]; if(!off) return;
          var mi = (t.distance||0)*KM_TO_MI;
          var id = driverId(t.driver);
          if(!id){ unattributed += mi; return; }
          ensure(id, off).miles += mi;
        });
        events.forEach(function(e){
          var metric = RULE_TO_METRIC[(e.rule||{}).id]; if(!metric) return;
          var off = devOffice[(e.device||{}).id]; if(!off) return;
          var id = driverId(e.driver); if(!id) return;
          ensure(id, off).ev[metric] = (ensure(id, off).ev[metric]||0) + 1;
        });
        return {drv:drv, unattributed:unattributed};
      }

      // The previous window of equal length, for the trend column.
      var prevFrom = new Date(from.getTime() - days*24*3600*1000);
      fetchWindow(from, to, function(cur){
        fetchWindow(prevFrom, from, function(prev){
          DATA = {drv:cur.drv, prev:prev.drv, unattributed:cur.unattributed,
                  from:from, to:to, prevFrom:prevFrom};
          el('ds-root').classList.remove('busy');
          render();
        }, function(err){ fail('Error loading the previous period: '+esc(err)); });
      }, function(err){ fail('Error loading this period: '+esc(err)); });
    }, function(err){ fail('Error loading vehicles and drivers: '+esc(err)); });
  }

  // ── Render ───────────────────────────────────────────────────────────────
  function render(){
    if(!DATA) return;
    clearNotes();

    var everyone = Object.keys(DATA.drv).map(function(k){ return DATA.drv[k]; });
    // Archived drivers are dropped entirely, not just flagged. Geotab keeps
    // returning them from Get User and their trips keep their driver id, so
    // without this an ex-employee stays ranked for a month after leaving —
    // twice at the top of the priority list. Measured cost of removing them:
    // survivors move a median of ONE rank place and no office median moves
    // more than 0.05x, so nothing downstream is distorted by their absence.
    var all = everyone.filter(function(d){ return !d.archived; });
    var goneCount = everyone.length - all.length;
    var offices = {};
    all.forEach(function(d){ (offices[d.office] = offices[d.office] || []).push(d); });
    var officeNames = Object.keys(offices).sort();
    syncOfficePicker(officeNames);

    if(officeFilter && !offices[officeFilter]){
      note('ds-warn','ds-note--warn','<b>'+esc(officeFilter)+'</b> has no attributed driving in '+
           'this window, so nobody there can be scored. Showing all offices.');
      officeFilter=''; syncOfficePicker(officeNames);
    }

    // Ranking is always computed against the WHOLE company — filtering to an
    // office must not re-rank the survivors, or a manager's "12th of 166"
    // changes meaning depending on which dropdown they touched.
    var eligible = all.filter(function(d){ return d.miles >= MIN_MILES; });
    var scored = scoreAll(eligible);
    var curMed = scored.median;
    // The previous window gets its own median, so a fleet-wide shift cancels
    // instead of landing on every driver as "getting worse".
    var prevAll = Object.keys(DATA.prev||{}).map(function(k){ return DATA.prev[k]; })
                        .filter(function(d){ return d.miles >= MIN_MILES; });
    var prevMed = median(prevAll.map(function(d){ return weightedRate(d); }));
    eligible.forEach(function(d){
      d.trend = trendOf(d, (DATA.prev||{})[d.id], curMed, prevMed);
    });
    var companyN = eligible.length;
    var byOffice = {};
    eligible.forEach(function(d){ (byOffice[d.office] = byOffice[d.office] || []).push(d); });
    Object.keys(byOffice).forEach(function(o){
      byOffice[o].forEach(function(d,i){ d.officeRank = i+1; d.officeN = byOffice[o].length; });
    });

    // Office standings. Ranked on the MEDIAN driver's multiple, not the office
    // total: a median puts the office in exactly the same unit as each driver
    // ("the typical driver here is 1.3x the company typical"), and one outlier
    // cannot drag a whole branch down the table.
    var standings = Object.keys(byOffice).map(function(o){
      return {office:o, n:byOffice[o].length,
              med: median(byOffice[o].map(function(d){ return d.ratio; })),
              prio: byOffice[o].filter(function(d){ return d.band.key==='prio'; }).length};
    }).sort(function(a,b){ return a.med-b.med; });
    standings.forEach(function(s,i){ s.rank = i+1; });
    var rankOfOffice = {};
    standings.forEach(function(s){ rankOfOffice[s.office] = s; });
    // Offices with vehicles in scope but nobody scorable are listed too — an
    // empty branch must not read as a good branch.
    var unscored = Object.keys(offices).filter(function(o){ return !rankOfOffice[o]; }).sort();

    var view      = officeFilter ? eligible.filter(function(d){ return d.office===officeFilter; }) : eligible;
    var unranked  = all.filter(function(d){ return d.miles < MIN_MILES; })
                       .filter(function(d){ return !officeFilter || d.office===officeFilter; })
                       .sort(function(a,b){ return b.miles-a.miles; });
    lastRanked = view; lastUnranked = unranked;

    // Every Get is filtered by the signed-in user's data scope, so a
    // location-scoped manager sees only their own office — and the median and
    // percentiles are then computed from that office alone. Saying
    // "company-wide" to that user would be false, so the wording follows what
    // is actually visible.
    var nOff = Object.keys(offices).length;
    el('ds-scope').innerHTML =
      f0(view.length)+' driver'+(view.length===1?'':'s')+' shown &middot; '+
      (nOff===1 ? '<b>'+esc(Object.keys(offices)[0])+'</b>'
                : (officeFilter ? esc(officeFilter) : nOff+' locations in your data scope'))+
      ' &middot; scored against all '+f0(BENCHMARK.drivers)+' drivers company-wide'+
      ' &middot; previous '+days+' days &middot; '+MIN_MILES+'+ mi to qualify';

    var bmAge = (Date.now() - new Date(BENCHMARK.generated).getTime())/86400000;
    if(bmAge > BENCHMARK_STALE_DAYS){
      note('ds-warn','ds-note--warn',
        'The company benchmark these scores are measured against was built '+Math.round(bmAge)+
        ' days ago. Every login still agrees with every other, but the fleet has moved on since '+
        '&mdash; worth refreshing it.');
    } else if(days < 30){
      // Short windows genuinely carry less evidence. Say so, so a wall of "thin"
      // tags on the 7-day view reads as expected rather than broken.
      var thinShare = view.length ? Math.round(100*view.filter(function(d){ return d.provisional; }).length/view.length) : 0;
      note('ds-warn','ds-note--warn',
        'Over '+days+' days a typical driver covers only a few hundred miles, so <b>'+thinShare+
        '% of this view is marked <span class="ds-prov">thin</span></b> &mdash; the score is leaning '+
        'on the typical-driver baseline for most people here. Useful for spotting what happened '+
        'lately; use <b>30 days</b> for anything you intend to say out loud.');
    } else if(nOff===1){
      note('ds-warn','ds-note--warn',
        'Your login shows only <b>'+esc(Object.keys(offices)[0])+'</b>, but scores, ranks and the '+
        'Priority band are measured against all '+f0(BENCHMARK.drivers)+' drivers in the company '+
        '&mdash; so they match exactly what an all-branch login sees for the same person. Your login '+
        'limits <b>who appears</b>, not how they are scored. Office standings need the other '+
        'branches and cannot be shown here.');
    }

    var priority = view.filter(function(d){ return d.band.key==='prio'; });
    var totMi = view.reduce(function(s,d){ return s+d.miles; }, 0);
    var totEv = view.reduce(function(s,d){
      return s + METRICS.reduce(function(a,m){ return a+(d.ev[m.id]||0); }, 0); }, 0);

    el('ds-kpis').innerHTML =
      kpi('Priority', String(priority.length),
          'over '+BANDS[2].max+'&times; the fleet median &middot; <span class="muted">'+
          (officeFilter ? esc(officeFilter) : 'fleet-wide')+'</span>') +
      kpi('Drivers ranked', String(view.length),
          unranked.length+' below '+MIN_MILES+' mi'+
          (goneCount ? ' &middot; <span class="muted">'+goneCount+' left the company, excluded</span>'
                     : ' &middot; <span class="muted">not scored</span>')) +
      kpi('Events per 1,000 mi', totMi ? (totEv/(totMi/1000)).toFixed(1) : '—',
          f0(totEv)+' events over '+f0(totMi)+' mi') +
      (officeFilter && rankOfOffice[officeFilter]
        ? kpi('Office rank',
              rankOfOffice[officeFilter].rank+'<span style="font-size:17px;color:var(--ink-3)"> of '+
                standings.length+'</span>',
              'typical driver here is '+rankOfOffice[officeFilter].med.toFixed(2)+'&times; the company median'+
              (unscored.length ? ' &middot; <span class="muted">'+unscored.length+
               ' office'+(unscored.length===1?'':'s')+' unscorable</span>' : ''))
        : kpi('Offices ranked', String(standings.length),
              standings.length ? esc(standings[0].office)+' best &middot; <span class="muted">'+
                esc(standings[standings.length-1].office)+' worst</span>' : '&mdash;'));

    // ── Colour key, directly above the standings it also explains ─────────
    el('ds-key').innerHTML =
      '<span class="ds-key-t">Colour</span>'+
      FILL.map(function(f,i){
        return '<span class="ds-key-s"><i style="background:'+f.bg+'"></i>'+
          ['Best 10%','Next 20%','Middle 40%','Worse than 70%','Worst 10%'][i]+'</span>';
      }).join('')+
      '<span class="ds-key-n">of all '+f0(BENCHMARK.drivers)+' drivers company-wide, on that metric&rsquo;s raw rate</span>';

    // ── Office standings ──────────────────────────────────────────────────
    el('ds-offtitle').innerHTML = 'Office standings' + (officeFilter
      ? ' <span style="font-weight:400;color:var(--ink-3)">&mdash; all offices shown, '+
        esc(officeFilter)+' highlighted</span>' : '');
    var oh = '<table class="ds-t"><thead><tr><th class="r">#</th><th>Office</th>'+
      '<th class="r">Drivers</th><th class="c">Typical driver</th><th class="r">Priority</th>'+
      METRICS.map(function(m){ return '<th class="c">'+esc(m.id)+'</th>'; }).join('')+
      '</tr></thead><tbody>';
    // Share of an office's drivers falling in each colour band, per metric.
    function distCell(list, m){
      var n=list.length, cnt=[0,0,0,0,0];
      list.forEach(function(d){
        var p=d.rawPct[m.id];
        for(var i=0;i<FILL.length;i++){ if(p<FILL[i].max){ cnt[i]++; break; } }
      });
      var tip=list.length ? esc(m.id)+' across '+n+' driver'+(n===1?'':'s')+': '+
        cnt.map(function(c,i){ return Math.round(100*c/n)+'% '+
          ['best 10%','next 20%','middle 40%','worse than 70%','worst 10%'][i]; }).join(', ') : '';
      return '<td class="c"><span class="ds-dist" title="'+tip+'">'+
        cnt.map(function(c,i){
          return c ? '<span style="width:'+(100*c/n)+'%;background:'+FILL[i].bg+'"></span>' : '';
        }).join('')+'</span></td>';
    }
    var ob = standings.map(function(s){
      var b = bandFor(s.med);
      return '<tr'+(s.office===officeFilter?' class="sel"':'')+'>'+
        '<td class="rank">'+s.rank+'</td>'+
        '<td class="name">'+esc(s.office)+'</td>'+
        '<td class="r">'+s.n+'</td>'+
        '<td class="c"><span class="ds-band '+b.key+'">'+s.med.toFixed(2)+'&times;</span></td>'+
        '<td class="r"'+(s.prio?' style="color:var(--bad-ink);font-weight:600"':'')+'>'+s.prio+'</td>'+
        METRICS.map(function(m){ return distCell(byOffice[s.office], m); }).join('')+'</tr>';
    }).join('') + unscored.map(function(o){
      return '<tr'+(o===officeFilter?' class="sel"':'')+'><td class="rank">&mdash;</td>'+
        '<td class="name">'+esc(o)+'</td><td class="r">0</td>'+
        '<td class="c" colspan="'+(2+METRICS.length)+'" style="color:var(--warn-ink)">no driver with '+
        MIN_MILES+'+ attributed miles &mdash; unmeasured, not clean</td></tr>';
    }).join('');
    el('ds-offwrap').innerHTML = (standings.length + unscored.length) > 1
      ? oh+ob+'</tbody></table>'
      : '<div style="padding:14px;font-size:12.5px;color:var(--ink-3)">Only one location is '+
        'visible to your login, so there is nothing to rank it against.</div>';

    // ── Ranked table ──────────────────────────────────────────────────────
    var rows = coachOnly ? view.filter(function(d){ return d.band.key==='prio'; }) : view;
    el('ds-title').textContent = coachOnly
      ? 'Priority list ('+rows.length+')'
      : 'Ranked drivers ('+rows.length+')';

    var head = '<table class="ds-t"><thead><tr>'+
      '<th class="r">#</th><th>Driver</th><th>Location</th>'+
      '<th class="r">Miles</th><th class="c">Score</th><th class="c">Trend</th>'+
      METRICS.map(function(m){ return '<th class="c">'+esc(m.id)+'</th>'; }).join('')+
      '<th class="c">In office</th></tr></thead><tbody>';
    var body = rows.map(function(d){
      return '<tr'+(d.band.key==='prio' ? ' class="prio"' : '')+'>'+
        '<td class="rank">'+d.rank+'</td>'+
        '<td class="name">'+esc(d.name)+
          (d.provisional ? ' <span class="ds-prov" title="Only '+f0(d.miles)+' miles in this window — '+
            'the score still leans on the fleet average, so treat it as provisional">thin</span>' : '')+
        '</td>'+
        '<td>'+esc(d.office)+'</td>'+
        '<td class="r">'+f0(d.miles)+'</td>'+
        '<td class="c"><span class="ds-score">'+d.score+'</span></td>'+
        '<td class="c"><span class="ds-trend '+d.trend.key+'" title="'+esc(d.trend.title)+'">'+
          d.trend.label+'</span></td>'+
        METRICS.map(function(m){
          var f = fillFor(d.rawPct[m.id]);
          return '<td class="mcell" style="background:'+f.bg+';color:'+f.fg+'" title="'+
            esc(d.name)+' — '+esc(m.id)+': '+d.rate[m.id].toFixed(1)+' per 1,000 mi ('+
            (d.ev[m.id]||0)+' events over '+f0(d.miles)+' mi). Colour is this raw rate against '+
            'the fleet; the score also allows for how few miles they have driven.">'+
            d.rate[m.id].toFixed(1)+'</td>';
        }).join('')+
        '<td class="c">'+d.officeRank+' of '+d.officeN+'</td></tr>';
    }).join('');
    el('ds-tablewrap').innerHTML = rows.length
      ? head+body+'</tbody></table>'
      : '<div style="padding:16px;font-size:12.5px;color:var(--ink-3)">No driver in this '+
        'selection has '+MIN_MILES+'+ attributed miles in the window.</div>';

    // ── Unranked ──────────────────────────────────────────────────────────
    el('ds-unranked-title').textContent = 'Not enough miles to rank ('+unranked.length+')';
    el('ds-unranked').innerHTML = unranked.length
      ? '<table class="ds-t"><thead><tr><th>Driver</th><th>Location</th><th class="r">Miles</th>'+
        '<th class="r">Events</th></tr></thead><tbody>'+
        unranked.map(function(d){
          var n = METRICS.reduce(function(a,m){ return a+(d.ev[m.id]||0); }, 0);
          return '<tr><td class="name">'+esc(d.name)+'</td><td>'+esc(d.office)+'</td>'+
                 '<td class="r">'+f0(d.miles)+'</td><td class="r">'+n+'</td></tr>';
        }).join('')+'</tbody></table>'
      : '<div style="padding:16px;font-size:12.5px;color:var(--ink-3)">Everyone cleared '+
        MIN_MILES+' miles.</div>';

    renderFoot(companyN, goneCount);
  }

  function kpi(label, value, sub){
    return '<div class="ds-kpi"><div class="ds-kpi-label">'+esc(label)+'</div>'+
      '<div class="ds-kpi-value">'+value+'</div><div class="ds-kpi-sub">'+sub+'</div></div>';
  }

  function renderFoot(companyN, goneCount){
    var legend = '<div class="ds-legend"><span>vs fleet bands:</span>'+
      BANDS.map(function(b){ return '<span class="ds-band '+b.key+'">'+esc(b.label)+'</span>'; }).join('')+
      '</div>';
    var w = METRICS.map(function(m){ return esc(m.id)+' '+Math.round(m.w*100)+'%'; }).join(' &middot; ');
    var crossed = DATA && DATA.from.getTime() < RULE_CHANGE;
    el('ds-foot').innerHTML = legend +
      (crossed
        ? '<p style="color:var(--warn-ink)"><b>This window crosses the rule changes.</b> '+
          'The speeding rule changed on 10 Aug and all three harsh rules on 11 Aug, so event '+
          'counts before and after are not the same measurement. Ranking survives it better '+
          'than raw counts do &mdash; everyone is affected together &mdash; but treat the '+
          'per-1,000-mile numbers as mixed until 10 Sep.</p>'
        : '') +
      '<p><b>Score</b> is 0&ndash;100, higher is better. Each metric becomes a percentile '+
      'against every ranked driver in the company, then they are weighted ('+w+') and '+
      'subtracted from 100. Percentiles rather than raw rates, because cornering fires far '+
      'more often than speeding and would otherwise decide the score by itself.</p>'+
      '<p><b>The score is a judgement, not just a tally.</b> It accounts for how much a driver '+
      'has shown you: someone with 450 miles and one event might be excellent or might be lucky, '+
      'and the score says so by sitting them nearer the middle. That is why a driver can have four '+
      'blue cells and a mid-table score. Rows marked <span class="ds-prov">thin</span> are where '+
      'that gap is largest &mdash; under '+PROVISIONAL_MILES+' miles the typical-driver baseline '+
      'still supplies a quarter or more of the score. <b>Rows tinted red are Priority</b>: more '+
      'than '+BANDS[2].max+'&times; the median driver&rsquo;s rate &mdash; an absolute measure, so '+
      'it does not shift as the fleet re-ranks around them.</p>'+
      '<p><b>Cell colours show the raw rate, not the adjusted one</b>, so zero events always reads '+
      'as good. The score may still place that driver mid-table; the cells tell you what they did, '+
      'the score tells you how confident the ranking is.</p>'+
      '<p><b>Thin mileage is pulled toward the fleet average</b> before ranking, by about '+
      SHRINK_K+',000 miles worth. A driver with 300 miles and four events has not shown you '+
      'a rate yet, and without this they would swing between best and worst week to week. '+
      'Under '+MIN_MILES+' miles nobody is scored at all.</p>'+
      '<p><b>vs fleet</b> is that driver\'s weighted event rate as a multiple of the fleet '+
      '<b>median</b> &mdash; median, not average, because the spread is heavily right-skewed and '+
      'the average sits near the 68th driver. The bands are fixed multiples, deliberately not '+
      'quantiles: a bottom-20% tier would label exactly 20% of people a problem forever, however '+
      'much the fleet improves. With a fixed band the list can actually empty out.</p>'+
      '<p><b>Trend compares position, not raw rate.</b> Between the last two 30-day windows the '+
      'fleet median moved 27% on its own &mdash; rule changes, route mix, new vehicles &mdash; '+
      'and trending raw rates charged that to individuals, four &ldquo;worse&rdquo; for every one '+
      '&ldquo;better&rdquo;. Comparing each driver\'s multiple of the fleet instead comes out '+
      'near even. An arrow only appears when the move is larger than Poisson noise at that '+
      'driver\'s mileage; below that it says steady, and with no comparable previous period it '+
      'says nothing at all.</p>'+
      '<p><b>The movement is shown in multiples, not per cent.</b> A driver who was at 0.15&times; '+
      'and is now at 0.36&times; has more than doubled in percentage terms while remaining one of '+
      'the safest people in the company &mdash; per cent off a small base is arithmetically large '+
      'and practically meaningless. A trend needs <b>'+TREND_MIN_MILES+'+ miles in the previous '+
      'period</b>, twice the ranking floor, because a comparison needs more evidence than a single '+
      'measurement. And an upward move on someone still below the fleet median is shown in grey, '+
      'not red &mdash; they are not a concern whichever way they drifted.</p>'+
      '<p><b>Offices are ranked on their MEDIAN driver</b>, not their total, so one bad week '+
      'from one person cannot drag a branch down the table and a large branch is not penalised '+
      'for having more people. It is the same unit as the driver column &mdash; 1.30&times; means '+
      'the typical driver there sets things off 30% more often than the typical driver company-wide. '+
      'Offices with nobody over '+MIN_MILES+' miles are listed without a rank rather than left out: '+
      'an empty branch is unmeasured, not clean, and the fix is assigning drivers to vehicles.</p>'+
      '<p><b>Rank is coarser than it looks.</b> Measured on this fleet, a driver\'s rank moves '+
      'a median of 17 places between one half of a week and the other. Two drivers within '+
      'about 20 places of each other are not distinguishable &mdash; act on the <b>tier</b>, '+
      'and treat the number beside it as rough position. A 30-day window is roughly four times '+
      'steadier than a 7-day one.</p>'+
      '<p><b>Every login scores against the same company yardstick.</b> Scores, ranks and the '+
      'Priority band are measured against a stored snapshot of the whole company &mdash; '+
      f0(BENCHMARK.drivers)+' drivers as of '+esc(String(BENCHMARK.generated).slice(0,10))+' &mdash; '+
      'not against whoever the login happens to see. A branch manager and an all-branch login read '+
      'the identical number for the same driver, which is the point: the two of them look at it '+
      'together. Left to rank only its own people a branch centres itself on 50 whatever its real '+
      'standing &mdash; measured before this was fixed, Chicago&rsquo;s own view put its median '+
      'driver at 52 where the company view said 19. <b>Cell colours read against the company too.</b> '+
      'A branch whose drivers are genuinely the best in Mira shows a wall of blue, and the same '+
      'number is the same colour on every screen &mdash; 13.1 braking events per 1,000 miles sits '+
      'at the 81st percentile company-wide whoever is looking at it.</p>'+
      '<p><b>Drivers archived in Geotab are excluded entirely</b>'+
      (goneCount ? ' &mdash; '+goneCount+' in this window' : '')+'. Geotab returns archived users '+
      'from the same call as everyone else and their trips keep their driver id, so without this '+
      'an ex-employee stays ranked for a month after leaving. Everything on this page &mdash; the '+
      'ranking, the fleet median, the office standings &mdash; is built from current employees '+
      'only. Removing them costs almost nothing in accuracy: the drivers who remain move a median '+
      'of one rank place, and no office median moves by more than 0.05&times;.</p>'+
      '<p><b>Only attributed driving counts.</b> A vehicle with no assigned driver contributes '+
      'nothing here'+(DATA && DATA.unattributed > 1
        ? ' &mdash; '+f0(DATA.unattributed)+' miles in this window belong to nobody'
        : '')+'. Fleet Health lists those vehicles. Camera-based rules are deliberately '+
      'excluded: fitment runs from 0% to 79% by location, so including them would rank people '+
      'by whether they were given a camera.</p>';
  }

  // ── Controls ─────────────────────────────────────────────────────────────
  function syncOfficePicker(names){
    var sel = el('ds-office');
    var want = [''].concat(names);
    var have = Array.prototype.slice.call(sel.options).map(function(o){ return o.value; });
    if(have.length !== want.length || have.some(function(v,i){ return v !== want[i]; })){
      sel.innerHTML = '<option value="">All offices</option>' +
        names.map(function(n){ return '<option value="'+esc(n)+'">'+esc(n)+'</option>'; }).join('');
    }
    sel.value = officeFilter;
    sel.parentNode.className = 'ds-officepick' + (officeFilter ? ' on' : '');
  }

  function buildChrome(){
    el('ds-periods').innerHTML = PERIODS.map(function(p){
      return '<button type="button" data-d="'+p+'" aria-pressed="'+(p===days)+'">'+p+'d</button>';
    }).join('');
    el('ds-periods').addEventListener('click', function(e){
      var b = e.target.closest ? e.target.closest('button') : null;
      if(!b || !apiRef) return;
      var d = +b.getAttribute('data-d');
      if(d === days) return;
      days = d;
      Array.prototype.forEach.call(el('ds-periods').children, function(x){
        x.setAttribute('aria-pressed', String(+x.getAttribute('data-d') === days));
      });
      load(apiRef);
    });
    el('ds-office').addEventListener('change', function(e){
      officeFilter = e.target.value || '';
      render();                      // pure re-render, no API call
    });
    el('ds-tier').addEventListener('click', function(){
      coachOnly = !coachOnly;
      el('ds-tier').className = coachOnly ? 'on' : '';
      el('ds-tier').textContent = coachOnly ? 'Show everyone' : 'Priority only';
      render();
    });
    el('ds-toggle').addEventListener('click', function(){
      var w = el('ds-unranked'), on = w.classList.toggle('on');
      el('ds-toggle').className = on ? 'on' : '';
      el('ds-toggle').textContent = on ? 'Hide' : 'Show';
    });
    el('ds-offtoggle').addEventListener('click', function(){
      var w = el('ds-offwrap'), hide = w.style.display !== 'none';
      w.style.display = hide ? 'none' : '';
      el('ds-offtoggle').className = hide ? '' : 'on';
      el('ds-offtoggle').textContent = hide ? 'Show' : 'Hide';
    });
    el('ds-csv').addEventListener('click', exportCsv);
  }

  function exportCsv(){
    if(!lastRanked.length) return;
    var head = ['Rank','Driver','Location','Miles','Score','VsFleetMedian','Band','Trend','Provisional','OfficeRank','OfficeSize']
      .concat(METRICS.map(function(m){ return m.id+' per 1000mi'; }))
      .concat(METRICS.map(function(m){ return m.id+' events'; }));
    var lines = [head.join(',')].concat(lastRanked.map(function(d){
      return [d.rank, '"'+String(d.name).replace(/"/g,'""')+'"', '"'+d.office+'"',
              Math.round(d.miles), d.score, d.ratio.toFixed(2), d.band.key,
              d.trend.key, d.provisional?'yes':'no', d.officeRank, d.officeN]
        .concat(METRICS.map(function(m){ return d.rate[m.id].toFixed(2); }))
        .concat(METRICS.map(function(m){ return d.ev[m.id]||0; })).join(',');
    }));
    var blob = new Blob([lines.join('\n')], {type:'text/csv;charset=utf-8;'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'driver-scorecard'+(officeFilter ? '-'+officeFilter.toLowerCase().replace(/[^a-z0-9]+/g,'-') : '')+
                 '-'+days+'d.csv';
    document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(a.href);
  }

  return {
    initialize:function(api,state,cb){ injectStyles(); buildChrome(); cb(); },
    focus:function(api){ load(api); },
    blur:function(){}
  };
};
</script>
</body>
</html>

  // stretch since the rules were last re-cut, because an event counted under
  // the old rule is not the same event the benchmark was built from.
  var effDays = 30;
  var lastRanked = [], lastUnranked = [];

  // ── Small helpers ────────────────────────────────────────────────────────
  function el(id){ return document.getElementById(id); }
  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function f0(n){ return Math.round(n).toLocaleString(); }
  function clearNotes(){
    ['ds-stop','ds-warn','ds-recal'].forEach(function(i){ var e=el(i); if(e){ e.className='ds-note'; e.innerHTML=''; } });
  }
  function note(id, cls, html){ el(id).className='ds-note '+cls+' on'; el(id).innerHTML=html; }
  function fail(msg){
    el('ds-root').classList.remove('busy');
    note('ds-stop','ds-note--stop', msg);
    el('ds-scope').textContent='Could not load';
  }
  function injectStyles(){
    if(document.getElementById(STYLE_ID)) return;
    var s=document.createElement('style'); s.id=STYLE_ID; s.textContent=CSS;
    document.head.appendChild(s);
  }

  // Average ranks so ties don't inherit an arbitrary order.
  function rankAsc(vals){
    var idx = vals.map(function(v,i){ return i; })
                  .sort(function(a,b){ return vals[a]-vals[b]; });
    var out = new Array(vals.length), i = 0;
    while(i < idx.length){
      var j = i;
      while(j+1 < idx.length && vals[idx[j+1]] === vals[idx[i]]) j++;
      var avg = (i + j) / 2 + 1;
      for(var k=i;k<=j;k++) out[idx[k]] = avg;
      i = j + 1;
    }
    return out;
  }

  // Geotab silently truncates: Trip caps at 25,000 no matter what resultsLimit
  // says, and ExceptionEvent honours resultsLimit and cuts there — unevenly,
  // dropping recent rows first. Either way a guard on `length >= resultsLimit`
  // is the only thing that fires, so split the window until nothing is cut.
  function fetchWindowed(api, typeName, a0, b0, done, fail_, extra){
    var out=[], pending=0, failed=false, splits=0;
    function grab(a,b,depth){
      pending++;
      var search = {fromDate:a, toDate:b};
      if(extra) for(var k in extra) search[k] = extra[k];
      api.call('Get', {typeName:typeName, resultsLimit:ROW_LIMIT,
                       search:search}, function(rows){
        rows = rows || [];
        if(rows.length >= PAGE_CAP && depth < 7){
          var mid = new Date((new Date(a).getTime() + new Date(b).getTime())/2).toISOString();
          splits++; pending--;
          grab(a, mid, depth+1); grab(mid, b, depth+1);
          return;
        }
        out = out.concat(rows);
        if(--pending === 0 && !failed) done(out, splits);
      }, function(err){ if(!failed){ failed = true; fail_(err); } });
    }
    grab(a0, b0, 0);
  }

  // ── Scoring ──────────────────────────────────────────────────────────────
  // Percentile within the eligible set, per metric, on a rate that is shrunk
  // toward the fleet mean in proportion to how few miles the driver drove.
  // Without the shrink a 260-mile driver's three events read as a real rate.
  function scoreAll(drivers){
    if(!drivers.length) return [];
    // Shrink target and percentile base both come from the COMPANY benchmark,
    // never from whoever happens to be visible. Without this a branch-scoped
    // login ranks its drivers against each other, which centers every branch on
    // ~50 and makes the same driver score differently for a branch manager than
    // for Chad or Megan — the two people who need to read the same row in a 1:1.
    var fleetRate = {};
    METRICS.forEach(function(m){
      fleetRate[m.id] = BENCHMARK.medianRate[m.id];
    });

    METRICS.forEach(function(m){
      var rawRate = drivers.map(function(d){ return (d.ev[m.id]||0) / (d.miles/1000); });
      drivers.forEach(function(d,i){
        if(!d.rawPct) d.rawPct = {};
        d.rate[m.id] = rawRate[i];
        // Adjusted rate, then its position in the COMPANY distribution.
        var clean = !(d.ev[m.id]||0);
        var adj = ((d.ev[m.id]||0) + SHRINK_K*fleetRate[m.id]) / (d.miles/1000 + SHRINK_K);
        d.pct[m.id] = pctFromBreaks(bmWin().adjusted[m.id], adj, clean);
        // Color is company-referenced too. Ranking colors within whoever is
        // on screen renormalises every branch: a branch whose drivers are all
        // genuinely excellent would still show a normal spread of blue and red,
        // and the same number would be grey to one login and red to another.
        // Same for the color, so a 0.0 cell reads as the best possible rather than
        // as "typical" merely because most of the fleet is also at zero.
        d.rawPct[m.id] = pctFromBreaks(bmWin().raw[m.id], rawRate[i], clean);
      });
    });

    drivers.forEach(function(d){
      var bad = 0;
      METRICS.forEach(function(m){ bad += m.w * d.pct[m.id]; });
      // Round the deduction FIRST, then derive the score from it. The worked example
      // prints this same figure, so "100 - lost = score" holds by construction rather
      // than by luck -- previously an exact total of 45.51 scored 54 while the printed
      // 45.4 implied 55.
      d.lost  = Math.round(bad*10)/10;
      d.score = Math.round(100 - d.lost);
    });
    drivers.sort(function(a,b){ return b.score-a.score || b.miles-a.miles; });
    drivers.forEach(function(d,i){
      d.localRank = i+1;
      // Company position implied by the score. A login that can see everyone
      // and one that can see one branch now report the same number.
      d.rank = companyRank(d.score) || (i+1);
      // Round before comparing so the tag agrees with the Miles column beside
      // it. At 749.6 the column shows 750 and the raw compare still called it
      // thin, which reads as a bug to anyone checking the number.
      d.provisional = Math.round(d.miles) < PROVISIONAL_MILES;
    });
    return {drivers:drivers};
  }

  function weightedEvents(d){
    var e = 0;
    METRICS.forEach(function(m){ e += m.w * (d.ev[m.id]||0); });
    return e;
  }
  function weightedRate(d){ return d.miles > 0 ? weightedEvents(d)/(d.miles/1000) : 0; }
  // Var(sum w_i N_i) = sum w_i^2 * lambda_i for independent Poisson counts.
  function weightedVar(d){
    var v = 0;
    METRICS.forEach(function(m){ v += m.w * m.w * Math.max(d.ev[m.id]||0, 1); });
    return v;
  }
  function median(a){
    if(!a.length) return 0;
    var s = a.slice().sort(function(x,y){ return x-y; }), h = s.length>>1;
    return s.length % 2 ? s[h] : (s[h-1]+s[h])/2;
  }

  // A change is only called a change when it clears Poisson noise at THAT
  // driver's exposure — 200 miles and four events cannot show a trend.
  // Crucially this compares each driver's RATIO to the fleet, not their raw
  // rate: between the last two 30-day windows the fleet median moved +27% on
  // its own (rule changes, route mix, new vehicles). Trending raw rates blamed
  // that on individuals — 4 "worse" for every 1 "better". Trending position
  // instead comes out 1.4:1, which is what individual variation looks like.
  function trendOf(d, prev, curMed, prevMed){
    if(!prev || prev.miles < TREND_MIN_MILES){
      return {key:'new', label:'—',
              title:'No comparable previous period'+
                    (prev && prev.miles ? ' — only '+f0(prev.miles)+' miles, and a comparison needs '+
                     TREND_MIN_MILES+'+' : '')};
    }
    var e1 = weightedEvents(d),    m1 = d.miles/1000;
    var e2 = weightedEvents(prev), m2 = prev.miles/1000;
    if(!m1 || !m2 || !curMed || !prevMed) return {key:'new', label:'—', title:'Not enough history'};
    var r1 = (e1/m1)/curMed, r2 = (e2/m2)/prevMed;
    // The weighted total is NOT itself a Poisson count, so its variance is
    // sum(w^2 * n), not the total. Treating it as a count would scale the
    // standard error with the arbitrary choice of weight magnitude.
    var se = Math.sqrt(
      Math.max(weightedVar(d),    1e-9)/(m1*m1*curMed*curMed) +
      Math.max(weightedVar(prev), 1e-9)/(m2*m2*prevMed*prevMed));
    var z  = se ? (r1-r2)/se : 0;
    var t = Math.abs(z) < TREND_Z ? 'steady' : (z > 0 ? 'worse' : 'better');
    // A driver still comfortably below the fleet is not a concern whichever way
    // they moved, so the movement is reported without alarm styling.
    var cls = (t === 'worse' && r1 < 1) ? 'worse-lo' : t;
    return {
      key: t, cls: cls,
      label: t==='steady' ? 'steady'
                          : (z>0 ? '▲ +' : '▼ −')+Math.abs(r1-r2).toFixed(2)+'×',
      title: 'Position vs the fleet moved '+r2.toFixed(2)+'× → '+r1.toFixed(2)+'× ('+
             Math.abs(z).toFixed(1)+' sigma over '+f0(d.miles)+' miles). '+
             (t==='steady' ? 'Inside normal variation.'
              : cls==='worse-lo' ? 'Still below the fleet median, so not a concern by itself.'
              : 'Larger than noise at this mileage.')
    };
  }

  // ── Load ─────────────────────────────────────────────────────────────────
  function load(api){
    apiRef = api; clearNotes();
    el('ds-scope').textContent = 'Loading '+days+' days…';
    el('ds-root').classList.add('busy');

    var to = new Date();
    // The harsh and speeding rules were re-cut on BENCHMARK.rulesChangedAt.
    // Braking fired roughly four times as often before that date, so pulling
    // 30 days of counts and scoring them against breakpoints built from the
    // current rule would read the rule change as every driver getting worse.
    // The window is therefore floored at the change; the view says so.
    var floorMs = Date.parse(BENCHMARK.rulesChangedAt || '1970-01-01') || 0;
    var from = new Date(Math.max(to.getTime() - days*24*3600*1000, floorMs));
    effDays = Math.max(1, Math.round((to.getTime()-from.getTime())/86400000));

    api.multiCall([
      ['Get', {typeName:'Device', resultsLimit:50000}],
      ['Get', {typeName:'User', search:{isDriver:true}}]
    ], function(res){
      var devices = res[0]||[], users = res[1]||[];

      var devOffice = {};
      devices.forEach(function(d){
        (d.groups||[]).forEach(function(g){ if(LEAF[g.id]) devOffice[d.id] = LEAF[g.id]; });
      });
      // Geotab returns archived drivers from this call like any other, so an
      // ex-employee keeps appearing for as long as the window covers their
      // driving. Their miles are real and stay in the measurement; what they
      // must not do is sit in a list of people to go and talk to.
      var uname = {}, gone = {}, nowMs = Date.now();
      users.forEach(function(u){
        uname[u.id] = ((u.firstName||'')+' '+(u.lastName||'')).trim() || u.id;
        if(u.activeTo && new Date(u.activeTo).getTime() <= nowMs) gone[u.id] = true;
      });
      if(!Object.keys(devOffice).length){
        fail('No vehicle in your data scope is assigned to one of the '+
             Object.keys(LEAF).length+' location groups, so no driver can be scored.');
        return;
      }

      function driverId(x){
        if(x && typeof x === 'object' && x.id && x.id !== 'UnknownDriverId') return x.id;
        if(typeof x === 'string' && x && x !== 'UnknownDriverId') return x;
        return null;
      }

      // One windowed fetch PER RULE. An unfiltered 30-day ExceptionEvent Get
      // pulls ~76,000 rows across every rule in the database and throws 70% of
      // them away; the four rules scored here are under a third of that.
      function fetchWindow(a, b, cb, err){
        fetchWindowed(api, 'Trip', a.toISOString(), b.toISOString(), function(trips){
          var got = [], left = METRICS.length;
          METRICS.forEach(function(m){
            fetchWindowed(api, 'ExceptionEvent', a.toISOString(), b.toISOString(),
              function(rows){ got = got.concat(rows); if(--left === 0) cb(build(trips, got)); },
              err, {ruleSearch:{id:m.rule}});
          });
        }, err);
      }

      function build(trips, events){
        var drv = {}, unattributed = 0;
        function ensure(id, office){
          if(!drv[id]) drv[id] = {id:id, name:uname[id]||id, office:office,
                                  archived:!!gone[id], miles:0, ev:{}, rate:{}, pct:{}, rawPct:{}};
          return drv[id];
        }
        trips.forEach(function(t){
          var off = devOffice[(t.device||{}).id]; if(!off) return;
          var mi = (t.distance||0)*KM_TO_MI;
          var id = driverId(t.driver);
          if(!id){ unattributed += mi; return; }
          ensure(id, off).miles += mi;
        });
        events.forEach(function(e){
          var metric = RULE_TO_METRIC[(e.rule||{}).id]; if(!metric) return;
          var off = devOffice[(e.device||{}).id]; if(!off) return;
          var id = driverId(e.driver); if(!id) return;
          ensure(id, off).ev[metric] = (ensure(id, off).ev[metric]||0) + 1;
        });
        return {drv:drv, unattributed:unattributed};
      }

      // The previous window of equal length, for the trend column.
      // Equal-length previous window. It sits BEFORE the rule change and that
      // is fine: the trend divides each side by its own period median, so a
      // fleet-wide shift -- including the rule change itself -- cancels.
      var prevFrom = new Date(from.getTime() - effDays*24*3600*1000);
      fetchWindow(from, to, function(cur){
        fetchWindow(prevFrom, from, function(prev){
          DATA = {drv:cur.drv, prev:prev.drv, unattributed:cur.unattributed,
                  from:from, to:to, prevFrom:prevFrom};
          el('ds-root').classList.remove('busy');
          render();
        }, function(err){ fail('Error loading the previous period: '+esc(err)); });
      }, function(err){ fail('Error loading this period: '+esc(err)); });
    }, function(err){ fail('Error loading vehicles and drivers: '+esc(err)); });
  }

  // ── Render ───────────────────────────────────────────────────────────────
  function render(){
    if(!DATA) return;
    clearNotes();
    var fm = floorMismatch();
    if(fm){
      fail('Scoring and benchmark disagree &mdash; '+esc(fm)+'. Every rank on screen would '+
           'come from a different scoring function than the score beside it. Regenerate '+
           'benchmark/company-30d.json.');
      return;
    }
    var wm = weightMismatch();
    if(wm){
      fail('This page scores with different weights than the benchmark it '+
           'ranks against &mdash; '+esc(wm)+'. Every score and rank on screen would '+
           'be built from two different scoring functions. Regenerate '+
           'benchmark/company-30d.json with the current weights.');
      return;
    }

    var everyone = Object.keys(DATA.drv).map(function(k){ return DATA.drv[k]; });
    // Archived drivers are dropped entirely, not just flagged. Geotab keeps
    // returning them from Get User and their trips keep their driver id, so
    // without this an ex-employee stays ranked for a month after leaving —
    // twice at the top of the priority list. Measured cost of removing them:
    // survivors move a median of ONE rank place and no office median moves
    // more than 0.05x, so nothing downstream is distorted by their absence.
    var all = everyone.filter(function(d){ return !d.archived; });
    var goneCount = everyone.length - all.length;
    var offices = {};
    all.forEach(function(d){ (offices[d.office] = offices[d.office] || []).push(d); });
    var officeNames = Object.keys(offices).sort();
    syncOfficePicker(officeNames);

    if(officeFilter && !offices[officeFilter]){
      note('ds-warn','ds-note--warn','<b>'+esc(officeFilter)+'</b> has no attributed driving in '+
           'this window, so nobody there can be scored. Showing all offices.');
      officeFilter=''; syncOfficePicker(officeNames);
    }

    // Ranking is always computed against the WHOLE company — filtering to an
    // office must not re-rank the survivors, or a manager's "12th of 166"
    // changes meaning depending on which dropdown they touched.
    var eligible = all.filter(function(d){ return d.miles >= MIN_MILES; });
    var scored = scoreAll(eligible);
    // Both trend reference medians come from the benchmark, per window. They
    // were being computed from the visible population, which made the trend
    // the last thing on the row that could disagree between two logins — and
    // Cleveland has no drivers with a trend at all, so no amount of testing
    // there would have shown it.
    var bw = BENCHMARK.windows[winKey()] || BENCHMARK.windows['30'];
    var curMed = bw.curMed;
    // The previous window gets its own median, so a fleet-wide shift cancels
    // instead of landing on every driver as "getting worse".
    var prevMed = bw.prevMed;
    eligible.forEach(function(d){
      d.trend = trendOf(d, (DATA.prev||{})[d.id], curMed, prevMed);
    });
    var companyN = eligible.length;
    var byOffice = {};
    eligible.forEach(function(d){ (byOffice[d.office] = byOffice[d.office] || []).push(d); });
    Object.keys(byOffice).forEach(function(o){
      byOffice[o].forEach(function(d,i){ d.officeRank = i+1; d.officeN = byOffice[o].length; });
    });

    // Office standings. Ranked on the MEDIAN driver's multiple, not the office
    // total: a median puts the office in exactly the same unit as each driver
    // and one outlier cannot drag a whole branch down the table.
    //
    // A branch-scoped login can only see its own office, so ranking what it can
    // see produces a one-row table that says nothing. When fewer offices are
    // visible than the company has, the standings come from the benchmark
    // instead — branch-level aggregates only, no individuals — so a branch
    // manager can see where they sit without seeing anyone else's people.
    // ALWAYS from the benchmark, for every login. Computing them live for an
    // all-branch login and from the snapshot for a branch login puts the two
    // back out of step — which is the whole problem this benchmark exists to
    // remove. They carry the snapshot date instead.
    // Last week's standings ride along in the benchmark itself, so the movement
    // is the same for every login and needs no history kept in the browser.
    var prevOff = {}, prevGen = (BENCHMARK.previous || {}).generated || '';
    // Normalised to the same field names the current rows use. The stored form
    // says `median`/`drivers`; the rows say `med`/`n`. Comparing the two shapes
    // directly reads a field that is simply undefined, which throws at render.
    ((BENCHMARK.previous || {}).offices || []).forEach(function(o){
      prevOff[o.office] = {office:o.office, n:o.drivers, med:o.median, rank:o.rank};
    });
    var standings = BENCHMARK.offices.map(function(o){
      return {office:o.office, n:o.drivers, med:o.median, rank:o.rank, dist:o.dist,
              prev: prevOff[o.office] || null};
    });
    var unscored = [];
    var rankOfOffice = {};
    standings.forEach(function(s){ rankOfOffice[s.office] = s; });
    // The office this login is actually about: an explicit filter, or the only
    // office it can see.
    var myOffice = officeFilter || (Object.keys(offices).length===1 ? Object.keys(offices)[0] : '');

    var view      = officeFilter ? eligible.filter(function(d){ return d.office===officeFilter; }) : eligible;
    var unranked  = all.filter(function(d){ return d.miles < MIN_MILES; })
                       .filter(function(d){ return !officeFilter || d.office===officeFilter; })
                       .sort(function(a,b){ return b.miles-a.miles; });
    lastRanked = view; lastUnranked = unranked;

    // Every Get is filtered by the signed-in user's data scope, so a
    // location-scoped manager sees only their own office — and the median and
    // percentiles are then computed from that office alone. Saying
    // "company-wide" to that user would be false, so the wording follows what
    // is actually visible.
    var nOff = Object.keys(offices).length;
    el('ds-scope').innerHTML =
      f0(view.length)+' driver'+(view.length===1?'':'s')+' shown &middot; '+
      (nOff===1 ? '<b>'+esc(Object.keys(offices)[0])+'</b>'
                : (officeFilter ? esc(officeFilter) : nOff+' locations in your data scope'))+
      ' &middot; scored against all '+f0(BENCHMARK.drivers)+' drivers company-wide'+
      ' &middot; previous '+effDays+' days'+(effDays<days ? ' (all there is since the rule change)' : '')+
      ' &middot; '+MIN_MILES+'+ mi to qualify';

    // A rule re-cut AFTER the benchmark was built: that metric's breakpoints
    // still describe the old threshold, so its COLOUR reads harsher than it
    // should until there is enough new data to rebuild them. Measured cost of
    // the 26 Aug acceleration move: at most 1.2 score points, median 0.0 --
    // but 52 -> 84 drivers land in the worst band, which is what people see.
    var changed = BENCHMARK.metricChangedAt || {};
    var recal = Object.keys(changed).filter(function(k){
      return METRICS.some(function(m){ return m.id === k; });
    });
    if(recal.length){
      note('ds-recal','ds-note--warn',
        '<b>'+recal.map(esc).join(' and ')+'</b> '+(recal.length>1?'rules were':'rule was')+
        ' re-cut on '+esc(changed[recal[0]])+', after this benchmark was built. Those events '+
        'now fire more often than the yardstick beside them expects, so that column reads '+
        'harsher than it should &mdash; more red cells, though scores move barely at all '+
        '(at most about a point). It corrects itself when the benchmark is rebuilt.');
    }

    // 750 miles is a 30-day bar: it takes 25 mi/day to clear over 30 days but 107 over 7,
    // so on a short window nearly every row is thin. The statistic stays true -- a 400-mile
    // driver really is only 62% their own numbers -- but a tag on 92% of rows discriminates
    // nothing and reads as an unexplained warning. Show it per row only where it singles
    // someone out; otherwise say it once, in the note, as a fact about the window.
    //
    // Cutoff is a THIRD, not a half. Measured 2026-09-03 against live trips, same
    // definition this view uses (office-mapped device, attributed driver, 100-mile floor):
    //   7d  256/277 thin = 92%     14d 162/299 = 54%     30d 62/336 = 18%
    // A half sits 4 points from the 14-day value, so ordinary drift would flicker the tag
    // on and off between visits. A third clears 14d by 21 points and 30d by 15, and it is
    // the right idea anyway: at 54% the tag is on the MAJORITY, which is backwards for
    // something meant to mark the exception.
    var thinShare = view.length
      ? Math.round(100*view.filter(function(d){ return d.provisional; }).length/view.length) : 0;
    tagIsNoise = thinShare > 33;

    var bmAge = (Date.now() - new Date(BENCHMARK.generated).getTime())/86400000;
    if(bmAge > BENCHMARK_STALE_DAYS){
      note('ds-warn','ds-note--warn',
        'The company benchmark these scores are measured against was built '+Math.round(bmAge)+
        ' days ago. Every login still agrees with every other, but the fleet has moved on since '+
        '&mdash; worth refreshing it.');
    } else if(days - effDays > 1){
      // Not a warning about the data being thin -- a statement that the window
      // was deliberately cut, and why. Without it the view silently disagrees
      // with the dropdown the manager just clicked.
      note('ds-warn','ds-note--warn',
        'Showing <b>'+effDays+' days</b>, not '+days+'. The harsh and speeding rules were re-cut on <b>'+
        esc(String(BENCHMARK.rulesChangedAt))+'</b> &mdash; braking alone fired about four times as often '+
        'before that date, so older events are not the same measurement and cannot be compared against '+
        'the current benchmark. The full '+days+'-day window returns once '+days+' days have passed under '+
        'the new rules.');
    } else if(SHOW_SHORT_WINDOW_NOTE && days < 30){
      // Short windows genuinely carry less evidence. Say so, so a wall of "thin"
      // tags on the 7-day view reads as expected rather than broken.
      //
      // Deliberately does NOT tell a manager to stop using this window: the weekly
      // meeting runs on 7d and 14d, and the scoring is honest at that length --
      // each window has its own breakpoints, and shrinking toward the MEDIAN means
      // a thin driver at typical behaviour scores 50, not 34. The blend only damps
      // CREDIT (a risky thin driver still caps at 47), so a red cell here is real
      // and a green one is if anything understated. The caution belongs on ranking
      // drivers against each other, which is what a crowded tie at 100 reflects.
      note('ds-warn','ds-note--warn',
        'Over '+days+' days most drivers cover too few miles to rank. The event counts are '+
        'real, but everyone without events ties at 100 &mdash; use <b>30 days</b> to '+
        'compare drivers.');
    } else if(nOff===1){
      note('ds-warn','ds-note--warn',
        'Your login shows only <b>'+esc(Object.keys(offices)[0])+'</b>, but scores and ranks '+
        'are measured against all '+f0(BENCHMARK.drivers)+' drivers in the company '+
        '&mdash; so they match exactly what an all-branch login sees for the same person. Your login '+
        'limits <b>who appears</b>, not how they are scored. Office standings need the other '+
        'branches and cannot be shown here.');
    }

    var totMi = view.reduce(function(s,d){ return s+d.miles; }, 0);
    var totEv = view.reduce(function(s,d){
      return s + METRICS.reduce(function(a,m){ return a+(d.ev[m.id]||0); }, 0); }, 0);

    // Same window length, one window back. DATA.prev is already fetched for the
    // per-driver trend, so this costs nothing extra -- but it is only comparable
    // when the earlier window has real mileage behind it. Measured 2026-09-03,
    // the prior window carries 93% of current miles at 7 days and 98% at 14,
    // and 21% at 30, because July was still device rollout. That thin base makes
    // the 30-day comparison read -19% off a population 4.8x smaller, which is an
    // artifact and not an improvement, so it is withheld rather than shown with
    // a caveat nobody would read. Clears itself once the window leaves July.
    var PREV_MIN_COVERAGE = 0.5;
    var prevView = Object.keys(DATA.prev || {}).map(function(k){ return DATA.prev[k]; })
      .filter(function(d){ return !d.archived && d.miles >= MIN_MILES; })
      .filter(function(d){ return !officeFilter || d.office === officeFilter; });
    var prevMi = prevView.reduce(function(s,d){ return s+d.miles; }, 0);
    var prevEv = prevView.reduce(function(s,d){
      return s + METRICS.reduce(function(a,m){ return a+(d.ev[m.id]||0); }, 0); }, 0);

    var evTrend = '';
    if(totMi && prevMi >= totMi*PREV_MIN_COVERAGE){
      var curR = totEv/(totMi/1000), prevR = prevEv/(prevMi/1000);
      if(prevR > 0){
        var pd = (curR-prevR)/prevR*100;
        // Fewer events is better, so a fall is the good direction.
        var cls  = Math.abs(pd) < 1 ? 'steady' : (pd < 0 ? 'better' : 'worse');
        var mark = Math.abs(pd) < 1 ? 'flat'
                 : (pd < 0 ? '&#9660;' : '&#9650;')+Math.abs(pd).toFixed(0)+'%';
        evTrend = ' &middot; <span class="ds-trend '+cls+'">'+mark+'</span>'+
                  '<span class="muted"> vs prior '+effDays+' days ('+prevR.toFixed(1)+')</span>';
      }
    }

    el('ds-kpis').innerHTML =
      kpi('Drivers ranked', String(view.length),
          unranked.length+' below '+MIN_MILES+' mi'+
          (goneCount ? ' &middot; <span class="muted">'+goneCount+' left the company, excluded</span>'
                     : ' &middot; <span class="muted">not scored</span>')) +
      kpi('Events per 1,000 mi', totMi ? (totEv/(totMi/1000)).toFixed(1) : '—',
          f0(totEv)+' events over '+f0(totMi)+' mi'+evTrend) +
      (myOffice && rankOfOffice[myOffice]
        ? kpi('Office rank',
              rankOfOffice[myOffice].rank+'<span style="font-size:17px;color:var(--ink-3)"> of '+
                standings.length+'</span>',
              'typical '+esc(myOffice)+' driver is '+rankOfOffice[myOffice].med.toFixed(2)+
              '&times; the company median')
        : kpi('Offices ranked', String(standings.length),
              standings.length ? esc(standings[0].office)+' best &middot; <span class="muted">'+
                esc(standings[standings.length-1].office)+' worst</span>' : '&mdash;'));

    // ── Color key, directly above the standings it also explains ─────────
    var keyHtml =
      '<span class="ds-key-t">Color</span>'+
      FILL.map(function(f,i){
        return '<span class="ds-key-s"><i style="background:'+f.bg+'"></i>'+
          ['Best 10%','Next 20%','Middle 40%','Worse than 70%','Worst 10%'][i]+'</span>';
      }).join('')+
      '<span class="ds-key-n">of all '+f0(BENCHMARK.drivers)+' drivers company-wide, on that metric&rsquo;s raw rate</span>';
    el('ds-key').innerHTML = keyHtml;
    if(el('ds-key2')) el('ds-key2').innerHTML = keyHtml;

    // ── Office standings ──────────────────────────────────────────────────
    el('ds-offtitle').innerHTML = 'Office standings' +
      (myOffice ? ' <span style="font-weight:400;color:var(--ink-3)">&mdash; all offices shown, '+
        esc(myOffice)+' highlighted</span>' : '') +
      ' <span class="ds-snap" title="These standings are a frozen company-wide '+
        'snapshot, not the live view. They do not change with the 7d / 14d / 30d '+
        'selector, and they refresh when the benchmark is rebuilt.">'+
        '<span class="ds-snap-k">Snapshot</span>'+
        '<span class="ds-snap-v">'+esc(prettyDate(BENCHMARK.generated))+
          (prevGen ? ' <span class="ds-snap-vs">vs</span> '+esc(prettyDate(prevGen)) : '')+
        '</span></span>';
    var oh = '<table class="ds-t"><thead><tr><th class="r">#</th><th>Office</th>'+
      '<th class="r" title="How many drivers this office had when the benchmark was built on '+
      esc(String(BENCHMARK.generated).slice(0,10))+'. The live number moves as people cross the '+
      MIN_MILES+'-mile floor, so it can differ from a count taken today.">Drivers</th>'+
      '<th class="c">Typical driver</th>'+
      (prevGen ? '<th class="c" title="Where this office stood on '+
        esc(String(prevGen).slice(0,10))+', and how far it has moved since. '+
        'Rank 1 is safest, so an up arrow is an improvement.">Last week</th>' : '')+
      METRICS.map(function(m){ return '<th class="c">'+esc(m.id)+'</th>'; }).join('')+
      '</tr></thead><tbody>';

    // Movement against last week's snapshot. Rank 1 is best, so a FALL in rank
    // number is an improvement -- the arrow follows quality, not the integer.
    function moveCell(s){
      if(!prevGen) return '';
      if(!s.prev) return '<td class="c" style="color:var(--ink-3)">new</td>';
      var d = s.prev.rank - s.rank;
      var cls = d === 0 ? 'steady' : (d > 0 ? 'better' : 'worse');
      var mark = d === 0 ? '&mdash;' : (d > 0 ? '&#9650;'+d : '&#9660;'+(-d));
      return '<td class="c" style="white-space:nowrap">'+
        '<span style="color:var(--ink-3)">#'+s.prev.rank+'</span> '+
        '<span class="ds-trend '+cls+'">'+mark+'</span></td>';
    }
    // Share of an office's drivers falling in each color band, per metric.
    function distCell(row, m){
      var cnt, n;
      if(row.dist){ cnt = row.dist[m.id].slice(); n = row.n; }
      else {
        cnt=[0,0,0,0,0]; n=row.list.length;
        row.list.forEach(function(d){
          var p=d.rawPct[m.id];
          for(var i=0;i<FILL.length;i++){ if(p<FILL[i].max){ cnt[i]++; break; } }
        });
      }
      if(!n) return '<td class="c"></td>';
      var tip=n ? esc(m.id)+' across '+n+' driver'+(n===1?'':'s')+': '+
        cnt.map(function(c,i){ return Math.round(100*c/n)+'% '+
          ['best 10%','next 20%','middle 40%','worse than 70%','worst 10%'][i]; }).join(', ') : '';
      return '<td class="c"><span class="ds-dist" title="'+tip+'">'+
        cnt.map(function(c,i){
          return c ? '<span style="width:'+(100*c/n)+'%;background:'+FILL[i].bg+'"></span>' : '';
        }).join('')+'</span></td>';
    }
    var ob = standings.map(function(s){
      return '<tr'+(s.office===myOffice?' class="sel"':'')+'>'+
        '<td class="rank">'+s.rank+'</td>'+
        '<td class="name">'+esc(s.office)+'</td>'+
        '<td class="r">'+s.n+'</td>'+
        '<td class="c">'+s.med.toFixed(2)+'&times;</td>'+
        moveCell(s)+
        METRICS.map(function(m){ return distCell(s, m); }).join('')+'</tr>';
    }).join('') + unscored.map(function(o){
      return '<tr'+(o===officeFilter?' class="sel"':'')+'><td class="rank">&mdash;</td>'+
        '<td class="name">'+esc(o)+'</td><td class="r">0</td>'+
        '<td class="c" colspan="'+((prevGen?2:1)+METRICS.length)+'" style="color:var(--warn-ink)">no driver with '+
        MIN_MILES+'+ attributed miles &mdash; unmeasured, not clean</td></tr>';
    }).join('');
    el('ds-offwrap').innerHTML = (standings.length + unscored.length) > 1
      ? oh+ob+'</tbody></table>'
      : '<div style="padding:14px;font-size:12.5px;color:var(--ink-3)">No office standings '+
        'available.</div>';

    // ── Ranked table ──────────────────────────────────────────────────────
    // Worked example sits between the standings and the table it explains.
    renderExample(view);

    var rows = view;
    el('ds-title').textContent = 'Ranked drivers ('+rows.length+')';

    var head = '<table class="ds-t"><thead><tr>'+
      '<th class="r">#</th><th>Driver</th><th>Location</th>'+
      '<th class="r">Miles</th><th class="c">Score</th><th class="c">Trend</th>'+
      METRICS.map(function(m){
        // The weight belongs in the header. Without it the four columns look
        // equally important, and a driver reading their row cannot tell why a
        // red cornering cell moved their score less than a pale speeding one.
        return '<th class="c">'+esc(m.id)+
               '<span class="ds-wt">'+Math.round(m.w*100)+'%</span></th>';
      }).join('')+
      '<th class="c">In office</th></tr></thead><tbody>';
    var body = rows.map(function(d){
      return '<tr>'+
        '<td class="rank">'+d.rank+'</td>'+
        '<td class="name">'+nameCell(d)+
          (d.provisional && !tagIsNoise ? provTag('Only '+f0(d.miles)+' miles in this window \u2014 too little '+
            'driving to rank confidently') : '')+
        '</td>'+
        '<td>'+esc(d.office)+'</td>'+
        '<td class="r">'+f0(d.miles)+'</td>'+
        '<td class="c"><span class="ds-score">'+d.score+'</span></td>'+
        '<td class="c"><span class="ds-trend '+d.trend.key+'" title="'+esc(d.trend.title)+'">'+
          d.trend.label+'</span></td>'+
        METRICS.map(function(m){
          var f = fillFor(d.rawPct[m.id]);
          return '<td class="mcell" style="background:'+f.bg+';color:'+f.fg+'" title="'+
            esc(d.name)+' — '+esc(m.id)+': '+d.rate[m.id].toFixed(1)+' per 1,000 mi ('+
            (d.ev[m.id]||0)+' events over '+f0(d.miles)+' mi). Color is this raw rate against '+
            'the fleet; the score also allows for how few miles they have driven.">'+
            d.rate[m.id].toFixed(1)+'</td>';
        }).join('')+
        '<td class="c">'+d.officeRank+' of '+d.officeN+'</td></tr>';
    }).join('');
    renderRules();
    wireBudgetToggle();
    el('ds-tablewrap').innerHTML = rows.length
      ? head+body+'</tbody></table>'
      : '<div style="padding:16px;font-size:12.5px;color:var(--ink-3)">No driver in this '+
        'selection has '+MIN_MILES+'+ attributed miles in the window.</div>';

    // ── Unranked ──────────────────────────────────────────────────────────
    el('ds-unranked-title').textContent = 'Not enough miles to rank ('+unranked.length+')';
    el('ds-unranked').innerHTML = unranked.length
      ? '<table class="ds-t"><thead><tr><th>Driver</th><th>Location</th><th class="r">Miles</th>'+
        '<th class="r">Events</th></tr></thead><tbody>'+
        unranked.map(function(d){
          var n = METRICS.reduce(function(a,m){ return a+(d.ev[m.id]||0); }, 0);
          return '<tr><td class="name">'+nameCell(d)+'</td><td>'+esc(d.office)+'</td>'+
                 '<td class="r">'+f0(d.miles)+'</td><td class="r">'+n+'</td></tr>';
        }).join('')+'</tbody></table>'
      : '<div style="padding:16px;font-size:12.5px;color:var(--ink-3)">Everyone cleared '+
        MIN_MILES+' miles.</div>';

    renderFoot(companyN, goneCount);
  }

  // One driver, taken apart line by line. Shows the arithmetic on somebody real
  // rather than describing it, because "your score is a weighted percentile"
  // means nothing to a manager and "17 speeding events is better than 72% of
  // the company" means everything.
  function renderExample(view){
    if(!view.length){ el('ds-example').innerHTML=''; el('ds-extitle').textContent='Worked example'; return; }
    // The MEDIAN driver in the current view, not the best one. An example is
    // meant to be representative: the top driver's bar is almost entirely one
    // color, which demonstrates nothing about how the points come off. The
    // middle of the board shows all four bites at a readable size.
    var byScore = view.slice().sort(function(a,b){ return a.score-b.score; });
    var d = byScore[Math.floor(byScore.length/2)];
    el('ds-extitle').innerHTML = 'Worked example <span style="font-weight:400;color:var(--ink-3)">'+
      '&mdash; how '+esc(d.name)+'&rsquo;s score of '+d.score+' is built</span>';
    // note in the card itself that this is the middle of the board
    var lost = 0;
    var rows = METRICS.map(function(m){
      // One decimal, not a whole number. The points-off column is computed from the
      // exact percentile, so rounding this to 52 made the row impossible to check:
      // (100-52) x 0.55 = 26.4, while the column correctly showed 26.1 from 47.52.
      // A worked example whose arithmetic does not reconcile is worse than none.
      var pct = d.pct[m.id], better = (100-pct).toFixed(1), off = m.w*pct, n = d.ev[m.id]||0;
      lost += off;
      var f = fillFor(d.rawPct[m.id]);
      // A clean sheet is scored at the metric's floor, so "better than 100% of the
      // company" would be false -- they are TIED with everyone else at zero, not
      // ahead of them. Say what is actually true: nothing to deduct.
      var sentence, sits;
      if(n===0){
        sentence = 'No '+m.id.toLowerCase()+' events at all over '+f0(d.miles)+
                   ' miles, so there is nothing to deduct.';
        sits = 'clean &mdash; nothing off';
      } else {
        sentence = f0(n)+' '+m.id.toLowerCase()+' event'+(n===1?'':'s')+' over '+f0(d.miles)+
                   ' miles is '+d.rate[m.id].toFixed(1)+' per 1,000. Better than <b>'+
                   better+'%</b> of the company.';
        sits = 'better than '+better+'%';
      }
      return '<tr>'+
        '<td class="name">'+esc(m.id)+'</td>'+
        '<td class="r">'+f0(n)+'</td>'+
        '<td class="mcell" style="background:'+f.bg+';color:'+f.fg+'">'+d.rate[m.id].toFixed(1)+'</td>'+
        '<td class="c">'+sits+'</td>'+
        '<td class="c">'+Math.round(m.w*100)+'%</td>'+
        '<td class="r"><b>'+off.toFixed(1)+'</b></td>'+
        '<td class="say">'+sentence+'</td></tr>';
    }).join('');
    var trendSay;
    if(d.trend.key==='new'){
      trendSay = '<b>Trend &mdash; nothing yet.</b> A trend needs '+TREND_MIN_MILES+
        '+ miles in the previous '+effDays+' days to compare against, and '+esc(d.name.split(' ')[0])+
        ' does not have that much history yet. It fills in on its own.';
    } else if(d.trend.key==='steady'){
      trendSay = '<b>Trend &mdash; steady.</b> Their position against the rest of the company has '+
        'not moved by more than normal week-to-week variation would produce at this mileage.';
    } else {
      trendSay = '<b>Trend &mdash; '+(d.trend.key==='worse'?'moving the wrong way':'improving')+
        '.</b> Their position against the company shifted by '+esc(d.trend.label.replace(/[▲▼]/,'').trim())+
        ', which is larger than chance would produce at '+f0(d.miles)+' miles. This compares their '+
        'position, not their raw count, so a fleet-wide change does not show up here as a personal one.';
    }
    el('ds-example').innerHTML =
      '<div class="ds-ex">'+
      '<h4>'+esc(d.name)+' &middot; '+esc(d.office)+' &middot; '+f0(d.miles)+' miles'+
        (d.provisional && !tagIsNoise ?provTag(''):'')+'</h4>'+
      '<p class="lede">This is the driver sitting in the middle of whatever is on screen, so the '+
        'arithmetic is visible at a normal size rather than a near-perfect one. Each of the four '+
        'metrics is turned into a position against all '+
        f0(BENCHMARK.drivers)+' drivers in the company. That position is multiplied by the '+
        'metric&rsquo;s weight, and the total is subtracted from 100.</p>'+
      '<div style="overflow-x:auto"><table class="ds-t"><thead><tr>'+
      '<th>Metric</th><th class="r">Events</th><th class="c">Per 1,000 mi</th>'+
      '<th class="c">Where that sits</th><th class="c">Weight</th><th class="r">Points off</th>'+
      '<th>In plain terms</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
      budgetBar(d, d.lost)+
      // Each term is rounded for display, so the printed total has to be the sum of
      // the ROUNDED terms or the arithmetic on screen does not add up -- which is
      // exactly the kind of thing a manager checks in front of a driver. The score
      // is then shown to one decimal as well, so every step of the line is true.
      (function(){
        // Largest-remainder rounding: floor every term to a tenth, then hand the
        // leftover tenths to the largest remainders. The printed terms then sum to
        // d.lost exactly, so the addition on screen is true rather than approximately
        // true, and 100 - d.lost is the score in the table.
        var exact  = METRICS.map(function(m){ return m.w*d.pct[m.id]; });
        var tenths = exact.map(function(x){ return Math.floor(x*10); });
        var left   = Math.round(d.lost*10) - tenths.reduce(function(a,b){ return a+b; },0);
        exact.map(function(x,i){ return {i:i, r:x*10-Math.floor(x*10)}; })
             .sort(function(a,b){ return b.r-a.r; })
             .slice(0, Math.max(0,left))
             .forEach(function(o){ tenths[o.i]++; });
        var terms = tenths.map(function(t){ return t/10; });
        var shown = d.lost;
        var kept  = Math.round((100-shown)*10)/10;
        return '<div class="sum">'+
          terms.map(function(t){ return t.toFixed(1); }).join(' &nbsp;+&nbsp; ')+
          ' &nbsp;=&nbsp; <b>'+shown.toFixed(1)+'</b> points off &nbsp;&rarr;&nbsp; 100 &minus; '+
          shown.toFixed(1)+' = '+kept.toFixed(1)+', shown as <b>'+d.score+'</b>'+
          '<span style="color:var(--ink-3)"> &middot; '+f0(d.rank)+
          (d.rank===1?'st':d.rank===2?'nd':d.rank===3?'rd':'th')+' of '+f0(BENCHMARK.drivers)+
          ' company-wide, '+d.officeRank+ordSuffix(d.officeRank)+' of the '+d.officeN+
          ' '+esc(d.office)+' drivers in this view</span>'+
        '</div>';
      })()+
      '<p class="foot2">'+trendSay+'</p>'+
      '<p class="foot2"><b>Why the numbers in the table are not exactly what is scored.</b> Before '+
        'ranking, a new driver&rsquo;s rate is nudged toward the fleet average by about '+
        f0(SHRINK_K*1000)+' miles worth, so a few hundred miles is not read as proof. That fades '+
        'as the miles build. At '+f0(d.miles)+' miles '+esc(d.name.split(' ')[0])+'&rsquo;s score is '+
        f0(100*d.miles/(d.miles+SHRINK_K*1000))+'% their own driving'+
        (d.miles>=1500?' &mdash; effectively all of it':'')+
        '. The colors show the raw rate; the percentage beside it is after that nudge.</p>'+
      '<p class="foot2">This example follows whatever is on screen &mdash; pick a different office '+
        'or time range and it re-works itself for the middle driver there.</p>'+
      '</div>';
  }

  // 100 points, one bite per metric, capped at that metric's weight. Whatever
  // survives on the right IS the score, at the same scale — so the bar can be
  // read without doing any arithmetic.
  function budgetBar(d, lost){
    var segs = METRICS.map(function(m){
      return {id:m.id, off:m.w*d.pct[m.id], cap:m.w*100};
    }).filter(function(x){ return x.off > 0.05; });
    var kept = Math.max(0, 100-lost);
    var bites = segs.map(function(x){
      var label = x.off >= 9 ? esc(x.id)+' &minus;'+x.off.toFixed(1)
                : x.off >= 4.5 ? '&minus;'+x.off.toFixed(1) : '';
      return '<i class="off" style="width:'+x.off+'%" title="'+esc(x.id)+' took '+x.off.toFixed(1)+
        ' of the '+x.cap+' it could ever take, because this driver sits '+
        Math.round(d.pct[x.id])+'% of the way up the company on it">'+label+'</i>';
    }).join('');
    return '<div class="ds-budget-wrap" id="ds-budgetwrap" style="display:none">'+
      '<div class="ds-budget">'+bites+
      '<i class="keep" style="width:'+kept+'%" title="What is left after every metric has taken '+
      'its share. This is the score.">'+(kept>=12 ? 'SCORE '+d.score : d.score)+'</i>'+
      '<span class="ds-tick" style="left:50%" title="A driver sitting exactly at the company '+
      'median on all four metrics keeps 50"></span></div>'+
      '<div class="ds-budget-key"><span>0</span>'+
      '<span>&#9650; a driver at the company median on everything keeps 50</span>'+
      '<span>100</span></div></div>'+
      '<div style="margin:2px 0 10px"><button type="button" id="ds-bartoggle" '+
        'class="ds-minibtn">Show the score bar</button></div>'+
      // Was a static paragraph with only the name swapped in. It asserted the driver
      // was mid-pack on speeding and near the top on everything else, which is false
      // for most people it was shown for -- and it said "he" about every driver on the
      // board. Both halves are now derived from this driver's own numbers, and nothing
      // here assumes a pronoun.
      (function(){
        var first = esc(d.name.split(' ')[0]);
        var budget = METRICS.map(function(m){
          return {id:m.id, cap:Math.round(m.w*100), off:m.w*d.pct[m.id], pct:d.pct[m.id]};
        });
        var widest = budget.slice().sort(function(a,b){ return b.off-a.off; })[0];
        var worst  = budget.slice().sort(function(a,b){ return b.pct-a.pct; })[0];
        var lowest = budget.slice().sort(function(a,b){ return a.pct-b.pct; })[0];
        function nm(x){ return x.id.toLowerCase(); }
        function betterThan(x){ return (100-x.pct).toFixed(1); }
        var caps = METRICS.map(function(m){
          return m.id.toLowerCase()+' '+Math.round(m.w*100);
        }).join(', ');
        var body;
        if(widest.id === worst.id){
          body = 'For '+first+' the widest bar and the worst habit are the same one: '+
            nm(worst)+', worse than '+Math.round(worst.pct)+'% of the company, taking '+
            worst.off.toFixed(1)+' of the '+worst.cap+' it can.';
        } else {
          body = 'The widest bar is not always the worst habit. '+first+'&rsquo;s widest is '+
            nm(widest)+' at '+widest.off.toFixed(1)+' of '+widest.cap+' &mdash; but that is a big '+
            'budget and a middling position (better than '+betterThan(widest)+'% of the company). '+
            'The worst habit is '+nm(worst)+', worse than '+Math.round(worst.pct)+
            '% of the company and already '+Math.round(100*worst.off/worst.cap)+'% of the way '+
            'through its smaller '+worst.cap+'-point budget.';
        }
        return '<p class="foot2" style="margin-top:9px"><b>Each metric can only ever take its '+
          'own weight.</b> The most each can take is '+caps+' &mdash; 100 between them. How much '+
          'of that a metric actually takes is how far up the company this driver sits on it. '+
          body+' The lightest touch here is '+nm(lowest)+
          (lowest.pct<=0 ? ', where the record is clean and nothing comes off'
                         : ', better than '+betterThan(lowest)+'% of the company')+
          '. <b>A metric that is already full cannot take more</b>, however much '+
          'worse it gets &mdash; which is why the score can say &ldquo;worst&rdquo; but never '+
          '&ldquo;catastrophic&rdquo;.</p>';
      })();
  }

  // Parse the yyyy-mm-dd parts directly. new Date('2026-09-04') is UTC midnight,
  // which in any negative-offset timezone reads back as September 3rd.
  var MONTHS = ['January','February','March','April','May','June','July','August',
                'September','October','November','December'];
  function prettyDate(iso){
    var p = String(iso).slice(0,10).split('-');
    if(p.length !== 3) return String(iso).slice(0,10);
    var d = +p[2], m = +p[1] - 1;
    if(!(m >= 0 && m < 12) || !d) return String(iso).slice(0,10);
    var t = (d % 100 >= 11 && d % 100 <= 13) ? 'th'
          : ({1:'st', 2:'nd', 3:'rd'}[d % 10] || 'th');
    return MONTHS[m]+' '+d+t;
  }

  function kpi(label, value, sub){
    return '<div class="ds-kpi"><div class="ds-kpi-label">'+esc(label)+'</div>'+
      '<div class="ds-kpi-value">'+value+'</div><div class="ds-kpi-sub">'+sub+'</div></div>';
  }

  function renderFoot(companyN, goneCount){
    var legend = '';
    var w = METRICS.map(function(m){ return esc(m.id)+' '+Math.round(m.w*100)+'%'; }).join(' &middot; ');
    var crossed = DATA && DATA.from.getTime() < RULE_CHANGE;
    el('ds-foot').innerHTML = legend +
      (crossed
        ? '<p style="color:var(--warn-ink)"><b>This window crosses the rule changes.</b> '+
          'The speeding rule changed on 10 Aug and all three harsh rules on 11 Aug, so event '+
          'counts before and after are not the same measurement. Ranking survives it better '+
          'than raw counts do &mdash; everyone is affected together &mdash; but treat the '+
          'per-1,000-mile numbers as mixed until 10 Sep.</p>'
        : '') +
      '<p><b>Score</b> is 0&ndash;100, higher is better. Each metric becomes a percentile '+
      'against every ranked driver in the company, then they are weighted ('+w+') and '+
      'subtracted from 100. Percentiles rather than raw rates, because cornering fires far '+
      'more often than speeding and would otherwise decide the score by itself.</p>'+
      '<p><b>There is no Priority flag on this page.</b> There was one &mdash; anything over '+
      '2.5&times; the median driver&rsquo;s event rate &mdash; and it was removed because the '+
      'threshold was arbitrary and it disagreed with the score in ways nobody could defend: a '+
      'driver setting off a speeding event every 8 miles was flagged Priority while scoring 60, '+
      'because percentile scoring caps what any single metric can cost. Until there is a defensible '+
      'way to draw that line, the table is simply sorted worst-last and the judgement is yours.</p>'+
      '<p><b>A clean sheet costs nothing.</b> Zero events on a metric is the best possible '+
      'outcome and is scored as such, whatever the mileage &mdash; there is no behavior a driver '+
      'could change to do better, so there is nothing to deduct. Those cells read as the best band '+
      'and take 0.0 points.</p>'+
      '<p><b>New drivers are nudged toward the fleet average, and it fades fast.</b> Before '+
      'ranking, a rate is blended with the typical driver&rsquo;s by about '+f0(SHRINK_K*1000)+
      ' miles worth, so a few hundred miles is not read as proof. A driver at 500 miles is about '+
      'a third fleet average; by 1,500 miles they are '+
      f0(100*1500/(1500+SHRINK_K*1000))+'% their own numbers, and past 2,500 it is negligible. '+
      'It used to be four times this strong, which pulled everyone toward the middle hard enough '+
      'to <i>penalise</i> genuinely good drivers on short mileage &mdash; two speeding events in '+
      '300 miles is well under the fleet median, and it was being scored like a serious problem. '+
      (tagIsNoise
        ? 'Most drivers in this window are under '+PROVISIONAL_MILES+' miles, where there is '+
          'least to go on, so no row is singled out.'
        : 'Rows marked'+provTag('')+' are under '+PROVISIONAL_MILES+' miles, where there is '+
          'least to go on.')+
      ' Under '+MIN_MILES+' miles nobody is scored at all.</p>'+

      '<p><b>Trend compares position, not raw rate.</b> Between the last two 30-day windows the '+
      'fleet median moved 27% on its own &mdash; rule changes, route mix, new vehicles &mdash; '+
      'and trending raw rates charged that to individuals, four &ldquo;worse&rdquo; for every one '+
      '&ldquo;better&rdquo;. Comparing each driver\'s multiple of the fleet instead comes out '+
      'near even. An arrow only appears when the move is larger than Poisson noise at that '+
      'driver\'s mileage; below that it says steady, and with no comparable previous period it '+
      'says nothing at all.</p>'+
      '<p><b>The movement is shown in multiples, not per cent.</b> A driver who was at 0.15&times; '+
      'and is now at 0.36&times; has more than doubled in percentage terms while remaining one of '+
      'the safest people in the company &mdash; per cent off a small base is arithmetically large '+
      'and practically meaningless. A trend needs <b>'+TREND_MIN_MILES+'+ miles in the previous '+
      'period</b>, twice the ranking floor, because a comparison needs more evidence than a single '+
      'measurement. And an upward move on someone still below the fleet median is shown in grey, '+
      'not red &mdash; they are not a concern whichever way they drifted.</p>'+
      '<p><b>Offices are ranked on their MEDIAN driver</b>, not their total, so one bad week '+
      'from one person cannot drag a branch down the table and a large branch is not penalised '+
      'for having more people. It is the same unit as the driver column &mdash; 1.30&times; means '+
      'the typical driver there sets things off 30% more often than the typical driver company-wide. '+
      'Offices with nobody over '+MIN_MILES+' miles are listed without a rank rather than left out: '+
      'an empty branch is unmeasured, not clean, and the fix is assigning drivers to vehicles.</p>'+
      '<p><b>Rank is coarser than it looks.</b> Measured on this fleet, a driver\'s rank moves '+
      'a median of 17 places between one half of a week and the other. Two drivers within '+
      'about 20 places of each other are not distinguishable &mdash; act on the <b>tier</b>, '+
      'and treat the number beside it as rough position. A 30-day window is roughly four times '+
      'steadier than a 7-day one.</p>'+
      '<p><b>Every login scores against the same company yardstick.</b> Scores and ranks are '+
      'measured against a stored snapshot of the whole company &mdash; '+
      f0(BENCHMARK.drivers)+' drivers as of '+esc(String(BENCHMARK.generated).slice(0,10))+' &mdash; '+
      'not against whoever the login happens to see. A branch manager and an all-branch login read '+
      'the identical number for the same driver, which is the point: the two of them look at it '+
      'together. Left to rank only its own people a branch centers itself on 50 whatever its real '+
      'standing &mdash; measured before this was fixed, Chicago&rsquo;s own view put its median '+
      'driver at 52 where the company view said 19. <b>Cell colors read against the company too.</b> '+
      'A branch whose drivers are genuinely the best in Mira shows a wall of blue, and the same '+
      'number is the same color on every screen &mdash; 13.1 braking events per 1,000 miles sits '+
      'at the 81st percentile company-wide whoever is looking at it.</p>'+
      '<p><b>Drivers archived in Geotab are excluded entirely</b>'+
      (goneCount ? ' &mdash; '+goneCount+' in this window' : '')+'. Geotab returns archived users '+
      'from the same call as everyone else and their trips keep their driver id, so without this '+
      'an ex-employee stays ranked for a month after leaving. Everything on this page &mdash; the '+
      'ranking, the fleet median, the office standings &mdash; is built from current employees '+
      'only. Removing them costs almost nothing in accuracy: the drivers who remain move a median '+
      'of one rank place, and no office median moves by more than 0.05&times;.</p>'+
      '<p><b>Only attributed driving counts.</b> A vehicle with no assigned driver contributes '+
      'nothing here'+(DATA && DATA.unattributed > 1
        ? ' &mdash; '+f0(DATA.unattributed)+' miles in this window belong to nobody'
        : '')+'. Fleet Health lists those vehicles. Camera-based rules are deliberately '+
      'excluded: fitment runs from 0% to 79% by location, so including them would rank people '+
      'by whether they were given a camera.</p>';
  }

  // ── Controls ─────────────────────────────────────────────────────────────
  function syncOfficePicker(names){
    var sel = el('ds-office');
    var want = [''].concat(names);
    var have = Array.prototype.slice.call(sel.options).map(function(o){ return o.value; });
    if(have.length !== want.length || have.some(function(v,i){ return v !== want[i]; })){
      sel.innerHTML = '<option value="">All offices</option>' +
        names.map(function(n){ return '<option value="'+esc(n)+'">'+esc(n)+'</option>'; }).join('');
    }
    sel.value = officeFilter;
    sel.parentNode.className = 'ds-officepick' + (officeFilter ? ' on' : '');
  }

  function buildChrome(){
    el('ds-periods').innerHTML = PERIODS.map(function(p){
      return '<button type="button" data-d="'+p+'" aria-pressed="'+(p===days)+'">'+p+'d</button>';
    }).join('');
    el('ds-periods').addEventListener('click', function(e){
      var b = e.target.closest ? e.target.closest('button') : null;
      if(!b || !apiRef) return;
      var d = +b.getAttribute('data-d');
      if(d === days) return;
      days = d;
      Array.prototype.forEach.call(el('ds-periods').children, function(x){
        x.setAttribute('aria-pressed', String(+x.getAttribute('data-d') === days));
      });
      load(apiRef);
    });
    el('ds-office').addEventListener('change', function(e){
      officeFilter = e.target.value || '';
      render();                      // pure re-render, no API call
    });
    el('ds-toggle').addEventListener('click', function(){
      var w = el('ds-unranked'), on = w.classList.toggle('on');
      el('ds-toggle').className = on ? 'on' : '';
      el('ds-toggle').textContent = on ? 'Hide' : 'Show';
    });
    el('ds-offtoggle').addEventListener('click', function(){
      var w = el('ds-offwrap'), hide = w.style.display !== 'none';
      w.style.display = hide ? 'none' : '';
      el('ds-offtoggle').className = hide ? '' : 'on';
      el('ds-offtoggle').textContent = hide ? 'Show' : 'Hide';
    });
    el('ds-extoggle').addEventListener('click', function(){
      var w = el('ds-example'), hide = w.style.display !== 'none';
      w.style.display = hide ? 'none' : '';
      el('ds-extoggle').className = hide ? '' : 'on';
      el('ds-extoggle').textContent = hide ? 'Show' : 'Hide';
    });
    el('ds-rulestoggle').addEventListener('click', function(){
      var w = el('ds-rules'), hide = w.style.display !== 'none';
      w.style.display = hide ? 'none' : '';
      el('ds-rulestoggle').className = hide ? '' : 'on';
      el('ds-rulestoggle').textContent = hide ? 'Show' : 'Hide';
    });
    el('ds-csv').addEventListener('click', exportCsv);
  }

  // The driver's own record in MyGeotab. URL confirmed from a real MyGeotab URL:
  // #user,currentTab:user,id:<id>. New tab -- this is a ranked list someone works
  // down, and replacing it to look at one person loses their place.
  function userUrl(id){
    return id ? location.origin + location.pathname + '#user,currentTab:user,id:' + id : null;
  }
  function nameCell(d){
    var u = userUrl(d.id);
    return u ? '<a class="ds-link" href="'+esc(u)+'" target="_blank" rel="noopener" '+
               'title="Open this driver in a new tab">'+esc(d.name)+'</a>'
             : esc(d.name);
  }

  // What each metric actually counts. Read off the rule definitions in Geotab,
  // not from memory: Speeding is RulePostedSpeedingId, the other three are the
  // "(New)" GPS-based rules. The legacy accelerometer versions were left behind
  // because they were miscalibrated and biased by vehicle model -- a Maverick and
  // an F-150 braking identically did not score identically.
  var RULEDOC = [
    {id:'Speeding', geotab:'Speeding',
     fires:'More than <b>10 mph over the posted limit</b>, held for <b>8 seconds</b>',
     plain:'A brief drift over does not count. You have to hold it &mdash; eight seconds at 10 over '+
           'is roughly a tenth of a mile. This is the one metric that depends on a map: Geotab has to '+
           'know the limit for that road, and for roughly a tenth of driving it does not, so nothing '+
           'can fire there.'},
    {id:'Braking', geotab:'Harsh Braking (New)',
     fires:'Deceleration harder than <b>0.4&nbsp;g</b>',
     plain:'A firm stop that throws loose items off the seat. Normal braking sits well under this; '+
           '0.4&nbsp;g is the sort of stop you make when someone pulls out. Measured from GPS rather '+
           'than the accelerometer, so it does not change with how the device is mounted.'},
    {id:'Cornering', geotab:'Harsh Cornering (New)',
     fires:'Lateral force past a threshold of <b>0.5</b>',
     plain:'Taking a turn fast enough to push you sideways in the seat. Measured from GPS, on the '+
           'sideways axis, so it does not depend on how the device is mounted. The rule carries '+
           'several variants internally and Geotab does not document what separates them, so treat '+
           '0.5 as the number and the exact trigger as Geotab&rsquo;s.'},
    {id:'Acceleration', geotab:'Harsh Acceleration (New)',
     fires:'Acceleration harder than <b>0.4&nbsp;g</b>',
     plain:'Pulling away hard enough to press you back into the seat. The mirror image of the braking '+
           'threshold. Most drivers never trigger it, which is why a clean sheet here is common and '+
           'costs nothing.'}
  ];

  function renderRules(){
    var host = el('ds-rules');
    if(!host) return;
    // Stacked blocks, not a table. As a table the plain-English column was the
    // widest and got clipped behind a horizontal scrollbar -- the one column
    // anyone actually reads. These wrap instead, so nothing is cut off.
    host.innerHTML =
      '<div class="ds-rl-intro">Four rules, each counted as <b>events per 1,000 miles</b> so a long '+
      'route and a short one compare fairly. The weight is how much of the 100-point score that '+
      'metric can take.</div>'+
      RULEDOC.map(function(r){
        var m = null;
        for(var i=0;i<METRICS.length;i++){ if(METRICS[i].id===r.id) m=METRICS[i]; }
        return '<div class="ds-rl">'+
          '<div class="ds-rl-head">'+
            '<span class="ds-rl-name">'+esc(r.id)+'</span>'+
            '<span class="ds-rl-wt">'+(m?Math.round(m.w*100):'?')+'% of the score</span>'+
            '<span class="ds-rl-geo">'+esc(r.geotab)+'</span>'+
          '</div>'+
          '<div class="ds-rl-fires">'+r.fires+'</div>'+
          '<div class="ds-rl-plain">'+r.plain+'</div>'+
        '</div>';
      }).join('');
  }

  // The bar is off by default. It restates arithmetic the table already gives in
  // words, and the table is the part someone can check with a calculator.
  function wireBudgetToggle(){
    var b = el('ds-bartoggle'), w = el('ds-budgetwrap');
    if(!b || !w || b.dataset.wired) return;
    b.dataset.wired = '1';
    b.addEventListener('click', function(){
      var hide = w.style.display !== 'none';
      w.style.display = hide ? 'none' : '';
      b.textContent = hide ? 'Show the score bar' : 'Hide the score bar';
    });
  }

  function exportCsv(){
    if(!lastRanked.length) return;
    var head = ['Rank','Driver','Location','Miles','Score','Trend','Provisional','OfficeRank','OfficeSize']
      .concat(METRICS.map(function(m){ return m.id+' per 1000mi'; }))
      .concat(METRICS.map(function(m){ return m.id+' events'; }));
    var lines = [head.join(',')].concat(lastRanked.map(function(d){
      return [d.rank, '"'+String(d.name).replace(/"/g,'""')+'"', '"'+d.office+'"',
              Math.round(d.miles), d.score,
              d.trend.key, d.provisional?'yes':'no', d.officeRank, d.officeN]
        .concat(METRICS.map(function(m){ return d.rate[m.id].toFixed(2); }))
        .concat(METRICS.map(function(m){ return d.ev[m.id]||0; })).join(',');
    }));
    var blob = new Blob([lines.join('\n')], {type:'text/csv;charset=utf-8;'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'driver-scorecard'+(officeFilter ? '-'+officeFilter.toLowerCase().replace(/[^a-z0-9]+/g,'-') : '')+
                 '-'+days+'d.csv';
    document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(a.href);
  }

  // MyGeotab leaves the document title empty for add-ins, so every dashboard
  // shows the same bare "| MyGeotab" in the browser tab. Name it on focus and
  // put the original back on blur, so navigating away never strands a stale
  // name on a page this add-in no longer owns. Wrapped because the title is
  // the host's, not ours, and a throw here must not take the page down.
  var PAGE_TITLE = 'Driver Scorecard';
  var priorTitle = null;
  function setTabTitle(){
    try {
      if(priorTitle === null) priorTitle = document.title;
      document.title = PAGE_TITLE + ' | MyGeotab';
    } catch(e){}
  }
  function restoreTabTitle(){
    try {
      if(priorTitle !== null){ document.title = priorTitle; priorTitle = null; }
    } catch(e){}
  }

  return {
    initialize:function(api,state,cb){ injectStyles(); buildChrome(); cb(); },
    focus:function(api){ setTabTitle(); load(api); },
    blur:function(){ restoreTabTitle(); }
  };
};
</script>
</body>
</html>

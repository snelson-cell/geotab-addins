<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.49.1/dist/apexcharts.min.js"></script>
<style>
  #sv-wrap{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:16px;color:#1a2b45;}
  #sv-wrap h2{font-size:16px;font-weight:600;margin:0;}
  #sv-sub{font-size:12.5px;color:#8a97a8;margin:2px 0 6px;}
  #sv-warn{font-size:12.5px;color:#a03d28;background:#fbece8;border:1px solid #f0cfc7;
           border-radius:6px;padding:8px 10px;margin:6px 0;display:none;max-width:820px;}
  #sv-chart{max-width:840px;}
</style>
</head>
<body>
<div id="sv-wrap">
  <h2>Speeding rate distribution by office</h2>
  <div id="sv-sub">Loading… (fetching 30 days of events + distance)</div>
  <div id="sv-warn"></div>
  <div id="sv-chart"></div>
</div>

<script>
geotab.addin.speedingViolin = function () {
  'use strict';
  var chart = null;
  var DAYS = 30;
  var MIN_VEHICLES = 10;   // offices below this are omitted (not enough for a distribution)
  var MIN_MILES = 50;      // vehicles below this in 30d excluded (insufficient exposure)
  var EVENT_LIMIT = 50000, TRIP_LIMIT = 50000;

  // Fleet-wide speeding-rate tiers, events per 1,000 mi — fixed so "High" means
  // the same for every viewer regardless of data scope. Derived from the fleet
  // median / 80th percentile and rounded. These are calibrated to the rule
  // resolved below: change the rule, re-derive these (see README).
  var LO = 10, HI = 40;

  // Which Geotab rule counts as "speeding". Resolved at runtime instead of
  // hardcoded, because a rule that is deleted or swapped in MyGeotab takes its
  // exception events with it — the previous version queried a rule id that no
  // longer existed and silently charted every vehicle at 0.
  // Preferred ids first; falls back to matching the rule name.
  var RULE_IDS = ['RulePostedSpeedingId', 'RuleGpsSpeedingWindowId'];
  var RULE_NAME = /^speeding$/i;

  var LEAF = {b27AB:'Orlando',b27AC:'Tampa',b27AD:'ATL North',b27AE:'ATL South',b27AF:'Chicago',
              b27B0:'Indianapolis',b27B1:'N Indiana',b27B2:'Louisville',b27B3:'Detroit',
              b27B4:'Grand Rapids',b27B5:'Cincinnati',b27B6:'Cleveland',b27B7:'Columbus',
              b27B8:'American Fork'};

  // vals are {rate, veh, drv} records — sort/summarise on .rate
  function median(a){var s=a.map(function(r){return r.rate;}).sort(function(x,y){return x-y;});
    var m=s.length>>1;
    return s.length%2?s[m]:(s[m-1]+s[m])/2;}
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  function el(id){ return document.getElementById(id); }
  function warn(msg){
    var w = el('sv-warn');
    w.style.display = 'block';
    w.innerHTML = (w.innerHTML ? w.innerHTML + '<br>' : '') + msg;
  }
  function clearWarn(){ var w = el('sv-warn'); w.innerHTML=''; w.style.display='none'; }

  // Pick the speeding rule out of the database's rule list.
  function resolveRule(rules){
    var byId = {};
    (rules||[]).forEach(function(r){ if(r && r.id) byId[r.id] = r; });
    for(var i=0;i<RULE_IDS.length;i++){ if(byId[RULE_IDS[i]]) return byId[RULE_IDS[i]]; }
    var named = (rules||[]).filter(function(r){ return RULE_NAME.test(r && r.name || ''); });
    return named.length ? named[0] : null;
  }

  function renderViolin(node, byOffice){
    var offices = Object.keys(byOffice).sort(function(a,b){return median(byOffice[b])-median(byOffice[a]);});
    var n = offices.length;
    if(!n){ el('sv-sub').textContent='No office in your data scope has enough vehicles yet.'; return; }
    var JIT = 0.30;
    var H = 150 + n*170;
    var perUnit = (H-80)/(n+0.8);
    var labelDY = -(JIT*perUnit + 14);
    var buckets = {High:[], Moderate:[], Low:[]};
    offices.forEach(function(off, i){
      var vals = byOffice[off];
      var rates = vals.map(function(r){return r.rate;});
      var min=Math.min.apply(null,rates), max=Math.max.apply(null,rates);
      var bins=16, bw=((max-min)/bins)||1;
      var counts=new Array(bins).fill(0);
      rates.forEach(function(v){counts[Math.min(bins-1,Math.floor((v-min)/bw))]++;});
      var maxc=Math.max.apply(null,counts)||1;
      var yc = n - i;
      vals.forEach(function(r){
        var v = r.rate;
        var dens = counts[Math.min(bins-1,Math.floor((v-min)/bw))]/maxc;
        var jit = (Math.random()*2-1)*dens*JIT;
        var pt = {x:v, y:+(yc+jit).toFixed(3), office:off, veh:r.veh, drv:r.drv};
        (v>=HI ? buckets.High : (v>=LO ? buckets.Moderate : buckets.Low)).push(pt);
      });
    });
    // legend text derives from the tier constants so the two can't drift apart
    var series = [
      {name:'High (≥'+HI+')',              data:buckets.High},
      {name:'Moderate ('+LO+'–'+(HI-1)+')', data:buckets.Moderate},
      {name:'Low (<'+LO+')',               data:buckets.Low}
    ];
    var anns = [];
    offices.forEach(function(off,i){
      anns.push({y:n-i, borderColor:'transparent',
        label:{text:off+' (n='+byOffice[off].length+')', position:'left', textAnchor:'start',
          offsetX:6, offsetY:labelDY, borderColor:'transparent',
          style:{fontSize:'13px',fontWeight:700,color:'#1a2b45',background:'transparent'}}});
      if(i<n-1) anns.push({y:n-i-0.5, borderColor:'#eef1f5', strokeDashArray:0});
    });
    var summary = buckets.High.length+' High · '+buckets.Moderate.length+' Moderate · '+buckets.Low.length+' Low';
    var xanns = [
      {x:LO, borderColor:'#e6b23a', strokeDashArray:4,
       label:{text:'Moderate ≥'+LO, orientation:'horizontal', position:'top', offsetY:-2,
         style:{fontSize:'10px', color:'#9c7415', background:'#fdf6e3'}}},
      {x:HI, borderColor:'#d16a55', strokeDashArray:4,
       label:{text:'High ≥'+HI, orientation:'horizontal', position:'top', offsetY:-2,
         style:{fontSize:'10px', color:'#a03d28', background:'#fbece8'}}}
    ];
    if(chart){chart.destroy();}
    chart = new ApexCharts(node,{
      chart:{type:'scatter',height:H,toolbar:{show:false},fontFamily:'inherit'},
      subtitle:{text:summary, align:'left', offsetY:2, style:{fontSize:'12.5px',fontWeight:600,color:'#5a6b80'}},
      series:series, colors:['#c0392b','#f2994a','#27ae60'],
      markers:{size:5,strokeWidth:0}, fill:{opacity:0.78},
      xaxis:{title:{text:'Speeding events per 1,000 mi'},tickAmount:8,
             labels:{formatter:function(v){return Math.round(v);}}},
      yaxis:{min:0.3,max:n+0.7,labels:{show:false},axisTicks:{show:false},axisBorder:{show:false}},
      annotations:{yaxis:anns, xaxis:xanns},
      legend:{show:true, position:'top', horizontalAlign:'right', fontSize:'12px', markers:{radius:12}},
      grid:{borderColor:'#eef1f5', xaxis:{lines:{show:true}}, yaxis:{lines:{show:false}}, padding:{left:12}},
      // Office is already the row label, so the tooltip identifies the vehicle
      // and its current driver instead. The driver is Geotab's current
      // assignment, not who was behind the wheel for these events — labelled
      // "current driver" so it doesn't read as attribution.
      tooltip:{custom:function(o){var p=o.w.config.series[o.seriesIndex].data[o.dataPointIndex];
        return '<div style="padding:7px 10px;font-size:12px;line-height:1.45">'+
        '<b>'+esc(p.veh)+'</b><br>'+
        (p.drv ? '<span style="color:#5a6b80">current driver:</span> '+esc(p.drv)
               : '<span style="color:#9aa6b5">no driver assigned</span>')+'<br>'+
        (Math.round(p.x*10)/10)+' speeding / 1,000 mi<br>'+
        '<span style="color:#5a6b80">'+o.w.config.series[o.seriesIndex].name+' risk</span></div>';}}
    });
    chart.render();
  }

  function load(api){
    var sub = el('sv-sub');
    clearWarn();
    sub.textContent = 'Loading… (fetching '+DAYS+' days of events + distance)';
    var to = new Date();
    var from = new Date(to.getTime() - DAYS*24*3600*1000);
    var fromISO = from.toISOString(), toISO = to.toISOString();

    function fail(msg){ sub.textContent = msg; }

    api.multiCall([
      ['Get', {typeName:'Rule'}],
      ['Get', {typeName:'Device', resultsLimit:50000}],
      ['Get', {typeName:'Trip', resultsLimit:TRIP_LIMIT, search:{fromDate:fromISO, toDate:toISO}}],
      ['Get', {typeName:'DeviceStatusInfo'}],
      ['Get', {typeName:'User', search:{isDriver:true}}]
    ], function(res){
      var rules = res[0]||[], devices = res[1]||[], trips = res[2]||[],
          status = res[3]||[], users = res[4]||[];

      var rule = resolveRule(rules);
      if(!rule){
        fail('Could not find a speeding rule in this database. Looked for ids ['+
             RULE_IDS.join(', ')+'] and a rule named "Speeding".');
        return;
      }
      if(trips.length >= TRIP_LIMIT){
        warn('Trip results hit the '+TRIP_LIMIT.toLocaleString()+
             ' row limit — distances may be understated. Fetch in weekly chunks.');
      }

      api.call('Get', {typeName:'ExceptionEvent', resultsLimit:EVENT_LIMIT,
        search:{fromDate:fromISO, toDate:toISO, ruleSearch:{id:rule.id}}}, function(events){
        events = events||[];
        if(events.length >= EVENT_LIMIT){
          warn('Exception results hit the '+EVENT_LIMIT.toLocaleString()+
               ' row limit — rates may be understated.');
        }

        var office={}, spd={}, miles={}, vehName={};
        devices.forEach(function(d){
          vehName[d.id] = d.name || d.id;
          (d.groups||[]).forEach(function(g){ if(LEAF[g.id]) office[d.id]=LEAF[g.id]; });
        });

        // device -> current driver name. status.driver is either a {id:...}
        // object or the string sentinel 'UnknownDriverId' when nobody is
        // assigned, so only dicts count.
        var userName={};
        users.forEach(function(u){
          var full = ((u.firstName||'')+' '+(u.lastName||'')).trim();
          userName[u.id] = full || u.name || u.id;
        });
        var driver={};
        status.forEach(function(s){
          var did = s.device && s.device.id;
          var d = s.driver;
          if(did && d && typeof d === 'object' && d.id) driver[did] = userName[d.id] || '';
        });
        events.forEach(function(e){ var id=e.device&&e.device.id; if(id) spd[id]=(spd[id]||0)+1; });
        trips.forEach(function(t){ var id=t.device&&t.device.id;
          if(id) miles[id]=(miles[id]||0)+(t.distance||0)*0.621371; });

        var byOffice={}, scoped=0;
        Object.keys(office).forEach(function(id){
          var mi=miles[id]||0; if(mi<MIN_MILES) return;
          scoped++;
          var rate = Math.round((spd[id]||0)/(mi/1000)*10)/10;
          (byOffice[office[id]]=byOffice[office[id]]||[]).push(
            {rate:rate, veh:vehName[id]||id, drv:driver[id]||''});
        });

        // An all-zero chart is indistinguishable from a genuinely clean fleet,
        // so say so explicitly rather than rendering a flat line of dots at 0.
        if(scoped && !events.length){
          fail('The "'+rule.name+'" rule ('+rule.id+') returned no events in the last '+DAYS+
               ' days, so every rate would be 0. The rule may be disabled or renamed — ' +
               'check Rules in MyGeotab before trusting this chart.');
          return;
        }

        Object.keys(byOffice).forEach(function(o){ if(byOffice[o].length<MIN_VEHICLES) delete byOffice[o]; });
        var total = Object.keys(byOffice).reduce(function(s,o){return s+byOffice[o].length;},0);
        sub.textContent = total+' vehicles across '+Object.keys(byOffice).length+
          ' offices (≥'+MIN_VEHICLES+' vehicles) · previous '+DAYS+' days · in your data scope · rule: '+rule.name;
        renderViolin(el('sv-chart'), byOffice);
      }, function(err){ fail('Error loading speeding events: '+err); });
    }, function(err){ fail('Error loading data: '+err); });
  }

  return {
    initialize: function(api, state, cb){ cb(); },
    focus: function(api, state){ load(api); },
    blur: function(){}
  };
};
</script>
</body>
</html>

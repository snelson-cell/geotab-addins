<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.49.1/dist/apexcharts.min.js"></script>
</head>
<body>
<div id="sv-root">
  <div class="sv-topbar">
    <div>
      <h2 class="sv-h1">Speeding rate by vehicle</h2>
      <div class="sv-scope" id="sv-scope">Loading…</div>
    </div>
    <div class="sv-controls">
      <label class="sv-officepick">
        <span>Office</span>
        <select id="sv-office" aria-label="Filter to one office"><option value="">All offices</option></select>
      </label>
      <div class="sv-periods" id="sv-periods" role="group" aria-label="Time range"></div>
    </div>
  </div>

  <div class="sv-note" id="sv-stop"></div>
  <div class="sv-note" id="sv-warn"></div>

  <div class="sv-kpis" id="sv-kpis"></div>
  <div class="sv-action" id="sv-action"></div>

  <div class="sv-chartcard">
    <div class="sv-legend" id="sv-legend"></div>
    <div id="sv-chart"></div>
  </div>
  <div class="sv-foot" id="sv-foot"></div>

  <div class="sv-tablehead">
    <div class="sv-tabletitle">Every vehicle</div>
    <div class="sv-tools">
      <button type="button" id="sv-toggle">Show table</button>
      <button type="button" id="sv-csv">Export CSV</button>
    </div>
  </div>
  <div class="sv-tablewrap" id="sv-tablewrap"></div>
</div>

<script>
geotab.addin.speedingViolin = function () {
  'use strict';

  // MyGeotab does not apply a <style> block from this file's <head> — the add-in
  // HTML is injected into the host page and the head is dropped, which left the
  // whole dashboard unstyled while the chart (ApexCharts injects its own CSS
  // from JS) rendered fine. So the stylesheet ships as a string and is injected
  // the same way. Do not move this back into <head>.
  var STYLE_ID = 'sv-styles';
  var CSS = [
    "/* Light surface only, on purpose: this renders inside MyGeotab's light chrome",
    '   and has no independent theme context to respond to. */',
    '#sv-root{',
    '  --surface-1:#fcfcfb; --page:#f9f9f7;',
    '  --ink-1:#0b0b0b; --ink-2:#52514e; --ink-3:#898781;',
    '  --grid:#e1e0d9; --axis:#c3c2b7; --hairline:rgba(11,11,11,.10);',
    '  --good:#0ca30c; --warning:#fab219; --critical:#d03b3b;',
    '  --good-ink:#0a6b18; --warning-ink:#7a5300; --critical-ink:#9b2626;',
    '  --accent:#2a78d6;',
    '  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;',
    '  color:var(--ink-1); background:var(--page); padding:18px 20px 28px; width:100%;',
    '}',
    '#sv-root, #sv-root *{box-sizing:border-box;}',
    '.sv-h1{font-size:19px;font-weight:650;margin:0;letter-spacing:-.01em;}',
    '.sv-scope{font-size:12.5px;color:var(--ink-3);margin:3px 0 0;}',
    '.sv-topbar{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:12px;}',
    '.sv-controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px;}',
    '.sv-officepick{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-3);}',
    '.sv-officepick select{font:inherit;font-size:12.5px;font-weight:600;color:var(--ink-1);',
    '  background:var(--surface-1);border:1px solid var(--axis);border-radius:7px;padding:6px 9px;cursor:pointer;}',
    '.sv-officepick.on select{border-color:var(--accent);color:var(--accent);}',
    '.sv-periods{display:inline-flex;border:1px solid var(--axis);border-radius:7px;overflow:hidden;background:var(--surface-1);}',
    '.sv-periods button{border:0;background:transparent;color:var(--ink-2);font:inherit;font-size:12.5px;',
    '  font-weight:600;padding:6px 12px;cursor:pointer;border-right:1px solid var(--grid);}',
    '.sv-periods button:last-child{border-right:0;}',
    '.sv-periods button[aria-pressed="true"]{background:var(--accent);color:#fff;}',
    '',
    // While a new window is loading, the OLD window is still fully rendered and
    // only the small scope line says "Loading…". Someone who clicks 7d and
    // glances at the chart reads 30-day numbers as 7-day numbers. Fade the data
    // out so it plainly is not the answer yet, and block clicks on dots whose
    // drill-through would be about to change underneath them.
    '#sv-root.busy .sv-kpis, #sv-root.busy .sv-action, #sv-root.busy .sv-chartcard,',
    '#sv-root.busy .sv-foot, #sv-root.busy .sv-tablewrap{opacity:.3;pointer-events:none;',
    '  transition:opacity .12s ease;}',
    '',
    '.sv-note{font-size:12.5px;border-radius:7px;padding:9px 12px;margin:12px 0 0;display:none;',
    '  border:1px solid var(--hairline);background:var(--surface-1);color:var(--ink-2);}',
    '.sv-note.on{display:block;}',
    '.sv-note b{color:var(--ink-1);}',
    '.sv-note--warn{background:#fdf6e3;border-color:#efdca8;color:var(--warning-ink);}',
    '.sv-note--stop{background:#fbece8;border-color:#f0cfc7;color:var(--critical-ink);}',
    '',
    '/* Tier 1 --------------------------------------------------------------- */',
    // Flex, not grid auto-fit: auto-fit kept minting empty tracks on a wide
    // pane, so four cards sat squashed at the left with dead space beside them.
    // flex:1 1 200px wraps at any width and always fills the row.
    '.sv-kpis{display:flex;flex-wrap:wrap;gap:12px;margin:14px 0 0;}',
    '.sv-kpi{flex:1 1 200px;min-width:0;}',
    '.sv-kpi{background:var(--surface-1);border:1px solid var(--hairline);border-radius:9px;padding:13px 15px 14px;}',
    '.sv-kpi-label{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;',
    '  color:var(--ink-3);display:flex;align-items:center;gap:5px;}',
    '.sv-kpi-value{font-size:29px;font-weight:640;line-height:1.12;margin:7px 0 0;letter-spacing:-.02em;}',
    '.sv-kpi-value.sm{font-size:21px;}',
    '.sv-kpi-sub{font-size:12px;color:var(--ink-2);margin:4px 0 0;line-height:1.4;}',
    '.sv-kpi-sub .muted{color:var(--ink-3);}',
    '.sv-dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none;}',
    '.sv-action{font-size:12.5px;color:var(--ink-2);background:var(--surface-1);border:1px solid var(--hairline);',
    '  border-left:3px solid var(--accent);border-radius:7px;padding:9px 13px;margin:12px 0 0;}',
    '',
    '/* Tier 2 --------------------------------------------------------------- */',
    '.sv-chartcard{background:var(--surface-1);border:1px solid var(--hairline);border-radius:9px;',
    // overflow MUST stay visible. Setting overflow-x:auto here silently made
    // overflow-y compute to auto as well (CSS forbids visible on one axis
    // beside a non-visible other), turning the card into a scroll container.
    // ApexCharts renders its tooltip inside that box, so a tooltip near an edge
    // extended the scroll area, toggled a scrollbar, shifted the layout under
    // the cursor and dismissed itself — the tooltip "flashed and vanished", and
    // hovering felt jerky. The chart is sized to the container, so it fits.
    '  margin:14px 0 0;padding:14px 4px 6px;overflow:visible;}',
    '.sv-legend{display:flex;flex-wrap:wrap;gap:16px;padding:0 14px 4px;font-size:12px;color:var(--ink-2);}',
    '.sv-legend span{display:inline-flex;align-items:center;gap:6px;}',
    '.sv-swatch{width:11px;height:11px;border-radius:50%;flex:none;}',
    '.sv-swatch.hollow{background:transparent;border:2px solid var(--ink-2);}',
    '.sv-swatch.filled{background:var(--ink-2);opacity:.62;}',
    '.sv-swatch.med{border-radius:0;background:none;width:14px;height:14px;object-fit:contain;}',
    '.sv-swatch.zone{border-radius:3px;width:12px;height:12px;opacity:.5;}',
    '.sv-swatch.dash{border-radius:0;width:14px;height:0;border-top:2px dashed var(--accent);}',
    '.sv-sep{width:1px;height:14px;background:var(--grid);}',
    '#sv-chart{min-width:380px;}',
    '@media (max-width:700px){',
    '  #sv-root{padding:14px 12px 22px;}',
    '  .sv-kpi-value{font-size:25px;}',
    '  .sv-legend{gap:10px;font-size:11.5px;}',
    '  table.sv-t th, table.sv-t td{padding:7px 8px;white-space:normal;}',
    '}',
    '',
    '.sv-foot{font-size:12px;color:var(--ink-3);margin:10px 2px 0;line-height:1.55;}',
    '.sv-foot b{color:var(--ink-2);font-weight:600;}',
    '.sv-linkbtn{background:none;border:0;padding:0;font:inherit;color:var(--accent);cursor:pointer;text-decoration:underline;}',
    '',
    '/* Tier 3 --------------------------------------------------------------- */',
    '.sv-tablehead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:20px 0 0;}',
    '.sv-tabletitle{font-size:14px;font-weight:650;}',
    '.sv-tools{display:flex;gap:8px;}',
    '.sv-tools button{font:inherit;font-size:12.5px;font-weight:600;color:var(--ink-2);background:var(--surface-1);',
    '  border:1px solid var(--axis);border-radius:6px;padding:5px 11px;cursor:pointer;}',
    // No max-height and no overflow at all: the table sits below the chart and
    // you never need both at once, so it flows with the page. The old 420px
    // scroll box showed roughly eight rows and hid the rest behind a second
    // scrollbar. Leaving overflow visible also keeps the sticky header anchored
    // to the page scroll, so it follows you down all 100+ rows.
    '.sv-tablewrap{margin:9px 0 0;border:1px solid var(--hairline);border-radius:9px;',
    '  background:var(--surface-1);display:none;}',
    '.sv-tablewrap.on{display:block;}',
    'table.sv-t{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums;}',
    'table.sv-t th{position:sticky;top:0;background:var(--surface-1);text-align:left;font-size:10.5px;',
    '  letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:9px 12px;',
    '  border-bottom:1px solid var(--grid);white-space:nowrap;z-index:1;}',
    'table.sv-t td{padding:8px 12px;border-bottom:1px solid var(--grid);color:var(--ink-2);white-space:nowrap;}',
    'table.sv-t tr:last-child td{border-bottom:0;}',
    'table.sv-t tr.clickable{cursor:pointer;}',
    'table.sv-t tr.clickable:hover td{background:#f2f5fa;}',
    'table.sv-t td.veh{color:var(--ink-1);font-weight:600;}',
    'table.sv-t td.num{text-align:right;}',
    '.sv-tier{display:inline-flex;align-items:center;gap:6px;font-weight:600;}',
    '.sv-tier.high{color:var(--critical-ink);} .sv-tier.mod{color:var(--warning-ink);} .sv-tier.low{color:var(--good-ink);}'
  ].join('\n');
  function injectStyles(){
    if(document.getElementById(STYLE_ID)) return;
    var s = document.createElement('style');
    s.id = STYLE_ID;
    s.textContent = CSS;
    document.head.appendChild(s);
  }

  // ── Configuration ────────────────────────────────────────────────────────
  var PERIODS = [7, 30, 60, 90];
  var MIN_MILES = 50;        // below this in-window = too little exposure to rate
  var MIN_OFFICE_N = 3;      // below this an office can't show a distribution…
  var LOW_SAMPLE_N = 10;     // …and below this it's shown but flagged as thin
  var THIN_MILES = 250;      // rated, but on so little distance the rate is jumpy
  var EVENT_LIMIT = 50000, TRIP_LIMIT = 50000;

  // Geotab caps a Get at 25,000 rows NO MATTER what resultsLimit says — asking
  // for 50,000 still returns exactly 25,000, with no error and no flag. The old
  // guard tested `length >= TRIP_LIMIT` (50,000), so it could never fire, and
  // every window of 30 days or more was silently truncated. Because miles are
  // the DENOMINATOR of the rate, lost trips do not just shrink the sample: they
  // inflate every surviving vehicle's rate, and push low-mileage vehicles under
  // the MIN_MILES floor so they disappear from the chart altogether. Measured
  // on 2026-08-06, the 30-day view lost 3,660 trips, hid 53 vehicles (all of
  // N Indiana bar five, and all 23 ATL North vehicles), overstated 106 rates
  // and put 10 vehicles in the wrong tier. Fetch in windows instead and split
  // any window that comes back at the cap.
  var PAGE_CAP = 25000;

  // Band boundaries are POLICY, not a description of the data: they are fixed so
  // "Coaching review" means the same thing to every viewer regardless of scope, and
  // comparable month over month. They were derived from the fleet median / p80
  // on 2026-07-30. This database is young, so they WILL drift — checkDrift()
  // below recomputes the empirical median/p80 on every render and says so out
  // loud when the configured values stop discriminating. Update them here, and
  // in README.md, when that fires.
  var LO = 10, HI = 40;
  var TIERS_DERIVED_ON = '2026-07-30';

  // Band names describe the MEASUREMENT and the next step, never the driver.
  //
  // These replaced Safe / Watch / High risk on 2026-08-06. Two reasons, and the
  // second is the one that matters:
  //
  //  1. "High risk" characterises a person in a record that is discoverable.
  //     Naming the process instead ("coaching review") states what happens next
  //     — a fact about our workflow, not a conclusion about a technician.
  //     "Safe" was the same problem pointed the other way: a vehicle at 9
  //     events per 1,000 mi is still speeding regularly, it is just under the
  //     fleet's own line, and we should never appear to certify that as safe.
  //  2. There were four names for one band — zone "HIGH RISK", KPI "High risk",
  //     table "High", tooltip "High" — against an action banner that already
  //     said "flagged for coaching review". Now every surface reads from here.
  //
  // Numbered levels (Level 1/2/3) were considered and rejected: numbers carry no
  // inherent direction (a Level 1 trauma center is the best one, a Category 1
  // hurricane the weakest), so they force every viewer to learn a mapping.
  //
  // Renaming is not legal protection and must not be treated as such — discovery
  // gets these definitions too. What protects the company is that a flag here is
  // reliably followed by documented coaching.
  // ink is the accessible text color for each band (the fill colors in C are
  // too light to read against). Kept here so a name and its color can never
  // drift apart across the six places a band is written.
  var TIERS = {
    low:  {name:'Within target',   zone:'WITHIN TARGET',   ink:'#0a6b18'},
    mod:  {name:'Monitor',         zone:'MONITOR',         ink:'#7a5300'},
    high: {name:'Coaching review', zone:'COACHING REVIEW', ink:'#9b2626'}
  };

  // "at or above": tierOf() tests >= HI, and the old wording ("above 40") did
  // not match the code or the KPI card sitting directly above it.
  var ACTION = 'Vehicles at or above ' + HI + ' events per 1,000 mi are flagged '+
               'for coaching review.';

  // Which Geotab rule counts as "speeding". Resolved at runtime rather than
  // hardcoded: a rule deleted in MyGeotab takes its exception events with it and
  // Get returns [] rather than an error, which once rendered a plausible-looking
  // chart of all zeros. Preferred ids first, then a name match.
  var RULE_IDS = ['RulePostedSpeedingId', 'RuleGpsSpeedingWindowId'];
  var RULE_NAME = /^speeding$/i;

  var LEAF = {b27AB:'Orlando',b27AC:'Tampa',b27AD:'ATL North',b27AE:'ATL South',b27AF:'Chicago',
              b27B0:'Indianapolis',b27B1:'N Indiana',b27B2:'Louisville',b27B3:'Detroit',
              b27B4:'Grand Rapids',b27B5:'Cincinnati',b27B6:'Cleveland',b27B7:'Columbus',
              b27B8:'American Fork'};

  var KM_TO_MI = 0.621371;
  var C = {good:'#0ca30c', warning:'#fab219', critical:'#d03b3b',
           ink1:'#0b0b0b', ink2:'#52514e', ink3:'#898781',
           grid:'#e1e0d9', accent:'#2a78d6', surface:'#fcfcfb'};

  // Mira mark, cropped out of assets/mira-home-logo.png (the wordmark removed)
  // and inlined as a data URI: the add-in is served from GitHub Pages but runs
  // inside my.geotab.com, so a relative asset path would resolve against the
  // wrong origin. 825 bytes.
  var MARK = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAYAAACqaXHeAAADAElEQVR42u2bT0gUURzHZxUVKkWwf9ih//egdhCCCOnQIQ8dOhQRXexSkLeOZf+I8rCXKBIiypqJJImCMAorgmKjiArqEP0DM6Ky3ZkyzbLvT97UMMy4Orszz53fW/iIh1l/v/d5u2+ev98bLW1an0G+SL6B9+AuyIAWUKOV6KWbdhX+3npwDPSBtyJmsXkPaPgxDMYi4BNoB3VhB473zgB7QH9EOVpRCnAYAJtDDL5FzHSUucUiwCGjX7RTkxz8vphyilUA0ZkuIAHXHIkxn9gFELsmGPyWmHORIiAHGn0GXw8+chBAHPcR0C4hD2kCbPftEb9Xi9smGwHEJpeAdZJykCog4xKwl6OAGy4BJkcBWZeAXo4CHioBSoASoARMBwE5xgLyFPwFYwHvKPglxgL6KHgbYwEdFHwh+M1UQLOTwFWGAl7qplXhJLASjDITsNFbkTnJSMAVv4JkHXjGQMAbMC+oKtsIXiVYwAewtFBTYgG4nUAB2YKD/5eQkU/h4lZhrNwFUPN3t27alWGakzVUvAQXaNtYRgL6xQ53KzVYS9WldhbKJYJFgusSBdwHi0UeTl71WpyvIgqapRBws8kYim5wa3vGKLk0OAzuiObFqAfZXwFvPl/APXAUrG4yrFTYmW0WK2e5L4JPwYYpDNyuxRvOgD8Juw12g4ZCsz4LPEjwRug5mB0089XiAFLSt8KPQK3f7B9g9M9Qp3fwy8AQIwG0vq1xCzjLsCCSXdEzOB58rqTewHQoiekUfAfjouhBCt7FWECvJnZKXAW8puCDjAXkKPhP1R1WApQAJUAJUAJi55ZLQDdHASdcAg5xFLDN83wQKwEUc45LwExJh7WkCejyqUhluAigytNyHwHzJXwKpAjYP0FVui3pAq7pplUVLCBfgWvOJ1XA5bQRPPj/zwlblaIxkxgB38Xzv5Puz68yLDqfsDOGNSFSASPgHLWui+g805GdUxGW7McF/PDpsE6VX+AreCJK7K2BB5HCiWgA28Fp8Fic+hgpQd65vxUvJqe9nnm8AAAAAElFTkSuQmCC';

  var chart = null, days = 30, apiRef = null, stateRef = null, lastRows = [];
  // Everything load() fetched, held filter-independent so switching office is a
  // re-render and not a second round trip to the API.
  var DATA = null, officeFilter = '';
  // resizeObs must be held in a variable: an unreferenced ResizeObserver is
  // eligible for garbage collection and silently stops firing.
  var lastChart = null, lastWidth = 0, resizeTimer = null, resizeObs = null,
      resizePoll = null, onResize = null, pointerInChart = false;

  // ── Small helpers ────────────────────────────────────────────────────────
  function el(id){ return document.getElementById(id); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function asc(a){ return a.slice().sort(function(x,y){return x-y;}); }
  function quantile(sorted, p){
    if(!sorted.length) return 0;
    var i = (sorted.length-1)*p, lo = Math.floor(i), hi = Math.ceil(i);
    return lo===hi ? sorted[lo] : sorted[lo]+(sorted[hi]-sorted[lo])*(i-lo);
  }
  function median(sorted){ return quantile(sorted, 0.5); }
  function fmt(v){ return (Math.round(v*10)/10).toLocaleString(); }
  function ord(n){
    var t = n % 100;
    return n + (t>=11 && t<=13 ? 'th' : ({1:'st',2:'nd',3:'rd'}[n%10] || 'th'));
  }
  // Snap a derived threshold to a value a human would actually choose.
  var NICE = [1,2,3,5,8,10,15,20,25,30,40,50,75,100,150,200,250,400,500,750,1000];
  function niceNear(v){
    var best = NICE[0];
    for(var i=0;i<NICE.length;i++){ if(Math.abs(NICE[i]-v) < Math.abs(best-v)) best = NICE[i]; }
    return best;
  }
  function niceCeil(v){
    for(var i=0;i<NICE.length;i++){ if(NICE[i] >= v) return NICE[i]; }
    return Math.ceil(v/100)*100;
  }
  // Pick the axis maximum FROM a round tick step rather than rounding the max
  // and dividing — dividing is what produces ticks like 0/23/45/68/90. Returns
  // the smallest round step giving at most 8 intervals.
  var AXIS_STEPS = [1,2,5,10,20,25,50,100,200,250,500,1000];
  function axisScale(raw){
    for(var i=0;i<AXIS_STEPS.length;i++){
      var s = AXIS_STEPS[i], max = Math.ceil(raw/s)*s;
      if(max/s <= 8) return {max:max, ticks:max/s};
    }
    var s2 = Math.ceil(raw/8/1000)*1000;
    return {max:s2*8, ticks:8};
  }
  function tierOf(r){ return r>=HI ? 'high' : (r>=LO ? 'mod' : 'low'); }
  // Stable pseudo-random in [0,1) from a string — used for jitter so a dot keeps
  // its position across re-renders.
  function hash01(s){
    var h = 2166136261;
    s = String(s);
    for(var i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return ((h >>> 0) % 100000) / 100000;
  }

  function note(id, cls, html){
    var n = el(id);
    n.className = 'sv-note on' + (cls ? ' ' + cls : '');
    n.innerHTML = html;
  }
  function clearNotes(){
    ['sv-stop','sv-warn'].forEach(function(id){ var n=el(id); n.className='sv-note'; n.innerHTML=''; });
  }
  function fail(html){
    el('sv-kpis').innerHTML=''; el('sv-action').style.display='none';
    el('sv-legend').innerHTML=''; el('sv-foot').innerHTML='';
    if(chart){ chart.destroy(); chart=null; }
    el('sv-chart').innerHTML='';
    // Clear busy too, or a failed load leaves the whole page dimmed and the
    // error message reads as though it is still loading.
    el('sv-root').classList.remove('busy');
    el('sv-scope').textContent = '';
    note('sv-stop','sv-note--stop', html);
  }

  // ── Tier 1 ───────────────────────────────────────────────────────────────
  function kpi(label, dotColor, value, small, sub){
    return '<div class="sv-kpi"><div class="sv-kpi-label">'+
      (dotColor ? '<span class="sv-dot" style="background:'+dotColor+'"></span>' : '')+
      esc(label)+'</div><div class="sv-kpi-value'+(small?' sm':'')+'">'+value+'</div>'+
      '<div class="sv-kpi-sub">'+sub+'</div></div>';
  }

  // stats describes what is on screen; fleet always describes the whole fleet,
  // so a manager filtered to one office still sees the benchmark they are being
  // measured against rather than a card comparing their office to itself.
  function renderKpis(stats, fleet){
    var cards = [], one = officeFilter;

    // 1. Where you sit, against the policy target.
    var medTier = tierOf(stats.median);
    cards.push(kpi(one ? esc(one)+' median' : 'Fleet median',
      medTier==='high'?C.critical:medTier==='mod'?C.warning:C.good,
      fmt(stats.median),
      false,
      'events per 1,000 mi &middot; <span class="muted">target under '+LO+
      (one ? ' &middot; fleet '+fmt(fleet.median) : '')+'</span>'));

    // 2. The number that drives action.
    cards.push(kpi(TIERS.high.name, C.critical,
      String(stats.counts.high),
      false,
      'vehicles at or above '+HI+' &middot; <span class="muted">'+
      Math.round(stats.counts.high/Math.max(stats.n,1)*100)+'% of '+stats.n+'</span>'));

    // 3. Where to look first — or, filtered, the one thing a branch manager
    //    actually wants to know: am I the problem, or is someone else?
    if(one){
      var pos = fleet.offices.indexOf(one) + 1, tot = fleet.offices.length;
      cards.push(kpi('Rank among offices', null,
        pos ? ord(pos)+' of '+tot : '&mdash;', true,
        pos ? (pos===1 ? '<span class="muted">highest median in the fleet</span>'
                       : 'behind '+esc(fleet.offices[0])+' at '+fmt(fleet.worstMedian)+
                         ' &middot; <span class="muted">1st = highest rate</span>')
            : '<span class="muted">too few vehicles to rank</span>'));
    } else {
      var cmp = fleet.bestMedian > 0
        ? fmt(fleet.worstMedian/fleet.bestMedian)+'&times; '+esc(fleet.bestOffice)
        : esc(fleet.bestOffice)+' at '+fmt(fleet.bestMedian);
      cards.push(kpi('Worst office', null, esc(fleet.worstOffice), true,
        'median '+fmt(fleet.worstMedian)+' &middot; <span class="muted">vs '+cmp+'</span>'));
    }

    // 4. Direction of travel — suppressed rather than guessed when the previous
    //    window is too thin to compare, which is common in a young database.
    if(stats.trend && stats.trend.ok){
      var t = stats.trend, up = t.delta > 0;
      cards.push(kpi('vs prior '+days+'d', up?C.critical:C.good,
        (up?'&#9650; +':'&#9660; ')+Math.round(Math.abs(t.delta))+'%', false,
        (up?'worsening':'improving')+' &middot; <span class="muted">was '+fmt(t.prevMedian)+'</span>'));
    } else {
      cards.push(kpi('vs prior '+days+'d', null, '&mdash;', true,
        '<span class="muted">'+(stats.trend
          ? 'only '+stats.trend.have+' of these '+stats.trend.of+' vehicles were driving in the prior '+
            days+' days, so the two windows are not comparable'
          : 'not enough history in the previous window to compare')+'</span>'));
    }
    el('sv-kpis').innerHTML = cards.join('');
    el('sv-action').style.display = '';
    el('sv-action').textContent = ACTION;
  }

  // ── Tier 2 ───────────────────────────────────────────────────────────────
  // fleetMedian is passed separately from stats: stats describes what is on
  // screen, but the dashed benchmark line must stay the whole fleet's median
  // even when one office is filtered in — otherwise it collapses onto that
  // office's own median and stops being a comparison at all.
  function renderChart(byOffice, offices, stats, fleetMedian){
    var n = offices.length;
    // Lane height and the label gutter scale with the space actually available,
    // so the plot stays legible from a phone-width pane up to a wide monitor.
    // The width is passed to ApexCharts explicitly rather than left at its
    // default '100%': on re-render it kept re-using the width it first measured
    // (the CSS min-width), so the plot never grew when the pane did.
    var host = el('sv-chart');
    // Floor low enough that the chart effectively always fits its card: the
    // card can no longer scroll (see the overflow note in the stylesheet), so
    // anything wider than the container would spill instead.
    var avail = Math.max(380, host.clientWidth || host.parentNode.clientWidth || 900);
    lastWidth = host.parentNode.clientWidth;   // the width this render is for
    var narrow = avail < 620;
    var GUTTER = narrow ? 96 : avail < 820 ? 108 : 132;
    var LANE = avail < 560 ? 74 : avail < 820 ? 84 : 92;
    var JIT = 0.21;
    var H = n*LANE + 96;

    // Clamp the axis when a thin tail is stretching it — otherwise the bulk of
    // the fleet is squeezed into a sliver. Clamped vehicles are pinned at the
    // edge and always named in the footer, never silently dropped. Adaptive on
    // purpose: with a young database the shape of the distribution is moving.
    var clamp = stats.p95 > 0 && stats.max > stats.p95*1.6;
    var scale = axisScale(Math.max(clamp ? stats.p95*1.08 : stats.max*1.06, HI*1.5));
    var visMax = scale.max;
    var over = [];

    // Color is deliberately NOT tier here: tier is a pure function of x, so
    // painting it on the dots spends the only free channel restating the axis.
    // The zones carry tier (large regions + text labels, so it survives every
    // color-vision deficiency), and fill/hollow carries whether Geotab has a
    // driver attached — a data-quality gap that matters in a new deployment.
    var withDrv = [], noDrv = [], medPts = [];
    offices.forEach(function(off, i){
      var vals = byOffice[off];
      var rates = asc(vals.map(function(r){return r.rate;}));
      var min = rates[0], max = rates[rates.length-1];
      var bins = 14, bw = ((max-min)/bins)||1;
      var counts = new Array(bins).fill(0);
      rates.forEach(function(v){ counts[Math.min(bins-1,Math.floor((v-min)/bw))]++; });
      var maxc = Math.max.apply(null,counts)||1;
      var yc = n - i;
      vals.forEach(function(r){
        var v = r.rate;
        var dens = counts[Math.min(bins-1,Math.floor((v-min)/bw))]/maxc;
        // Jitter is seeded from the device id, not random: the chart re-renders
        // on every container resize, and random jitter would make every dot hop
        // to a new spot each time the pane changed width.
        var jit = (hash01(r.id)*2-1)*dens*JIT;
        var x = v, off_scale = false;
        if(x > visMax){ x = visMax; off_scale = true; over.push(r); }
        var pt = {x:x, y:+(yc+jit).toFixed(3), office:off, veh:r.veh, drv:r.drv,
                  rate:r.rate, miles:r.miles, id:r.id, off_scale:off_scale};
        (r.drv ? withDrv : noDrv).push(pt);
      });
      medPts.push({x: median(rates), y: yc, off: off});
    });

    var series = [
      {name:'Vehicle (driver assigned)', data:withDrv},
      {name:'Vehicle (no driver assigned)', data:noDrv}
    ];

    // Zones carry the risk read. The numeric boundaries live in the legend strip
    // above, where each status color is paired with its text (a status color
    // must never carry meaning by hue alone).
    //
    // A zone label is DROPPED when its band is too narrow to hold it, rather
    // than allowed to run into the next band. The within-target band is only
    // LO/visMax of the plot — a tenth of it at a 100 axis — so on a narrow pane
    // even the old three-letter "SAFE" overprinted "WATCH" and read as
    // "SAFEWATCH". The legend always carries the full names, so nothing is lost.
    var plotW = Math.max(120, avail - GUTTER - 18);
    function zone(x, x2, color, opacity, key){
      var t = TIERS[key];
      // ~0.62em average advance for bold uppercase at 10.5px, plus the 7px
      // inset and a little breathing room before the next band's label.
      var fits = ((x2 - x) / visMax) * plotW >= t.zone.length*6.6 + 16;
      return {x:x, x2:x2, fillColor:color, opacity:opacity, borderWidth:0,
        label:{text: fits ? t.zone : '', orientation:'horizontal', position:'top', offsetY:-6,
          textAnchor:'start', offsetX:7, borderWidth:0,
          style:{background:'transparent', color:t.ink, fontSize:'10.5px', fontWeight:700}}};
    }
    var zones = [
      zone(0, Math.min(LO,visMax), C.good, 0.07, 'low'),
      zone(Math.min(LO,visMax), Math.min(HI,visMax), C.warning, 0.11, 'mod'),
      zone(Math.min(HI,visMax), visMax, C.critical, 0.09, 'high')
    ];
    // The empirical benchmark, drawn on top of the policy zones. Left unlabelled
    // in-plot — near the low end it lands on the axis ticks — and named in the
    // legend instead.
    zones.push({x:fleetMedian, strokeDashArray:5, borderColor:C.accent, borderWidth:1.5});

    // Office labels live in a left gutter, outside the plot: as in-plot
    // annotations they collided with the marks and the tooltip.
    var anns = [], nameSize = narrow ? '12px' : '13px',
        statSize = narrow ? '10px' : '11px';
    offices.forEach(function(off, i){
      var y = n - i, thin = byOffice[off].length < LOW_SAMPLE_N;
      var med = fmt(median(asc(byOffice[off].map(function(r){return r.rate;}))));
      // The full "n=9  med 23.4 · thin" overruns a narrow gutter and runs into
      // the plot, so drop the "med" label — the number is unambiguous next to n.
      var stat = narrow ? ('n='+byOffice[off].length+' · '+med+(thin ? ' · thin' : ''))
                        : ('n='+byOffice[off].length+'  med '+med+(thin ? '  · thin' : ''));
      anns.push({y:y, borderColor:'transparent', label:{
        text:off, position:'left', textAnchor:'start', offsetX:-GUTTER, offsetY:-2,
        borderWidth:0, style:{background:'transparent', color:C.ink1,
        fontSize:nameSize, fontWeight:700}}});
      anns.push({y:y, borderColor:'transparent', label:{
        text:stat,
        position:'left', textAnchor:'start', offsetX:-GUTTER, offsetY:14,
        borderWidth:0, style:{background:'transparent', color: thin ? C.warning : C.ink3,
        fontSize:statSize, fontWeight:600}}});
      if(i < n-1) anns.push({y:y-0.5, borderColor:C.grid, strokeDashArray:0});
    });

    // Office median drawn as the Mira mark rather than a plain square. Sized a
    // little larger than the old 5.5px marker so the shape stays legible, and
    // offset by half its size so it centers on the value rather than hanging
    // off it.
    var MARK_PX = narrow ? 13 : 16;
    var points = medPts.map(function(m){
      return {x:m.x, y:m.y, marker:{size:0},
              image:{path:MARK, width:MARK_PX, height:MARK_PX,
                     offsetX:-MARK_PX/2, offsetY:-MARK_PX/2}};
    });

    if(chart){ chart.destroy(); }
    chart = new ApexCharts(el('sv-chart'), {
      chart:{type:'scatter', height:H, width:avail, toolbar:{show:false}, fontFamily:'inherit',
        animations:{enabled:false},
        events:{ dataPointSelection: function(e, ctx, cfg){
          var p = cfg.w.config.series[cfg.seriesIndex].data[cfg.dataPointIndex];
          if(p && p.id) goToTrips(p.id);
        }}},
      series:series,
      colors:[C.ink2, C.ink2],
      markers:{ size:6, strokeWidth:[0,2], strokeColors:[C.surface, C.ink2],
        fillOpacity:[0.62,0], hover:{sizeOffset:3} },
      xaxis:{ min:0, max:visMax, tickAmount:scale.ticks,
        title:{text:'Speeding events per 1,000 mi',
          style:{fontSize:'12px', fontWeight:600, color:C.ink2}},
        axisBorder:{color:C.axis}, axisTicks:{color:C.axis},
        labels:{ style:{colors:C.ink3, fontSize:'11.5px'},
          formatter:function(v){ return Math.round(v); } } },
      yaxis:{ min:0.35, max:n+0.65, labels:{show:false}, axisTicks:{show:false}, axisBorder:{show:false} },
      annotations:{ xaxis:zones, yaxis:anns, points:points },
      legend:{show:false},
      grid:{ borderColor:C.grid, xaxis:{lines:{show:true}}, yaxis:{lines:{show:false}},
        padding:{left:GUTTER, right:18, top:8} },
      tooltip:{ custom:function(o){
        var p = o.w.config.series[o.seriesIndex].data[o.dataPointIndex];
        var t = tierOf(p.rate), tName = TIERS[t].name, tCol = TIERS[t].ink;
        return '<div style="padding:8px 11px;font-size:12px;line-height:1.5">'+
          '<b>'+esc(p.veh)+'</b> &middot; '+esc(p.office)+'<br>'+
          (p.drv ? '<span style="color:#52514e">current driver:</span> '+esc(p.drv)
                 : '<span style="color:#898781">no driver assigned</span>')+'<br>'+
          '<b>'+fmt(p.rate)+'</b> per 1,000 mi <span style="color:#898781">over '+
          Math.round(p.miles).toLocaleString()+' mi</span><br>'+
          '<span style="color:'+tCol+';font-weight:600">'+tName+'</span>'+
          (p.off_scale ? '<br><span style="color:#9b2626">beyond axis — pinned at '+visMax+'</span>' : '')+
          '<br><span style="color:#898781;font-size:11px">click for today’s trips</span></div>';
      }}
    });
    chart.render();

    el('sv-legend').innerHTML =
      '<span><i class="sv-swatch zone" style="background:'+C.good+'"></i>'+
        TIERS.low.name+' &mdash; under '+LO+'</span>'+
      '<span><i class="sv-swatch zone" style="background:'+C.warning+'"></i>'+
        TIERS.mod.name+' &mdash; '+LO+' to '+(HI-1)+'</span>'+
      '<span><i class="sv-swatch zone" style="background:'+C.critical+'"></i>'+
        TIERS.high.name+' &mdash; '+HI+' and above</span>'+
      '<span class="sv-sep"></span>'+
      '<span><i class="sv-swatch filled"></i>Vehicle &mdash; driver assigned</span>'+
      '<span><i class="sv-swatch hollow"></i>Vehicle &mdash; no driver assigned</span>'+
      '<span><img class="sv-swatch med" src="'+MARK+'" alt="">Office median</span>'+
      '<span><i class="sv-swatch dash"></i>Fleet median '+fmt(fleetMedian)+'</span>';

    return {over:over, visMax:visMax, clamped:clamp};
  }

  // ── Tier 3 ───────────────────────────────────────────────────────────────
  // Drill through to today's trips for the vehicle, not to its edit page: the
  // question a dot raises is "what did it actually do?", and the trips view
  // answers that with the route, stops and events.
  //
  // BOTH `devices` and `selectedEntities` are required. The published URL guide
  // documents only selectedEntities, and with that alone the page loads empty —
  // world-wide mapBounds and `routes:()`. Diffing a hand-built link against one
  // MyGeotab writes itself, `devices:!(<id>)` is the sole missing *input*;
  // routes, mapBounds and expandedCardIds are all state the page derives after
  // it loads, so they don't need to be supplied.
  //
  // dateRange:{interval:'Today'} is correct as-is — MyGeotab expands it to
  // (label:Today,startDate:…,endDate:…) against the database's own timezone,
  // which is better than us computing a UTC offset.
  function goToTrips(id){
    if(stateRef && typeof stateRef.gotoPage === 'function'){
      try {
        stateRef.gotoPage('tripsHistory', {
          dateRange: {interval: 'Today'},
          entityType: 'Device',
          devices: [id],
          selectedEntities: [id]
        });
      } catch(e){}
    }
  }

  function renderTable(rows){
    var head = '<table class="sv-t"><thead><tr><th>Vehicle</th><th>Office</th><th>Driver</th>'+
      '<th style="text-align:right">Miles</th><th style="text-align:right">Rate</th>'+
      '<th>Status</th></tr></thead><tbody>';
    var body = rows.map(function(r){
      var t = tierOf(r.rate), tName = TIERS[t].name;
      var tCol = t==='high'?C.critical:t==='mod'?C.warning:C.good;
      return '<tr class="clickable" data-id="'+esc(r.id)+'">'+
        '<td class="veh">'+esc(r.veh)+'</td><td>'+esc(r.office)+'</td>'+
        '<td>'+(r.drv ? esc(r.drv) : '<span style="color:#898781">unassigned</span>')+'</td>'+
        '<td class="num">'+Math.round(r.miles).toLocaleString()+'</td>'+
        '<td class="num"><b>'+fmt(r.rate)+'</b></td>'+
        '<td><span class="sv-tier '+t+'"><span class="sv-dot" style="background:'+tCol+'"></span>'+
        tName+'</span></td></tr>';
    }).join('');
    var w = el('sv-tablewrap');
    w.innerHTML = head + body + '</tbody></table>';
    w.querySelectorAll('tr.clickable').forEach(function(tr){
      tr.addEventListener('click', function(){ goToTrips(tr.getAttribute('data-id')); });
    });
  }

  function exportCsv(){
    if(!lastRows.length) return;
    var lines = [['Vehicle','Office','Driver','Miles','Events per 1000 mi','Status','Window (days)'].join(',')];
    lastRows.forEach(function(r){
      lines.push([r.veh, r.office, r.drv||'unassigned', Math.round(r.miles), fmt(r.rate),
        TIERS[tierOf(r.rate)].name, days]
        .map(function(v){ return '"'+String(v).replace(/"/g,'""')+'"'; }).join(','));
    });
    try {
      var blob = new Blob([lines.join('\n')], {type:'text/csv;charset=utf-8;'});
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      // lastRows already honours the office filter, so name the file for it —
      // otherwise two exports sitting in Downloads are indistinguishable.
      a.download = 'speeding-rate-'+
        (officeFilter ? officeFilter.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'-' : '')+
        days+'d.csv';
      document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 0);
    } catch(e){
      note('sv-warn', null, 'Could not start the download in this browser. Use <b>Show table</b> and copy the rows.');
    }
  }

  // ── Threshold drift ──────────────────────────────────────────────────────
  // The whole point: thresholds may go stale, but they must not do it silently.
  function checkDrift(stats){
    var share = Math.max(stats.counts.high, stats.counts.mod, stats.counts.low) / Math.max(stats.n,1);
    var sLO = niceNear(stats.median), sHI = niceNear(stats.p80);
    if(sHI <= sLO) sHI = niceCeil(sLO*2);
    if(share < 0.85 || stats.n < 12) return null;
    return {lo:sLO, hi:sHI, share:share};
  }

  // ── Data ─────────────────────────────────────────────────────────────────
  function resolveRule(rules){
    var byId = {};
    (rules||[]).forEach(function(r){ if(r && r.id) byId[r.id] = r; });
    for(var i=0;i<RULE_IDS.length;i++){ if(byId[RULE_IDS[i]]) return byId[RULE_IDS[i]]; }
    var named = (rules||[]).filter(function(r){ return RULE_NAME.test(r && r.name || ''); });
    return named.length ? named[0] : null;
  }

  function milesByDevice(trips){
    var m = {};
    (trips||[]).forEach(function(t){
      var id = t.device && t.device.id;
      if(id) m[id] = (m[id]||0) + (t.distance||0)*KM_TO_MI;
    });
    return m;
  }
  function countByDevice(events){
    var c = {};
    (events||[]).forEach(function(e){
      var id = e.device && e.device.id;
      if(id) c[id] = (c[id]||0) + 1;
    });
    return c;
  }

  // Split a date range until every slice comes back under the server's row cap,
  // then concatenate. Recursive rather than a fixed chunk size because the right
  // size depends on how busy the fleet was, which varies by range and by office.
  function fetchWindowed(api, typeName, a0, b0, limit, extra, done, fail_){
    var out = [], pending = 0, failed = false, splits = 0;
    function grab(a, b, depth){
      var search = {fromDate:a, toDate:b};
      Object.keys(extra||{}).forEach(function(k){ search[k] = extra[k]; });
      pending++;
      api.call('Get', {typeName:typeName, resultsLimit:limit, search:search}, function(rows){
        rows = rows || [];
        if(rows.length >= PAGE_CAP && depth < 6){
          // At the cap, so this window is truncated: halve it and retry. Depth is
          // bounded so a pathological range cannot recurse forever.
          var mid = new Date((new Date(a).getTime() + new Date(b).getTime())/2).toISOString();
          splits++; pending--;
          grab(a, mid, depth+1); grab(mid, b, depth+1);
          return;
        }
        out = out.concat(rows);
        if(--pending === 0 && !failed) done(out, splits);
      }, function(err){
        if(failed) return;
        failed = true; fail_(err);
      });
    }
    grab(a0, b0, 0);
  }

  function fetchAll(api, jobs, done, fail_){
    var out = new Array(jobs.length), splits = 0, left = jobs.length, failed = false;
    jobs.forEach(function(j, i){
      fetchWindowed(api, j.type, j.from, j.to, j.limit, j.extra, function(rows, s){
        out[i] = rows; splits += s;
        if(--left === 0 && !failed) done(out, splits);
      }, function(err){ if(!failed){ failed = true; fail_(err); } });
    });
  }

  // ── Load: fetch only, and stash the result filter-independently ──────────
  function load(api){
    apiRef = api;
    clearNotes();
    el('sv-scope').textContent = 'Loading ' + days + ' days of events and distance…';
    el('sv-root').classList.add('busy');

    var to = new Date();
    var from = new Date(to.getTime() - days*24*3600*1000);
    var prevFrom = new Date(from.getTime() - days*24*3600*1000);
    var toISO = to.toISOString(), fromISO = from.toISOString(), prevISO = prevFrom.toISOString();

    api.multiCall([
      ['Get', {typeName:'Rule'}],
      ['Get', {typeName:'Device', resultsLimit:50000}],
      ['Get', {typeName:'DeviceStatusInfo'}],
      ['Get', {typeName:'User', search:{isDriver:true}}]
    ], function(res){
      var rules = res[0]||[], devices = res[1]||[], status = res[2]||[], users = res[3]||[];

      var rule = resolveRule(rules);
      if(!rule){
        fail('Could not find a speeding rule in this database. Looked for <b>'+
             RULE_IDS.join('</b>, <b>')+'</b> and a rule named &ldquo;Speeding&rdquo;. '+
             'Check Rules in MyGeotab.');
        return;
      }

      var ruleSearch = {ruleSearch:{id:rule.id}};
      fetchAll(api, [
        {type:'Trip',           from:fromISO, to:toISO,   limit:TRIP_LIMIT},
        {type:'Trip',           from:prevISO, to:fromISO, limit:TRIP_LIMIT},
        {type:'ExceptionEvent', from:fromISO, to:toISO,   limit:EVENT_LIMIT, extra:ruleSearch},
        {type:'ExceptionEvent', from:prevISO, to:fromISO, limit:EVENT_LIMIT, extra:ruleSearch}
      ], function(sets, splits){
        var trips = sets[0], prevTrips = sets[1], events = sets[2], prevEvents = sets[3];

        var office={}, vehName={};
        devices.forEach(function(d){
          vehName[d.id] = d.name || d.id;
          (d.groups||[]).forEach(function(g){ if(LEAF[g.id]) office[d.id] = LEAF[g.id]; });
        });

        // status.driver is a {id} object when someone is assigned, and the string
        // sentinel 'UnknownDriverId' otherwise — only objects count.
        var userName={};
        users.forEach(function(u){
          var full = ((u.firstName||'')+' '+(u.lastName||'')).trim();
          userName[u.id] = full || u.name || u.id;
        });
        var driver={};
        status.forEach(function(s){
          var did = s.device && s.device.id, d = s.driver;
          if(did && d && typeof d === 'object' && d.id) driver[did] = userName[d.id] || '';
        });

        var miles = milesByDevice(trips), spd = countByDevice(events);

        var rows = [];
        Object.keys(office).forEach(function(id){
          var mi = miles[id]||0;
          if(mi < MIN_MILES) return;
          rows.push({id:id, veh:vehName[id]||id, office:office[id], drv:driver[id]||'',
                     miles:mi, rate:Math.round((spd[id]||0)/(mi/1000)*10)/10});
        });

        // An all-zero chart is indistinguishable from a genuinely clean fleet.
        if(rows.length && !events.length){
          fail('The <b>'+esc(rule.name)+'</b> rule ('+esc(rule.id)+') returned no events in the last '+
               days+' days, so every rate would be 0. The rule may be disabled or renamed &mdash; '+
               'check Rules in MyGeotab before trusting this chart.');
          return;
        }
        if(!rows.length){
          fail('No vehicle in your data scope drove at least '+MIN_MILES+' mi in the last '+days+
               ' days, so no rate can be computed.');
          return;
        }

        DATA = {rule:rule, office:office, rows:rows,
                miles:miles, prevMiles:milesByDevice(prevTrips), prevSpd:countByDevice(prevEvents),
                nDevices:Object.keys(office).length, splits:splits};
        render();
      }, function(err){ fail('Error loading trips and events: '+esc(err)); });
    }, function(err){ fail('Error loading data: '+esc(err)); });
  }

  // ── Render: everything below here reads DATA and honours officeFilter ────
  function group(rows){
    var by = {}, dropped = [];
    rows.forEach(function(r){ (by[r.office] = by[r.office]||[]).push(r); });
    Object.keys(by).forEach(function(o){
      if(by[o].length < MIN_OFFICE_N){ dropped.push({office:o, n:by[o].length}); delete by[o]; }
    });
    var offices = Object.keys(by).sort(function(a,b){
      return median(asc(by[b].map(function(r){return r.rate;})))
           - median(asc(by[a].map(function(r){return r.rate;})));
    });
    var shown = [];
    offices.forEach(function(o){ shown = shown.concat(by[o]); });
    return {by:by, offices:offices, shown:shown, dropped:dropped};
  }

  function statsOf(rows){
    var all = asc(rows.map(function(r){return r.rate;}));
    var counts = {high:0, mod:0, low:0};
    rows.forEach(function(r){ counts[tierOf(r.rate)]++; });
    return {n:rows.length, median:median(all), p80:quantile(all,0.8), p95:quantile(all,0.95),
            max:all[all.length-1], counts:counts, trend:null};
  }

  // Trend over the device ids that make up the current view, so a filtered
  // office is compared against its own previous window rather than the fleet's.
  function trendFor(ids, curMedian){
    var prevRates = [], prevTotal = 0, curTotal = 0;
    ids.forEach(function(id){
      var pm = DATA.prevMiles[id]||0;
      prevTotal += pm; curTotal += (DATA.miles[id]||0);
      if(pm >= MIN_MILES) prevRates.push(Math.round((DATA.prevSpd[id]||0)/(pm/1000)*10)/10);
    });
    // Report WHY rather than returning a bare null. On a fleet still being
    // installed the usual reason is simply that many of today's vehicles were
    // not reporting yet, and saying so tells the manager something true instead
    // of leaving a dash they have to interpret.
    var bad = {ok:false, have:prevRates.length, of:ids.length};
    if(prevRates.length < ids.length*0.6 || prevTotal < curTotal*0.4 || prevRates.length < 8) return bad;
    var pmed = median(asc(prevRates));
    if(!(pmed > 0)) return bad;
    return {ok:true, prevMedian:pmed, delta:(curMedian-pmed)/pmed*100};
  }

  function render(){
    if(!DATA) return;
    clearNotes();
    el('sv-root').classList.remove('busy');

    // The whole fleet is grouped first, unconditionally: a filtered manager
    // still needs the fleet median to sit against and a rank to sit in.
    var G = group(DATA.rows);
    var fleet = statsOf(G.shown);
    fleet.offices = G.offices;
    fleet.worstOffice = G.offices[0];
    fleet.worstMedian = median(asc((G.by[G.offices[0]]||[]).map(function(r){return r.rate;})));
    fleet.bestOffice = G.offices[G.offices.length-1];
    fleet.bestMedian = median(asc((G.by[fleet.bestOffice]||[]).map(function(r){return r.rate;})));

    syncOfficePicker(G.offices);

    // A filter that no longer matches anything — the office fell under
    // MIN_OFFICE_N in this window — must say so rather than render an empty
    // chart that reads as "no problems here".
    var stale = officeFilter && !G.by[officeFilter];
    if(stale){
      note('sv-warn','sv-note--warn','<b>'+esc(officeFilter)+'</b> has fewer than '+MIN_OFFICE_N+
        ' rateable vehicles in this window, so it cannot show a distribution. Showing all offices.');
      officeFilter = '';
      syncOfficePicker(G.offices);
    }

    var byOffice, offices;
    if(officeFilter){
      byOffice = {}; byOffice[officeFilter] = G.by[officeFilter];
      offices = [officeFilter];
    } else {
      byOffice = G.by; offices = G.offices;
    }
    var viewRows = [];
    offices.forEach(function(o){ viewRows = viewRows.concat(byOffice[o]); });

    var stats = statsOf(viewRows);
    stats.trend = trendFor(viewRows.map(function(r){ return r.id; }), stats.median);

    lastRows = viewRows.slice().sort(function(a,b){ return b.rate - a.rate; });

    el('sv-scope').innerHTML =
      stats.n+' vehicles &middot; '+
      (officeFilter ? esc(officeFilter)+' only' : offices.length+' offices')+
      ' &middot; previous '+days+' days &middot; your data scope &middot; rule: '+esc(DATA.rule.name);

    renderKpis(stats, fleet);
    lastChart = {byOffice:byOffice, offices:offices, stats:stats, fleetMedian:fleet.median};
    var meta = renderChart(byOffice, offices, stats, fleet.median);
    renderTable(lastRows);

    // Footer: outliers named rather than left to stretch the axis, and every
    // exclusion disclosed. A hidden office reads as an office with no problem.
    var foot = [];
    if(meta.over.length){
      var names = meta.over.slice().sort(function(a,b){return b.rate-a.rate;})
        .map(function(r){ return esc(r.veh)+' ('+fmt(r.rate)+')'; });
      foot.push('<b>'+meta.over.length+' vehicle'+(meta.over.length>1?'s':'')+
        ' above '+meta.visMax+'</b>, pinned at the axis edge: '+names.join(', ')+'.');
    }
    var thin = offices.filter(function(o){ return byOffice[o].length < LOW_SAMPLE_N; });
    if(thin.length){
      foot.push('<b>Thin sample:</b> '+thin.map(esc).join(', ')+
        ' have fewer than '+LOW_SAMPLE_N+' vehicles, so their medians move easily.');
    }
    // Exposure, not sample size: a rate with miles in the denominator swings on
    // a single event when the denominator is small. At 250 mi one extra event
    // moves a vehicle 4 points; at 100 mi it moves it 10. This bites hardest on
    // the 7-day view, which is exactly when someone is most tempted to act on it.
    var thinMi = viewRows.filter(function(r){ return r.miles < THIN_MILES; }).length;
    if(thinMi){
      foot.push('<b>'+thinMi+' of '+stats.n+' vehicles drove under '+THIN_MILES+' mi</b> in this '+
        days+'-day window, so one extra event moves them '+
        Math.round(1000/THIN_MILES)+'+ points. Prefer a longer window before coaching on those.');
    }
    if(!officeFilter && G.dropped.length){
      var hiddenVeh = DATA.rows.length - G.shown.length;
      foot.push('<b>'+G.dropped.length+' office'+(G.dropped.length>1?'s':'')+' hidden</b> ('+hiddenVeh+
        ' vehicle'+(hiddenVeh===1?'':'s')+') with fewer than '+MIN_OFFICE_N+' vehicles: '+
        G.dropped.map(function(d){ return esc(d.office)+' ('+d.n+')'; }).join(', ')+'.');
    }
    var scopeN = officeFilter
      ? Object.keys(DATA.office).filter(function(id){ return DATA.office[id]===officeFilter; }).length
      : DATA.nDevices;
    var noMiles = scopeN - (officeFilter
      ? DATA.rows.filter(function(r){ return r.office===officeFilter; }).length
      : DATA.rows.length);
    if(noMiles > 0){
      foot.push(noMiles+' vehicle'+(noMiles===1?'':'s')+' in scope drove under '+MIN_MILES+
        ' mi in the window and cannot be rated.');
    }
    var unassigned = viewRows.filter(function(r){ return !r.drv; }).length;
    if(unassigned){
      foot.push('<b>'+unassigned+' of '+stats.n+' vehicles have no driver assigned</b> in Geotab '+
        '(hollow dots), so their events cannot be attributed to a person.');
    }
    el('sv-foot').innerHTML = foot.join('<br>');

    // Drift is a question about the POLICY thresholds, so it is always judged on
    // the whole fleet — one small office sitting entirely in one band says
    // nothing about whether the bands still discriminate.
    var drift = checkDrift(fleet);
    if(drift && !stale){
      note('sv-warn','sv-note--warn',
        '<b>Band thresholds look stale.</b> '+Math.round(drift.share*100)+
        '% of vehicles now fall in a single band, so the bands no longer separate anything. '+
        'They were derived on '+TIERS_DERIVED_ON+'; this window’s median is '+fmt(fleet.median)+
        ' and p80 is '+fmt(fleet.p80)+', suggesting <b>LO='+drift.lo+', HI='+drift.hi+'</b>. '+
        'Update <code>LO</code>/<code>HI</code> in violin.html and the band note in README.md.');
    }
  }

  // ── Chrome ───────────────────────────────────────────────────────────────
  // Options are rebuilt from whatever offices this window can actually show, so
  // the list never offers a choice that would render an empty chart. Sorted
  // alphabetically rather than by rate: a manager is looking up their own
  // office by name, not scanning a ranking.
  function syncOfficePicker(offices){
    var sel = el('sv-office');
    if(!sel) return;
    var want = offices.slice().sort();
    var have = Array.prototype.slice.call(sel.options, 1).map(function(o){ return o.value; });
    if(have.join('␀') !== want.join('␀')){
      sel.innerHTML = '<option value="">All offices</option>' +
        want.map(function(o){ return '<option value="'+esc(o)+'">'+esc(o)+'</option>'; }).join('');
    }
    sel.value = officeFilter;
    sel.parentNode.className = 'sv-officepick' + (officeFilter ? ' on' : '');
  }

  function wireOfficePicker(){
    el('sv-office').addEventListener('change', function(e){
      officeFilter = e.target.value || '';
      // No refetch: load() already holds every office, so this is pure re-render.
      render();
    });
  }

  function buildPeriods(){
    var host = el('sv-periods');
    host.innerHTML = PERIODS.map(function(d){
      return '<button type="button" data-d="'+d+'" aria-pressed="'+(d===days)+'">'+d+'d</button>';
    }).join('');
    host.querySelectorAll('button').forEach(function(b){
      b.addEventListener('click', function(){
        var d = parseInt(b.getAttribute('data-d'), 10);
        if(d === days) return;
        days = d;
        host.querySelectorAll('button').forEach(function(x){
          x.setAttribute('aria-pressed', String(parseInt(x.getAttribute('data-d'),10) === days));
        });
        if(apiRef) load(apiRef);
      });
    });
  }

  // ApexCharts only reflows on a window resize, but this pane changes width on
  // its own — collapsing the MyGeotab sidebar, or a split-screen drag, resizes
  // the container without a window event. Watch the container instead and
  // re-render, which also re-picks the responsive gutter and lane height.
  function watchResize(){
    var card = el('sv-chart').parentNode;
    lastWidth = card.clientWidth;
    // Compare against the width the chart was last actually RENDERED at, not
    // the last width observed. Marking the observed width as handled before the
    // debounced render runs leaves the handler convinced it is already done if
    // that render is superseded or throws, and it then never retries — the
    // chart stays frozen at a stale size. Keyed on the rendered width this
    // self-heals: any tick that finds a mismatch tries again.
    onResize = function(){
      var w = card.clientWidth;
      if(!lastChart || !w || Math.abs(w - lastWidth) < 16) return;
      clearTimeout(resizeTimer);
      // Never rebuild the chart out from under a pointer that is on it — that
      // destroys the element the tooltip is anchored to. Wait for mouseleave.
      function attempt(){
        if(pointerInChart){ resizeTimer = setTimeout(attempt, 250); return; }
        if(lastChart) renderChart(lastChart.byOffice, lastChart.offices, lastChart.stats,
                                  lastChart.fleetMedian);
      }
      resizeTimer = setTimeout(attempt, 140);
    };
    card.addEventListener('mouseenter', function(){ pointerInChart = true; });
    card.addEventListener('mouseleave', function(){ pointerInChart = false; onResize(); });
    if(typeof ResizeObserver === 'function'){
      // Held in a variable on purpose: an unreferenced ResizeObserver can be
      // garbage collected and silently stop firing.
      resizeObs = new ResizeObserver(onResize);
      resizeObs.observe(card);
    }
    window.addEventListener('resize', onResize);
    startPoll();
  }

  // ResizeObserver delivery is tied to the animation-frame loop, so it goes
  // quiet wherever frames aren't being produced — a backgrounded tab, and some
  // embedded/iframe contexts. This poll is one clientWidth read and makes the
  // behavior independent of that; onResize itself ignores sub-16px changes, so
  // a tick where nothing moved costs nothing.
  function startPoll(){
    if(resizePoll || !onResize) return;
    resizePoll = setInterval(onResize, 400);
  }
  function stopPoll(){
    if(resizePoll){ clearInterval(resizePoll); resizePoll = null; }
  }

  function wireTools(){
    var t = el('sv-toggle');
    t.addEventListener('click', function(){
      var w = el('sv-tablewrap'), on = w.classList.toggle('on');
      t.textContent = on ? 'Hide table' : 'Show table';
    });
    el('sv-csv').addEventListener('click', exportCsv);
  }

  return {
    initialize: function(api, state, cb){
      injectStyles(); buildPeriods(); wireOfficePicker(); wireTools(); watchResize(); cb();
    },
    focus: function(api, state){ stateRef = state; startPoll(); load(api); },
    // MyGeotab calls blur() when the user navigates away — stop polling rather
    // than leaving a timer running behind another page.
    blur: function(){ stopPoll(); }
  };
};
</script>
</body>
</html>

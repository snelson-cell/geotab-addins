<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.49.1/dist/apexcharts.min.js"></script>
<style>
/* Light surface only, on purpose: this renders inside MyGeotab's light chrome
   and has no independent theme context to respond to. */
#sv-root{
  --surface-1:#fcfcfb; --page:#f9f9f7;
  --ink-1:#0b0b0b; --ink-2:#52514e; --ink-3:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --hairline:rgba(11,11,11,.10);
  --good:#0ca30c; --warning:#fab219; --critical:#d03b3b;
  --good-ink:#0a6b18; --warning-ink:#7a5300; --critical-ink:#9b2626;
  --accent:#2a78d6;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--ink-1); background:var(--page); padding:18px 20px 28px; max-width:1120px;
}
#sv-root *{box-sizing:border-box;}
.sv-h1{font-size:19px;font-weight:650;margin:0;letter-spacing:-.01em;}
.sv-scope{font-size:12.5px;color:var(--ink-3);margin:3px 0 0;}
.sv-topbar{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:12px;}
.sv-periods{display:inline-flex;border:1px solid var(--axis);border-radius:7px;overflow:hidden;background:var(--surface-1);}
.sv-periods button{border:0;background:transparent;color:var(--ink-2);font:inherit;font-size:12.5px;
  font-weight:600;padding:6px 12px;cursor:pointer;border-right:1px solid var(--grid);}
.sv-periods button:last-child{border-right:0;}
.sv-periods button[aria-pressed="true"]{background:var(--accent);color:#fff;}

.sv-note{font-size:12.5px;border-radius:7px;padding:9px 12px;margin:12px 0 0;display:none;
  border:1px solid var(--hairline);background:var(--surface-1);color:var(--ink-2);}
.sv-note.on{display:block;}
.sv-note b{color:var(--ink-1);}
.sv-note--warn{background:#fdf6e3;border-color:#efdca8;color:var(--warning-ink);}
.sv-note--stop{background:#fbece8;border-color:#f0cfc7;color:var(--critical-ink);}

/* Tier 1 --------------------------------------------------------------- */
.sv-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:12px;margin:14px 0 0;}
.sv-kpi{background:var(--surface-1);border:1px solid var(--hairline);border-radius:9px;padding:13px 15px 14px;}
.sv-kpi-label{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink-3);display:flex;align-items:center;gap:5px;}
.sv-kpi-value{font-size:29px;font-weight:640;line-height:1.12;margin:7px 0 0;letter-spacing:-.02em;}
.sv-kpi-value.sm{font-size:21px;}
.sv-kpi-sub{font-size:12px;color:var(--ink-2);margin:4px 0 0;line-height:1.4;}
.sv-kpi-sub .muted{color:var(--ink-3);}
.sv-dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none;}
.sv-action{font-size:12.5px;color:var(--ink-2);background:var(--surface-1);border:1px solid var(--hairline);
  border-left:3px solid var(--accent);border-radius:7px;padding:9px 13px;margin:12px 0 0;}

/* Tier 2 --------------------------------------------------------------- */
.sv-chartcard{background:var(--surface-1);border:1px solid var(--hairline);border-radius:9px;
  margin:14px 0 0;padding:14px 4px 6px;overflow-x:auto;}
.sv-legend{display:flex;flex-wrap:wrap;gap:16px;padding:0 14px 4px;font-size:12px;color:var(--ink-2);}
.sv-legend span{display:inline-flex;align-items:center;gap:6px;}
.sv-swatch{width:11px;height:11px;border-radius:50%;flex:none;}
.sv-swatch.hollow{background:transparent;border:2px solid var(--ink-2);}
.sv-swatch.filled{background:var(--ink-2);opacity:.62;}
.sv-swatch.med{border-radius:2px;background:var(--accent);width:10px;height:10px;}
.sv-swatch.zone{border-radius:3px;width:12px;height:12px;opacity:.5;}
.sv-swatch.dash{border-radius:0;width:14px;height:0;border-top:2px dashed var(--accent);}
.sv-sep{width:1px;height:14px;background:var(--grid);}
#sv-chart{min-width:640px;}

.sv-foot{font-size:12px;color:var(--ink-3);margin:10px 2px 0;line-height:1.55;}
.sv-foot b{color:var(--ink-2);font-weight:600;}
.sv-linkbtn{background:none;border:0;padding:0;font:inherit;color:var(--accent);cursor:pointer;text-decoration:underline;}

/* Tier 3 --------------------------------------------------------------- */
.sv-tablehead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:20px 0 0;}
.sv-tabletitle{font-size:14px;font-weight:650;}
.sv-tools{display:flex;gap:8px;}
.sv-tools button{font:inherit;font-size:12.5px;font-weight:600;color:var(--ink-2);background:var(--surface-1);
  border:1px solid var(--axis);border-radius:6px;padding:5px 11px;cursor:pointer;}
.sv-tablewrap{margin:9px 0 0;border:1px solid var(--hairline);border-radius:9px;overflow:auto;
  max-height:420px;background:var(--surface-1);display:none;}
.sv-tablewrap.on{display:block;}
table.sv-t{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums;}
table.sv-t th{position:sticky;top:0;background:var(--surface-1);text-align:left;font-size:10.5px;
  letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:9px 12px;
  border-bottom:1px solid var(--grid);white-space:nowrap;z-index:1;}
table.sv-t td{padding:8px 12px;border-bottom:1px solid var(--grid);color:var(--ink-2);white-space:nowrap;}
table.sv-t tr:last-child td{border-bottom:0;}
table.sv-t tr.clickable{cursor:pointer;}
table.sv-t tr.clickable:hover td{background:#f2f5fa;}
table.sv-t td.veh{color:var(--ink-1);font-weight:600;}
table.sv-t td.num{text-align:right;}
.sv-tier{display:inline-flex;align-items:center;gap:6px;font-weight:600;}
.sv-tier.high{color:var(--critical-ink);} .sv-tier.mod{color:var(--warning-ink);} .sv-tier.low{color:var(--good-ink);}
</style>
</head>
<body>
<div id="sv-root">
  <div class="sv-topbar">
    <div>
      <h2 class="sv-h1">Fleet speeding risk</h2>
      <div class="sv-scope" id="sv-scope">Loading…</div>
    </div>
    <div class="sv-periods" id="sv-periods" role="group" aria-label="Time range"></div>
  </div>

  <div class="sv-note" id="sv-stop"></div>
  <div class="sv-note" id="sv-warn"></div>

  <div class="sv-kpis" id="sv-kpis"></div>
  <div class="sv-action" id="sv-action"></div>

  <div class="sv-chartcard">
    <div class="sv-legend" id="sv-legend"></div>
    <div id="sv-chart"></div>
  </div>
  <div class="sv-foot" id="sv-foot"></div>

  <div class="sv-tablehead">
    <div class="sv-tabletitle">Every vehicle</div>
    <div class="sv-tools">
      <button type="button" id="sv-toggle">Show table</button>
      <button type="button" id="sv-csv">Export CSV</button>
    </div>
  </div>
  <div class="sv-tablewrap" id="sv-tablewrap"></div>
</div>

<script>
geotab.addin.speedingViolin = function () {
  'use strict';

  // ── Configuration ────────────────────────────────────────────────────────
  var PERIODS = [30, 60, 90];
  var MIN_MILES = 50;        // below this in-window = too little exposure to rate
  var MIN_OFFICE_N = 3;      // below this an office can't show a distribution…
  var LOW_SAMPLE_N = 10;     // …and below this it's shown but flagged as thin
  var EVENT_LIMIT = 50000, TRIP_LIMIT = 50000;

  // Tier boundaries are POLICY, not a description of the data: they are fixed so
  // "High" means the same thing to every viewer regardless of data scope, and
  // comparable month over month. They were derived from the fleet median / p80
  // on 2026-07-30. This database is young, so they WILL drift — checkDrift()
  // below recomputes the empirical median/p80 on every render and says so out
  // loud when the configured values stop discriminating. Update them here, and
  // in README.md, when that fires.
  var LO = 10, HI = 40;
  var TIERS_DERIVED_ON = '2026-07-30';

  var ACTION = 'Vehicles above ' + HI + ' events per 1,000 mi are flagged for coaching review.';

  // Which Geotab rule counts as "speeding". Resolved at runtime rather than
  // hardcoded: a rule deleted in MyGeotab takes its exception events with it and
  // Get returns [] rather than an error, which once rendered a plausible-looking
  // chart of all zeros. Preferred ids first, then a name match.
  var RULE_IDS = ['RulePostedSpeedingId', 'RuleGpsSpeedingWindowId'];
  var RULE_NAME = /^speeding$/i;

  var LEAF = {b27AB:'Orlando',b27AC:'Tampa',b27AD:'ATL North',b27AE:'ATL South',b27AF:'Chicago',
              b27B0:'Indianapolis',b27B1:'N Indiana',b27B2:'Louisville',b27B3:'Detroit',
              b27B4:'Grand Rapids',b27B5:'Cincinnati',b27B6:'Cleveland',b27B7:'Columbus',
              b27B8:'American Fork'};

  var KM_TO_MI = 0.621371;
  var C = {good:'#0ca30c', warning:'#fab219', critical:'#d03b3b',
           ink1:'#0b0b0b', ink2:'#52514e', ink3:'#898781',
           grid:'#e1e0d9', accent:'#2a78d6', surface:'#fcfcfb'};

  var chart = null, days = 30, apiRef = null, stateRef = null, lastRows = [];

  // ── Small helpers ────────────────────────────────────────────────────────
  function el(id){ return document.getElementById(id); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function asc(a){ return a.slice().sort(function(x,y){return x-y;}); }
  function quantile(sorted, p){
    if(!sorted.length) return 0;
    var i = (sorted.length-1)*p, lo = Math.floor(i), hi = Math.ceil(i);
    return lo===hi ? sorted[lo] : sorted[lo]+(sorted[hi]-sorted[lo])*(i-lo);
  }
  function median(sorted){ return quantile(sorted, 0.5); }
  function fmt(v){ return (Math.round(v*10)/10).toLocaleString(); }
  // Snap a derived threshold to a value a human would actually choose.
  var NICE = [1,2,3,5,8,10,15,20,25,30,40,50,75,100,150,200,250,400,500,750,1000];
  function niceNear(v){
    var best = NICE[0];
    for(var i=0;i<NICE.length;i++){ if(Math.abs(NICE[i]-v) < Math.abs(best-v)) best = NICE[i]; }
    return best;
  }
  function niceCeil(v){
    for(var i=0;i<NICE.length;i++){ if(NICE[i] >= v) return NICE[i]; }
    return Math.ceil(v/100)*100;
  }
  // Pick the axis maximum FROM a round tick step rather than rounding the max
  // and dividing — dividing is what produces ticks like 0/23/45/68/90. Returns
  // the smallest round step giving at most 8 intervals.
  var AXIS_STEPS = [1,2,5,10,20,25,50,100,200,250,500,1000];
  function axisScale(raw){
    for(var i=0;i<AXIS_STEPS.length;i++){
      var s = AXIS_STEPS[i], max = Math.ceil(raw/s)*s;
      if(max/s <= 8) return {max:max, ticks:max/s};
    }
    var s2 = Math.ceil(raw/8/1000)*1000;
    return {max:s2*8, ticks:8};
  }
  function tierOf(r){ return r>=HI ? 'high' : (r>=LO ? 'mod' : 'low'); }

  function note(id, cls, html){
    var n = el(id);
    n.className = 'sv-note on' + (cls ? ' ' + cls : '');
    n.innerHTML = html;
  }
  function clearNotes(){
    ['sv-stop','sv-warn'].forEach(function(id){ var n=el(id); n.className='sv-note'; n.innerHTML=''; });
  }
  function fail(html){
    el('sv-kpis').innerHTML=''; el('sv-action').style.display='none';
    el('sv-legend').innerHTML=''; el('sv-foot').innerHTML='';
    if(chart){ chart.destroy(); chart=null; }
    el('sv-chart').innerHTML='';
    note('sv-stop','sv-note--stop', html);
  }

  // ── Tier 1 ───────────────────────────────────────────────────────────────
  function kpi(label, dotColor, value, small, sub){
    return '<div class="sv-kpi"><div class="sv-kpi-label">'+
      (dotColor ? '<span class="sv-dot" style="background:'+dotColor+'"></span>' : '')+
      esc(label)+'</div><div class="sv-kpi-value'+(small?' sm':'')+'">'+value+'</div>'+
      '<div class="sv-kpi-sub">'+sub+'</div></div>';
  }

  function renderKpis(stats){
    var cards = [];

    // 1. Where the fleet sits, against the policy target.
    var medTier = tierOf(stats.median);
    cards.push(kpi('Fleet median',
      medTier==='high'?C.critical:medTier==='mod'?C.warning:C.good,
      fmt(stats.median),
      false,
      'events per 1,000 mi &middot; <span class="muted">target under '+LO+'</span>'));

    // 2. The number that drives action.
    cards.push(kpi('High risk', C.critical,
      String(stats.counts.high),
      false,
      'vehicles at or above '+HI+' &middot; <span class="muted">'+
      Math.round(stats.counts.high/Math.max(stats.n,1)*100)+'% of '+stats.n+'</span>'));

    // 3. Where to look first.
    var cmp = stats.bestMedian > 0
      ? fmt(stats.worstMedian/stats.bestMedian)+'&times; '+esc(stats.bestOffice)
      : esc(stats.bestOffice)+' at '+fmt(stats.bestMedian);
    cards.push(kpi('Worst office', null, esc(stats.worstOffice), true,
      'median '+fmt(stats.worstMedian)+' &middot; <span class="muted">vs '+cmp+'</span>'));

    // 4. Direction of travel — suppressed rather than guessed when the previous
    //    window is too thin to compare, which is common in a young database.
    if(stats.trend){
      var t = stats.trend, up = t.delta > 0;
      cards.push(kpi('vs prior '+days+'d', up?C.critical:C.good,
        (up?'&#9650; +':'&#9660; ')+Math.round(Math.abs(t.delta))+'%', false,
        (up?'worsening':'improving')+' &middot; <span class="muted">was '+fmt(t.prevMedian)+'</span>'));
    } else {
      cards.push(kpi('vs prior '+days+'d', null, '&mdash;', true,
        '<span class="muted">not enough history in the previous window to compare</span>'));
    }
    el('sv-kpis').innerHTML = cards.join('');
    el('sv-action').style.display = '';
    el('sv-action').textContent = ACTION;
  }

  // ── Tier 2 ───────────────────────────────────────────────────────────────
  function renderChart(byOffice, offices, stats){
    var n = offices.length;
    var LANE = 92, JIT = 0.21;
    var H = n*LANE + 96;
    var perUnit = (H-96)/(n+0.6);

    // Clamp the axis when a thin tail is stretching it — otherwise the bulk of
    // the fleet is squeezed into a sliver. Clamped vehicles are pinned at the
    // edge and always named in the footer, never silently dropped. Adaptive on
    // purpose: with a young database the shape of the distribution is moving.
    var clamp = stats.p95 > 0 && stats.max > stats.p95*1.6;
    var scale = axisScale(Math.max(clamp ? stats.p95*1.08 : stats.max*1.06, HI*1.5));
    var visMax = scale.max;
    var over = [];

    // Color is deliberately NOT tier here: tier is a pure function of x, so
    // painting it on the dots spends the only free channel restating the axis.
    // The zones carry tier (large regions + text labels, so it survives every
    // colour-vision deficiency), and fill/hollow carries whether Geotab has a
    // driver attached — a data-quality gap that matters in a new deployment.
    var withDrv = [], noDrv = [], medPts = [];
    offices.forEach(function(off, i){
      var vals = byOffice[off];
      var rates = asc(vals.map(function(r){return r.rate;}));
      var min = rates[0], max = rates[rates.length-1];
      var bins = 14, bw = ((max-min)/bins)||1;
      var counts = new Array(bins).fill(0);
      rates.forEach(function(v){ counts[Math.min(bins-1,Math.floor((v-min)/bw))]++; });
      var maxc = Math.max.apply(null,counts)||1;
      var yc = n - i;
      vals.forEach(function(r){
        var v = r.rate;
        var dens = counts[Math.min(bins-1,Math.floor((v-min)/bw))]/maxc;
        var jit = (Math.random()*2-1)*dens*JIT;
        var x = v, off_scale = false;
        if(x > visMax){ x = visMax; off_scale = true; over.push(r); }
        var pt = {x:x, y:+(yc+jit).toFixed(3), office:off, veh:r.veh, drv:r.drv,
                  rate:r.rate, miles:r.miles, id:r.id, off_scale:off_scale};
        (r.drv ? withDrv : noDrv).push(pt);
      });
      medPts.push({x: median(rates), y: yc, off: off});
    });

    var series = [
      {name:'Vehicle (driver assigned)', data:withDrv},
      {name:'Vehicle (no driver assigned)', data:noDrv}
    ];

    // Zones carry the risk read. Labels are kept short so they fit inside a
    // narrow band; the numeric boundaries live in the legend strip above, where
    // each status colour is paired with its text (a status colour must never
    // carry meaning by hue alone).
    function zone(x, x2, color, opacity, text, ink){
      return {x:x, x2:x2, fillColor:color, opacity:opacity, borderWidth:0,
        label:{text:text, orientation:'horizontal', position:'top', offsetY:-6,
          textAnchor:'start', offsetX:7, borderWidth:0,
          style:{background:'transparent', color:ink, fontSize:'10.5px', fontWeight:700}}};
    }
    var zones = [
      zone(0, Math.min(LO,visMax), C.good, 0.07, 'SAFE', '#0a6b18'),
      zone(Math.min(LO,visMax), Math.min(HI,visMax), C.warning, 0.11, 'WATCH', '#7a5300'),
      zone(Math.min(HI,visMax), visMax, C.critical, 0.09, 'HIGH RISK', '#9b2626')
    ];
    // The empirical benchmark, drawn on top of the policy zones. Left unlabelled
    // in-plot — near the low end it lands on the axis ticks — and named in the
    // legend instead.
    zones.push({x:stats.median, strokeDashArray:5, borderColor:C.accent, borderWidth:1.5});

    // Office labels live in a left gutter, outside the plot: as in-plot
    // annotations they collided with the marks and the tooltip.
    var GUTTER = 132, anns = [];
    offices.forEach(function(off, i){
      var y = n - i, thin = byOffice[off].length < LOW_SAMPLE_N;
      anns.push({y:y, borderColor:'transparent', label:{
        text:off, position:'left', textAnchor:'start', offsetX:-GUTTER, offsetY:-2,
        borderWidth:0, style:{background:'transparent', color:C.ink1,
        fontSize:'13px', fontWeight:700}}});
      anns.push({y:y, borderColor:'transparent', label:{
        text:'n='+byOffice[off].length+'  med '+fmt(median(asc(byOffice[off].map(function(r){return r.rate;}))))
             + (thin ? '  · thin' : ''),
        position:'left', textAnchor:'start', offsetX:-GUTTER, offsetY:14,
        borderWidth:0, style:{background:'transparent', color: thin ? C.warning : C.ink3,
        fontSize:'11px', fontWeight:600}}});
      if(i < n-1) anns.push({y:y-0.5, borderColor:C.grid, strokeDashArray:0});
    });

    var points = medPts.map(function(m){
      return {x:m.x, y:m.y, marker:{size:5.5, shape:'square', fillColor:C.accent,
              strokeColor:C.surface, strokeWidth:2}};
    });

    if(chart){ chart.destroy(); }
    chart = new ApexCharts(el('sv-chart'), {
      chart:{type:'scatter', height:H, toolbar:{show:false}, fontFamily:'inherit',
        animations:{enabled:false},
        events:{ dataPointSelection: function(e, ctx, cfg){
          var p = cfg.w.config.series[cfg.seriesIndex].data[cfg.dataPointIndex];
          if(p && p.id) goToDevice(p.id);
        }}},
      series:series,
      colors:[C.ink2, C.ink2],
      markers:{ size:6, strokeWidth:[0,2], strokeColors:[C.surface, C.ink2],
        fillOpacity:[0.62,0], hover:{sizeOffset:3} },
      xaxis:{ min:0, max:visMax, tickAmount:scale.ticks,
        title:{text:'Speeding events per 1,000 mi',
          style:{fontSize:'12px', fontWeight:600, color:C.ink2}},
        axisBorder:{color:C.axis}, axisTicks:{color:C.axis},
        labels:{ style:{colors:C.ink3, fontSize:'11.5px'},
          formatter:function(v){ return Math.round(v); } } },
      yaxis:{ min:0.35, max:n+0.65, labels:{show:false}, axisTicks:{show:false}, axisBorder:{show:false} },
      annotations:{ xaxis:zones, yaxis:anns, points:points },
      legend:{show:false},
      grid:{ borderColor:C.grid, xaxis:{lines:{show:true}}, yaxis:{lines:{show:false}},
        padding:{left:GUTTER, right:18, top:8} },
      tooltip:{ custom:function(o){
        var p = o.w.config.series[o.seriesIndex].data[o.dataPointIndex];
        var t = tierOf(p.rate), tName = t==='high'?'High':t==='mod'?'Watch':'Safe';
        var tCol = t==='high'?'#9b2626':t==='mod'?'#7a5300':'#0a6b18';
        return '<div style="padding:8px 11px;font-size:12px;line-height:1.5">'+
          '<b>'+esc(p.veh)+'</b> &middot; '+esc(p.office)+'<br>'+
          (p.drv ? '<span style="color:#52514e">current driver:</span> '+esc(p.drv)
                 : '<span style="color:#898781">no driver assigned</span>')+'<br>'+
          '<b>'+fmt(p.rate)+'</b> per 1,000 mi <span style="color:#898781">over '+
          Math.round(p.miles).toLocaleString()+' mi</span><br>'+
          '<span style="color:'+tCol+';font-weight:600">'+tName+'</span>'+
          (p.off_scale ? '<br><span style="color:#9b2626">beyond axis — pinned at '+visMax+'</span>' : '')+
          '<br><span style="color:#898781;font-size:11px">click to open the vehicle</span></div>';
      }}
    });
    chart.render();

    el('sv-legend').innerHTML =
      '<span><i class="sv-swatch zone" style="background:'+C.good+'"></i>Safe &mdash; under '+LO+'</span>'+
      '<span><i class="sv-swatch zone" style="background:'+C.warning+'"></i>Watch &mdash; '+LO+' to '+(HI-1)+'</span>'+
      '<span><i class="sv-swatch zone" style="background:'+C.critical+'"></i>High risk &mdash; '+HI+' and above</span>'+
      '<span class="sv-sep"></span>'+
      '<span><i class="sv-swatch filled"></i>Vehicle &mdash; driver assigned</span>'+
      '<span><i class="sv-swatch hollow"></i>Vehicle &mdash; no driver assigned</span>'+
      '<span><i class="sv-swatch med"></i>Office median</span>'+
      '<span><i class="sv-swatch dash"></i>Fleet median '+fmt(stats.median)+'</span>';

    return {over:over, visMax:visMax, clamped:clamp};
  }

  // ── Tier 3 ───────────────────────────────────────────────────────────────
  function goToDevice(id){
    if(stateRef && typeof stateRef.gotoPage === 'function'){
      try { stateRef.gotoPage('device', {id:id}); } catch(e){}
    }
  }

  function renderTable(rows){
    var head = '<table class="sv-t"><thead><tr><th>Vehicle</th><th>Office</th><th>Driver</th>'+
      '<th style="text-align:right">Miles</th><th style="text-align:right">Rate</th><th>Tier</th></tr></thead><tbody>';
    var body = rows.map(function(r){
      var t = tierOf(r.rate), tName = t==='high'?'High':t==='mod'?'Watch':'Safe';
      var tCol = t==='high'?C.critical:t==='mod'?C.warning:C.good;
      return '<tr class="clickable" data-id="'+esc(r.id)+'">'+
        '<td class="veh">'+esc(r.veh)+'</td><td>'+esc(r.office)+'</td>'+
        '<td>'+(r.drv ? esc(r.drv) : '<span style="color:#898781">unassigned</span>')+'</td>'+
        '<td class="num">'+Math.round(r.miles).toLocaleString()+'</td>'+
        '<td class="num"><b>'+fmt(r.rate)+'</b></td>'+
        '<td><span class="sv-tier '+t+'"><span class="sv-dot" style="background:'+tCol+'"></span>'+
        tName+'</span></td></tr>';
    }).join('');
    var w = el('sv-tablewrap');
    w.innerHTML = head + body + '</tbody></table>';
    w.querySelectorAll('tr.clickable').forEach(function(tr){
      tr.addEventListener('click', function(){ goToDevice(tr.getAttribute('data-id')); });
    });
  }

  function exportCsv(){
    if(!lastRows.length) return;
    var lines = [['Vehicle','Office','Driver','Miles','Events per 1000 mi','Tier','Window (days)'].join(',')];
    lastRows.forEach(function(r){
      var t = tierOf(r.rate);
      lines.push([r.veh, r.office, r.drv||'unassigned', Math.round(r.miles), fmt(r.rate),
        t==='high'?'High':t==='mod'?'Watch':'Safe', days]
        .map(function(v){ return '"'+String(v).replace(/"/g,'""')+'"'; }).join(','));
    });
    try {
      var blob = new Blob([lines.join('\n')], {type:'text/csv;charset=utf-8;'});
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'speeding-rate-'+days+'d.csv';
      document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 0);
    } catch(e){
      note('sv-warn', null, 'Could not start the download in this browser. Use <b>Show table</b> and copy the rows.');
    }
  }

  // ── Threshold drift ──────────────────────────────────────────────────────
  // The whole point: thresholds may go stale, but they must not do it silently.
  function checkDrift(stats){
    var share = Math.max(stats.counts.high, stats.counts.mod, stats.counts.low) / Math.max(stats.n,1);
    var sLO = niceNear(stats.median), sHI = niceNear(stats.p80);
    if(sHI <= sLO) sHI = niceCeil(sLO*2);
    if(share < 0.85 || stats.n < 12) return null;
    return {lo:sLO, hi:sHI, share:share};
  }

  // ── Data ─────────────────────────────────────────────────────────────────
  function resolveRule(rules){
    var byId = {};
    (rules||[]).forEach(function(r){ if(r && r.id) byId[r.id] = r; });
    for(var i=0;i<RULE_IDS.length;i++){ if(byId[RULE_IDS[i]]) return byId[RULE_IDS[i]]; }
    var named = (rules||[]).filter(function(r){ return RULE_NAME.test(r && r.name || ''); });
    return named.length ? named[0] : null;
  }

  function milesByDevice(trips){
    var m = {};
    (trips||[]).forEach(function(t){
      var id = t.device && t.device.id;
      if(id) m[id] = (m[id]||0) + (t.distance||0)*KM_TO_MI;
    });
    return m;
  }
  function countByDevice(events){
    var c = {};
    (events||[]).forEach(function(e){
      var id = e.device && e.device.id;
      if(id) c[id] = (c[id]||0) + 1;
    });
    return c;
  }

  function load(api){
    apiRef = api;
    clearNotes();
    el('sv-scope').textContent = 'Loading ' + days + ' days of events and distance…';

    var to = new Date();
    var from = new Date(to.getTime() - days*24*3600*1000);
    var prevFrom = new Date(from.getTime() - days*24*3600*1000);
    var toISO = to.toISOString(), fromISO = from.toISOString(), prevISO = prevFrom.toISOString();

    api.multiCall([
      ['Get', {typeName:'Rule'}],
      ['Get', {typeName:'Device', resultsLimit:50000}],
      ['Get', {typeName:'DeviceStatusInfo'}],
      ['Get', {typeName:'User', search:{isDriver:true}}],
      ['Get', {typeName:'Trip', resultsLimit:TRIP_LIMIT, search:{fromDate:fromISO, toDate:toISO}}],
      ['Get', {typeName:'Trip', resultsLimit:TRIP_LIMIT, search:{fromDate:prevISO, toDate:fromISO}}]
    ], function(res){
      var rules = res[0]||[], devices = res[1]||[], status = res[2]||[], users = res[3]||[],
          trips = res[4]||[], prevTrips = res[5]||[];

      var rule = resolveRule(rules);
      if(!rule){
        fail('Could not find a speeding rule in this database. Looked for <b>'+
             RULE_IDS.join('</b>, <b>')+'</b> and a rule named &ldquo;Speeding&rdquo;. '+
             'Check Rules in MyGeotab.');
        return;
      }
      if(trips.length >= TRIP_LIMIT){
        note('sv-warn','sv-note--warn','Trip results hit the '+TRIP_LIMIT.toLocaleString()+
          ' row limit, so distances may be understated and rates overstated.');
      }

      api.multiCall([
        ['Get', {typeName:'ExceptionEvent', resultsLimit:EVENT_LIMIT,
          search:{fromDate:fromISO, toDate:toISO, ruleSearch:{id:rule.id}}}],
        ['Get', {typeName:'ExceptionEvent', resultsLimit:EVENT_LIMIT,
          search:{fromDate:prevISO, toDate:fromISO, ruleSearch:{id:rule.id}}}]
      ], function(evres){
        var events = evres[0]||[], prevEvents = evres[1]||[];
        if(events.length >= EVENT_LIMIT){
          note('sv-warn','sv-note--warn','Exception results hit the '+EVENT_LIMIT.toLocaleString()+
            ' row limit, so rates may be understated.');
        }

        var office={}, vehName={};
        devices.forEach(function(d){
          vehName[d.id] = d.name || d.id;
          (d.groups||[]).forEach(function(g){ if(LEAF[g.id]) office[d.id] = LEAF[g.id]; });
        });

        // status.driver is a {id} object when someone is assigned, and the string
        // sentinel 'UnknownDriverId' otherwise — only objects count.
        var userName={};
        users.forEach(function(u){
          var full = ((u.firstName||'')+' '+(u.lastName||'')).trim();
          userName[u.id] = full || u.name || u.id;
        });
        var driver={};
        status.forEach(function(s){
          var did = s.device && s.device.id, d = s.driver;
          if(did && d && typeof d === 'object' && d.id) driver[did] = userName[d.id] || '';
        });

        var miles = milesByDevice(trips), spd = countByDevice(events);
        var prevMiles = milesByDevice(prevTrips), prevSpd = countByDevice(prevEvents);

        var rows = [], eligible = 0;
        Object.keys(office).forEach(function(id){
          var mi = miles[id]||0;
          if(mi < MIN_MILES) return;
          eligible++;
          rows.push({id:id, veh:vehName[id]||id, office:office[id], drv:driver[id]||'',
                     miles:mi, rate:Math.round((spd[id]||0)/(mi/1000)*10)/10});
        });

        // An all-zero chart is indistinguishable from a genuinely clean fleet.
        if(eligible && !events.length){
          fail('The <b>'+esc(rule.name)+'</b> rule ('+esc(rule.id)+') returned no events in the last '+
               days+' days, so every rate would be 0. The rule may be disabled or renamed &mdash; '+
               'check Rules in MyGeotab before trusting this chart.');
          return;
        }
        if(!rows.length){
          fail('No vehicle in your data scope drove at least '+MIN_MILES+' mi in the last '+days+
               ' days, so no rate can be computed.');
          return;
        }

        var byOffice = {}, dropped = [];
        rows.forEach(function(r){ (byOffice[r.office] = byOffice[r.office]||[]).push(r); });
        Object.keys(byOffice).forEach(function(o){
          if(byOffice[o].length < MIN_OFFICE_N){
            dropped.push({office:o, n:byOffice[o].length});
            delete byOffice[o];
          }
        });
        var shownRows = [];
        Object.keys(byOffice).forEach(function(o){ shownRows = shownRows.concat(byOffice[o]); });
        var offices = Object.keys(byOffice).sort(function(a,b){
          return median(asc(byOffice[b].map(function(r){return r.rate;})))
               - median(asc(byOffice[a].map(function(r){return r.rate;})));
        });

        var all = asc(shownRows.map(function(r){return r.rate;}));
        var counts = {high:0, mod:0, low:0};
        shownRows.forEach(function(r){ counts[tierOf(r.rate)]++; });

        var stats = {
          n: shownRows.length, median: median(all), p80: quantile(all,0.8),
          p95: quantile(all,0.95), max: all[all.length-1], counts: counts,
          worstOffice: offices[0],
          worstMedian: median(asc(byOffice[offices[0]].map(function(r){return r.rate;}))),
          bestOffice: offices[offices.length-1],
          bestMedian: median(asc(byOffice[offices[offices.length-1]].map(function(r){return r.rate;}))),
          trend: null
        };

        // Trend, only where the previous window can actually support one.
        var prevRates = [], prevTotal = 0, curTotal = 0;
        Object.keys(office).forEach(function(id){
          var pm = prevMiles[id]||0;
          prevTotal += pm; curTotal += (miles[id]||0);
          if(pm >= MIN_MILES) prevRates.push(Math.round((prevSpd[id]||0)/(pm/1000)*10)/10);
        });
        if(prevRates.length >= rows.length*0.6 && prevTotal >= curTotal*0.4 && prevRates.length >= 8){
          var pmed = median(asc(prevRates));
          if(pmed > 0){
            stats.trend = {prevMedian:pmed, delta:(stats.median-pmed)/pmed*100};
          }
        }

        lastRows = shownRows.slice().sort(function(a,b){ return b.rate - a.rate; });

        el('sv-scope').innerHTML =
          stats.n+' vehicles &middot; '+offices.length+' offices &middot; previous '+days+
          ' days &middot; your data scope &middot; rule: '+esc(rule.name);

        renderKpis(stats);
        var meta = renderChart(byOffice, offices, stats);
        renderTable(lastRows);

        // Footer: outliers named rather than left to stretch the axis, and every
        // exclusion disclosed. A hidden office reads as an office with no problem.
        var foot = [];
        if(meta.over.length){
          var names = meta.over.slice().sort(function(a,b){return b.rate-a.rate;})
            .map(function(r){ return esc(r.veh)+' ('+fmt(r.rate)+')'; });
          foot.push('<b>'+meta.over.length+' vehicle'+(meta.over.length>1?'s':'')+
            ' above '+meta.visMax+'</b>, pinned at the axis edge: '+names.join(', ')+'.');
        }
        var thin = offices.filter(function(o){ return byOffice[o].length < LOW_SAMPLE_N; });
        if(thin.length){
          foot.push('<b>Thin sample:</b> '+thin.map(esc).join(', ')+
            ' have fewer than '+LOW_SAMPLE_N+' vehicles, so their medians move easily.');
        }
        var hiddenVeh = rows.length - shownRows.length;
        if(dropped.length){
          foot.push('<b>'+dropped.length+' office'+(dropped.length>1?'s':'')+' hidden</b> ('+hiddenVeh+
            ' vehicle'+(hiddenVeh===1?'':'s')+') with fewer than '+MIN_OFFICE_N+' vehicles: '+
            dropped.map(function(d){ return esc(d.office)+' ('+d.n+')'; }).join(', ')+'.');
        }
        var noMiles = Object.keys(office).length - eligible;
        if(noMiles > 0){
          foot.push(noMiles+' vehicle'+(noMiles===1?'':'s')+' in scope drove under '+MIN_MILES+
            ' mi in the window and cannot be rated.');
        }
        var unassigned = shownRows.filter(function(r){ return !r.drv; }).length;
        if(unassigned){
          foot.push('<b>'+unassigned+' of '+stats.n+' vehicles have no driver assigned</b> in Geotab '+
            '(hollow dots), so their events cannot be attributed to a person.');
        }
        el('sv-foot').innerHTML = foot.join('<br>');

        var drift = checkDrift(stats);
        if(drift){
          note('sv-warn','sv-note--warn',
            '<b>Tier thresholds look stale.</b> '+Math.round(drift.share*100)+
            '% of vehicles now fall in a single tier, so the bands no longer separate anything. '+
            'They were derived on '+TIERS_DERIVED_ON+'; this window’s median is '+fmt(stats.median)+
            ' and p80 is '+fmt(stats.p80)+', suggesting <b>LO='+drift.lo+', HI='+drift.hi+'</b>. '+
            'Update <code>LO</code>/<code>HI</code> in violin.html and the tier note in README.md.');
        }
      }, function(err){ fail('Error loading speeding events: '+esc(err)); });
    }, function(err){ fail('Error loading data: '+esc(err)); });
  }

  // ── Chrome ───────────────────────────────────────────────────────────────
  function buildPeriods(){
    var host = el('sv-periods');
    host.innerHTML = PERIODS.map(function(d){
      return '<button type="button" data-d="'+d+'" aria-pressed="'+(d===days)+'">'+d+'d</button>';
    }).join('');
    host.querySelectorAll('button').forEach(function(b){
      b.addEventListener('click', function(){
        var d = parseInt(b.getAttribute('data-d'), 10);
        if(d === days) return;
        days = d;
        host.querySelectorAll('button').forEach(function(x){
          x.setAttribute('aria-pressed', String(parseInt(x.getAttribute('data-d'),10) === days));
        });
        if(apiRef) load(apiRef);
      });
    });
  }

  function wireTools(){
    var t = el('sv-toggle');
    t.addEventListener('click', function(){
      var w = el('sv-tablewrap'), on = w.classList.toggle('on');
      t.textContent = on ? 'Hide table' : 'Show table';
    });
    el('sv-csv').addEventListener('click', exportCsv);
  }

  return {
    initialize: function(api, state, cb){ buildPeriods(); wireTools(); cb(); },
    focus: function(api, state){ stateRef = state; load(api); },
    blur: function(){}
  };
};
</script>
</body>
